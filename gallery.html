<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Room Gallery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#13111A;color:#F0EEF8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.hdr{background:linear-gradient(160deg,#1E1A2E 0%,#2A1E3F 100%);padding:22px 16px 18px;text-align:center;border-bottom:1px solid rgba(255,255,255,.07)}
.logo{font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#F97316;margin-bottom:7px;opacity:.85}
.pname{font-size:19px;font-weight:800;margin-bottom:4px;color:#fff}
.paddr{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:10px}
.badge{display:inline-block;background:linear-gradient(135deg,#7C3AED,#F97316);color:#fff;font-size:11px;font-weight:700;padding:4px 14px;border-radius:20px}
.pbadge{display:inline-block;background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.35);color:#FB923C;font-size:13px;font-weight:700;padding:5px 14px;border-radius:20px;margin-top:8px}
.gallery{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{position:relative;border-radius:12px;overflow:hidden;background:#1E1A2E;aspect-ratio:4/3;cursor:pointer;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.num{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:7px}
.empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,.3)}
.loader{text-align:center;padding:60px 20px}
.spin{width:38px;height:38px;border:3px solid rgba(249,115,22,.2);border-top-color:#F97316;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.vsect{margin:0 16px 16px;max-width:632px;margin-left:auto;margin-right:auto}
.vtitle{font-size:10px;font-weight:800;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.vwrap{border-radius:12px;overflow:hidden;background:#111;line-height:0;max-width:600px;margin:0 auto}
.vwrap video{width:100%;max-height:420px;display:block;object-fit:contain;background:#000;aspect-ratio:16/9}
.nbox{margin:0 16px 16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-left:3px solid #F97316;border-radius:10px;padding:13px 15px;font-size:13px;color:rgba(255,255,255,.65);line-height:1.6}
.mapslink{display:inline-flex;align-items:center;gap:6px;color:#FB923C;font-size:12px;text-decoration:none;margin-top:8px;padding:6px 13px;background:rgba(249,115,22,.1);border-radius:8px;border:1px solid rgba(249,115,22,.25)}
.cta{margin:16px;padding:20px 16px;background:linear-gradient(135deg,#7C3AED 0%,#F97316 100%);border-radius:16px;text-align:center}
.cta-btn{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;text-decoration:none;padding:13px 26px;border-radius:12px;font-size:14px;font-weight:800}
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:9999;align-items:center;justify-content:center;flex-direction:column}
.lb.open{display:flex}
.lb-img-wrap{position:relative;display:flex;align-items:center;justify-content:center;width:100%;flex:1;padding:60px 60px 20px}
.lb img{max-width:96vw;max-height:80vh;object-fit:contain;border-radius:8px}
.lb-x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
.lb-p,.lb-n{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb-p{left:10px}.lb-n{right:10px}
.lb-c{background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:700;padding:5px 14px;border-radius:20px;margin-bottom:20px}
.lb-thumbs{display:flex;gap:6px;padding:0 16px 16px;overflow-x:auto;max-width:100%;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.lb-thumb{width:56px;height:56px;border-radius:8px;overflow:hidden;cursor:pointer;flex-shrink:0;border:2px solid transparent;transition:border-color .15s;opacity:.6;transition:all .15s}
.lb-thumb.active{border-color:#F97316;opacity:1}
.lb-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.debug-box{margin:12px 16px;background:rgba(255,100,0,.08);border:1px solid rgba(255,100,0,.2);border-radius:8px;padding:10px 12px;font-size:11px;color:rgba(255,180,100,.7);font-family:monospace;display:none}
.footer{text-align:center;padding:24px 16px;font-size:11px;color:rgba(255,255,255,.2)}
</style>
</head>
<body>
<div class="hdr">
  <div class="logo">Reservations Direct</div>
  <div class="pname" id="pname">Loading&hellip;</div>
  <div class="paddr" id="paddr"></div>
  <div id="rinfo"></div>
  <div id="mlink"></div>
</div>
<div class="gallery" id="area"><div class="loader"><div class="spin"></div><div style="font-size:13px;color:rgba(255,255,255,.35)">Loading photos&hellip;</div></div></div>
<div id="narea"></div>
<div id="varea"></div>
<div id="cta"></div>
<div id="debug" class="debug-box"></div>
<div class="footer">Powered by PropManager &middot; Reservations Direct</div>

<!-- Lightbox -->
<div class="lb" id="lb">
  <button class="lb-x" onclick="closeLb()">&times;</button>
  <div class="lb-img-wrap">
    <button class="lb-p" onclick="lbNav(-1)">&#8249;</button>
    <img id="lbimg" src="" alt="">
    <button class="lb-n" onclick="lbNav(1)">&#8250;</button>
  </div>
  <div class="lb-c" id="lbc"></div>
  <div class="lb-thumbs" id="lb-thumbs"></div>
</div>

<script>
var SUPA_URL='https://kzumoubhxdoqqcucdact.supabase.co';
var SUPA_KEY='sb_publishable_DQeZmR_zJl4GDB0trLlhuw_N9Ja76AF';

// ── Parse URL params ──────────────────────────────────────────
var params=new URLSearchParams(location.search);
var pid    = params.get('p')     || params.get('pid')   || '';
var rn     = parseInt(params.get('r') || params.get('rn') || '0', 10);
var pname  = decodeURIComponent(params.get('pname') || '');
var paddr  = decodeURIComponent(params.get('addr')  || '');
var rtype  = decodeURIComponent(params.get('type')  || '');
var price  = params.get('price') || '';
var notes  = decodeURIComponent(params.get('notes') || '');
var mapsUrl= decodeURIComponent(params.get('maps')  || '');
var waNum  = params.get('wa') || '';

var photos=[], lbIdx=0;

// ── Debug helper ──────────────────────────────────────────────
function dbg(msg){
  var el=document.getElementById('debug');
  el.style.display='block';
  el.innerHTML+='<div>'+msg+'</div>';
}

function sleep(ms){
  return new Promise(function(resolve){ setTimeout(resolve, ms); });
}

async function listRoomMediaWithRetry(prefix){
  var maxAttempts = 4;
  var lastErr = null;
  for(var attempt=1; attempt<=maxAttempts; attempt++){
    try{
      var ctrl = new AbortController();
      var timer = setTimeout(function(){ ctrl.abort(); }, 12000);
      var listRes = await fetch(SUPA_URL+'/storage/v1/object/list/room-media', {
        method: 'POST',
        headers: {
          'apikey': SUPA_KEY,
          'Authorization': 'Bearer '+SUPA_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          prefix: prefix,
          limit: 50,
          offset: 0,
          sortBy: {column:'created_at', order:'asc'}
        }),
        signal: ctrl.signal
      });
      clearTimeout(timer);

      if(!listRes.ok){
        var errText = await listRes.text();
        var retriable = listRes.status === 544 || listRes.status >= 500 || listRes.status === 429;
        if(retriable){
          throw new Error('retriable_http_'+listRes.status+': '+errText.slice(0,180));
        }
        throw new Error('Storage list HTTP '+listRes.status+': '+errText.slice(0,180));
      }

      var files = await listRes.json();
      if(!Array.isArray(files)){
        throw new Error('Storage response not an array: '+JSON.stringify(files).slice(0,120));
      }
      return files;
    }catch(e){
      lastErr = e;
      var msg = String(e && e.message || e);
      var canRetry = attempt < maxAttempts &&
        (msg.indexOf('retriable_http_') === 0 ||
         msg.indexOf('timed out') >= 0 ||
         msg.indexOf('aborted') >= 0 ||
         msg.indexOf('Failed to fetch') >= 0 ||
         msg.indexOf('NetworkError') >= 0);
      dbg('Storage attempt '+attempt+'/'+maxAttempts+' failed: '+msg);
      if(!canRetry) break;
      await sleep(500 * Math.pow(2, attempt-1));
    }
  }
  throw lastErr || new Error('Unknown storage error');
}

// ── Address helpers ───────────────────────────────────────────
function getPostcode(addr){
  var m=(addr||'').match(/[A-Z]{1,2}\d{1,2}[A-Z]?\s?\d[A-Z]{2}/i);
  return m?m[0].toUpperCase():'';
}
function stripHouseNo(addr){
  return (addr||'').replace(/^\d+[A-Za-z]?[\s,]+/,'').trim();
}

// ── Render header ─────────────────────────────────────────────
function renderHdr(){
  document.getElementById('pname').textContent = pname || 'Available Room';
  var safeAddr = stripHouseNo(paddr);
  if(safeAddr){
    var pc = getPostcode(paddr);
    document.getElementById('paddr').textContent = '\u{1F4CD} '+safeAddr+(pc && !safeAddr.includes(pc) ? ', '+pc : '');
  }
  document.getElementById('rinfo').innerHTML =
    '<div class="badge">\u{1F6CF}\uFE0F '+(rtype||'Room')+(rn?' &middot; Room '+rn:'')+' </div>'+
    (price ? '<br><div class="pbadge">&pound;'+price+'/wk</div>' : '');
  if(mapsUrl) document.getElementById('mlink').innerHTML =
    '<a class="mapslink" href="'+mapsUrl+'" target="_blank">\u{1F5FA}\uFE0F Google Maps</a>';
  if(notes) document.getElementById('narea').innerHTML =
    '<div class="nbox">\u{1F4DD} '+notes+'</div>';

  // CTA
  var ctaMsg = 'Hi, I am interested in '+(rtype||'the room')+(rn?' (Room '+rn+')':'')+(pname?' at '+pname:'')+(price?' \u00a3'+price+'/wk':'')+'. I would like to arrange a viewing.';
  var ctaHref = waNum
    ? 'https://wa.me/'+waNum+'?text='+encodeURIComponent(ctaMsg)
    : 'https://wa.me/?text='+encodeURIComponent(ctaMsg);
  document.getElementById('cta').innerHTML =
    '<div class="cta">'+
    '<div style="font-size:15px;font-weight:800;margin-bottom:5px">Interested in this room?</div>'+
    '<div style="font-size:12px;color:rgba(255,255,255,.8);margin-bottom:14px">Message us on WhatsApp to arrange a FREE viewing'+(price?' &middot; &pound;'+price+'/wk':'')+
    '</div><a class="cta-btn" href="'+ctaHref+'" target="_blank">\u{1F4AC} Message Us</a></div>';
}

// ── Load property from Supabase if not in URL ─────────────────
async function loadProp(){
  if(pname){ renderHdr(); return; }
  if(!pid){ renderHdr(); return; }
  try{
    var r = await fetch(SUPA_URL+'/rest/v1/properties?id=eq.'+encodeURIComponent(pid)+'&select=name,address,maps_url', {
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
    });
    var d = await r.json();
    if(d && d[0]){
      pname  = d[0].name    || '';
      paddr  = d[0].address || '';
      mapsUrl= mapsUrl || d[0].maps_url || '';
    }
  }catch(e){ dbg('loadProp error: '+e.message); }
  renderHdr();
}

// ── Load gallery from Supabase Storage ────────────────────────
async function loadGallery(){
  if(!pid){
    document.getElementById('area').innerHTML =
      '<div class="empty"><div style="font-size:48px;margin-bottom:12px">&#x1F517;</div>'+
      '<div style="font-size:14px;font-weight:600">Invalid link &mdash; missing property ID</div></div>';
    return;
  }

  // Build the prefix — Supabase Storage paths are case-sensitive
  // Try the exact prefix that the main app uses when uploading
  var prefix = 'rooms/'+pid+'/'+rn;
  dbg('Fetching storage prefix: '+prefix);

  try{
    var files = await listRoomMediaWithRetry(prefix);
    dbg('Storage returned: '+JSON.stringify(files).slice(0,200));

    // Filter: real files only (not folders, not hidden, not .emptyFolderPlaceholder)
    var imgExts = /\.(jpe?g|png|webp|gif|heic|heif|avif)$/i;
    var vidExts = /\.(mp4|mov|webm|m4v)$/i;

    var imgs = files.filter(function(f){
      return f.name && !f.name.startsWith('.') && imgExts.test(f.name);
    });
    var vids = files.filter(function(f){
      return f.name && vidExts.test(f.name);
    });

    // Also include files that don't have video_ prefix but might be images
    // (some uploads name them by timestamp or UUID)
    if(!imgs.length){
      imgs = files.filter(function(f){
        return f.name && !f.name.startsWith('.') && f.id && !vidExts.test(f.name);
      });
    }

    dbg('Images found: '+imgs.length+' | Videos: '+vids.length);

    photos = imgs.map(function(f){
      return SUPA_URL+'/storage/v1/object/public/room-media/'+prefix+'/'+f.name;
    });

    if(!photos.length){
      document.getElementById('area').innerHTML =
        '<div class="empty">'+
        '<div style="font-size:48px;margin-bottom:12px">&#x1F4F7;</div>'+
        '<div style="font-size:14px;font-weight:600;margin-bottom:6px">No photos yet</div>'+
        '<div style="font-size:12px;opacity:.5">Photos will appear here once uploaded from the main app</div>'+
        '</div>';
    } else {
      var h = '<div class="grid">';
      photos.forEach(function(url,i){
        h += '<div class="card" onclick="openLb('+i+')" data-idx="'+i+'">'+
             '<img src="'+url+'" alt="Photo '+(i+1)+'" loading="lazy" onerror="this.parentNode.style.background=\'#2A1E3F\'">'+
             '<div class="num">'+(i+1)+'/'+photos.length+'</div></div>';
      });
      h += '</div>';
      document.getElementById('area').innerHTML = h;
    }

    // Video
    if(vids.length){
      var vurl = SUPA_URL+'/storage/v1/object/public/room-media/'+prefix+'/'+vids[0].name;
      document.getElementById('varea').innerHTML =
        '<div class="vsect">'+
        '<div class="vtitle">&#x1F3A5; Video Tour</div>'+
        '<div class="vwrap"><video controls playsinline preload="metadata" src="'+vurl+'"></video></div>'+
        '</div>';
    }

  }catch(err){
    dbg('loadGallery error: '+err.message);
    document.getElementById('area').innerHTML =
      '<div class="empty">'+
      '<div style="font-size:48px;margin-bottom:12px">&#x26A0;&#xFE0F;</div>'+
      '<div style="font-size:14px;font-weight:600">Could not load photos right now</div>'+
      '<div style="font-size:11px;margin-top:8px;opacity:.75">The gallery service timed out. Please refresh in a few seconds.</div>'+
      '<button onclick="loadGallery()" style="margin-top:12px;padding:8px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.25);background:#2A1E3F;color:#fff;font-size:12px;font-weight:700;cursor:pointer">Retry</button>'+
      '<div style="font-size:11px;margin-top:4px;opacity:.4">Property ID: '+pid+' &middot; Room: '+rn+'</div>'+
      '</div>';
  }
}

// ── Lightbox ──────────────────────────────────────────────────
function buildThumbs(){
  var el = document.getElementById('lb-thumbs');
  el.innerHTML = photos.map(function(url,i){
    return '<div class="lb-thumb'+(i===lbIdx?' active':'')+'" onclick="lbNav2('+i+')">'+
           '<img src="'+url+'" alt="" loading="lazy"></div>';
  }).join('');
}

function openLb(i){
  lbIdx = i;
  document.getElementById('lbimg').src = photos[i];
  document.getElementById('lbc').textContent = (i+1)+' / '+photos.length;
  buildThumbs();
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLb(){
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow = '';
}

function lbNav(d){
  lbIdx = (lbIdx+d+photos.length) % photos.length;
  document.getElementById('lbimg').src = photos[lbIdx];
  document.getElementById('lbc').textContent = (lbIdx+1)+' / '+photos.length;
  // update thumb highlight
  document.querySelectorAll('.lb-thumb').forEach(function(el,i){ el.classList.toggle('active', i===lbIdx); });
  // scroll thumb into view
  var thumbs = document.querySelectorAll('.lb-thumb');
  if(thumbs[lbIdx]) thumbs[lbIdx].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}

function lbNav2(i){ lbNav(i - lbIdx); }

// Click outside image closes lightbox
document.getElementById('lb').addEventListener('click', function(e){
  if(e.target === this) closeLb();
});

// Keyboard navigation
document.addEventListener('keydown', function(e){
  if(!document.getElementById('lb').classList.contains('open')) return;
  if(e.key==='ArrowLeft')  lbNav(-1);
  if(e.key==='ArrowRight') lbNav(1);
  if(e.key==='Escape')     closeLb();
});

// ── Touch swipe support ───────────────────────────────────────
var _tx=null;
document.getElementById('lb').addEventListener('touchstart', function(e){ _tx=e.touches[0].clientX; }, {passive:true});
document.getElementById('lb').addEventListener('touchend', function(e){
  if(_tx===null) return;
  var dx = e.changedTouches[0].clientX - _tx;
  _tx = null;
  if(Math.abs(dx) < 40) return;
  lbNav(dx < 0 ? 1 : -1);
}, {passive:true});

// ── Init ──────────────────────────────────────────────────────
loadProp();
loadGallery();
</script>
</body>
</html>
