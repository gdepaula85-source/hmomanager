        html += '</div>';

        // Property rows within this month
        var mSorted = mPays.slice().sort(function(a,b){
          if(a.status==='paid' && b.status!=='paid') return 1;
          if(a.status!=='paid' && b.status==='paid') return -1;
          return (a.property||'').localeCompare(b.property||'');
        });
        mSorted.forEach(function(pay) {
          var isPaid    = pay.status === 'paid';
          var isOverdue = !isPaid && mMs < nowMs;
          var amtColor  = isPaid ? 'var(--green)' : isOverdue ? 'var(--red)' : 'var(--amber)';

          html += '<div style="display:flex;align-items:center;gap:8px;padding:8px 14px 8px 28px;border-bottom:1px solid var(--border);background:'+(isPaid?'transparent':isOverdue?'#FFF8F8':'transparent')+'">';
          html += '<div style="flex:1;min-width:0">';
          html += '<div style="font-size:12px;font-weight:600;color:'+(isPaid?'var(--muted)':'var(--text)')+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(pay.propName||pay.property||(state.properties.find(function(x){return x.id===pay.propId;})||{}).name||'Unknown')+'</div>';
          if(isPaid) html += '<div style="font-size:10px;color:var(--green)">Paid '+pay.paidDate+'</div>';
          html += '</div>';
          html += '<span style="font-size:12px;font-weight:700;color:'+amtColor+';font-family:monospace;flex-shrink:0">'+fmt(pay.amount)+'</span>';
          if(!isPaid) {
            html += '<button onclick="markLandlordPaid(\'' + ll.id + '\',\''+pay.id+'\')" style="padding:5px 10px;border-radius:7px;border:none;background:'+(isOverdue?'var(--red)':'#10B981')+';color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap">'+(isOverdue?'Pay Now':'Pay ✓')+'</button>';
          } else {
            html += '<span style="font-size:10px;color:var(--green);font-weight:700">✓</span>';
          }
          html += '</div>';
        });
      });
      html += '</div>';
    }

    // Edit button
    html += '<div style="padding:10px 14px;border-top:1px solid var(--border)">';
    html += '<button onclick="openLandlordDetail('+ll.id+')" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">✏️ Edit Profile</button>';
    html += '</div>';

    html += '</div>'; // card
  });
  html += '</div>'; // grid

  return html;
}

function getPostcode(a){var m=a&&a.match(/[A-Z]{1,2}\d{1,2}[A-Z]?\s?\d[A-Z]{2}/i);return m?m[0].toUpperCase():'';}
var _roomMediaMap = {};  // elemId -> {pid, rn}

function registerMedia(elemId, pid, rn) { _roomMediaMap[elemId] = {pid:pid, rn:rn}; }
function getMediaByElem(el) {
  var info = _roomMediaMap[el.id] || _roomMediaMap[el.dataset && el.dataset.mid];
  if(!info) { console.warn('No media info for element:', el.id); return null; }
  return getMedia(info.pid, info.rn);
}

function getMedia(pid,n){if(!state.roomMedia)state.roomMedia={};var k=pid+'_'+n;if(!state.roomMedia[k])state.roomMedia[k]={photos:[],video:null,notes:''};return state.roomMedia[k];}

function buildGalleryUrl(pid, rn) {
  var base = window.location.origin + '/gallery.html';
  return base + '?p=' + encodeURIComponent(pid) + '&r=' + rn;
}

function stripHouseNo(addr) {
  // Remove leading house number for privacy, also dedupe trailing postcode
  var s = (addr||'').replace(/^\d+[A-Za-z]?[\s,]+/, '').trim();
  // Remove postcode at the end to avoid duplication (it's shown separately)
  s = s.replace(/,?\s*[A-Z]{1,2}\d{1,2}[A-Z]?\s\d[A-Z]{2}\s*$/i, '').trim().replace(/,+\s*$/, '').trim();
  return s;
}

async function handlePhotoUpload(pid,rn,input){
  // Guard: reject truly empty or undefined pids
  if(!pid || pid === 'undefined' || pid === 'prop' || pid.length < 3) {
    showToast('Please refresh the page and try again', 'error');
    return;
  }
  var files=Array.from(input.files);var media=getMedia(pid,rn);
  var maxPhotos = 4;
  var toUpload = Array.from(files).slice(0, maxPhotos - media.photos.length);
  for(var i=0; i<toUpload.length; i++){
    var file = toUpload[i];
    if(file.size > 5*1024*1024){ showToast('Photo too large (max 5MB)', 'error'); continue; }
    showToast('Uploading...', 'success');
    // Always store locally first for immediate display
    var localReader = new FileReader();
    var fileRef = file;
    localReader.onload = (function(lf, lpid, lrn) { return function(e) {
      var localMedia = getMedia(lpid, lrn);
      // Store a temporary placeholder (no base64 in state to avoid localStorage quota)
      var localEntry = {src:e.target.result, name:lf.name, _localOnly:true};
      localMedia.photos.push(localEntry);
      render(); // show photo immediately from memory
      showToast('Uploading photo...', 'success');
      // Upload to Supabase Storage
      (async function() {
        try {
          var ext = lf.name.split('.').pop().toLowerCase();
          var path = 'rooms/'+lpid+'/'+lrn+'/'+Date.now()+'.'+ext;
          var upload = await supa.storage.from('room-media').upload(path, lf, {upsert:true});
          if(upload.error) throw upload.error;
          var urlData = supa.storage.from('room-media').getPublicUrl(path);
          var url = urlData.data.publicUrl;
          if(url) {
            // Replace temp base64 with permanent Supabase URL
            var idx = localMedia.photos.indexOf(localEntry);
            if(idx >= 0) localMedia.photos[idx] = {src:url, name:lf.name, path:path};
            saveState(); // now saves small URL string, not 4MB base64
            render();
            showToast('Photo uploaded ✓', 'success');
            console.log('Photo synced to Supabase:', url);
          }
        } catch(err) {
          console.warn('Photo upload failed:', err.message);
          showToast('Upload failed: '+(err.message||'check connection'), 'error');
          // Keep local copy only for this session (not saved to localStorage to avoid quota)
          render();
        }
      })();
    };})(fileRef, pid, rn);
    localReader.readAsDataURL(file);
  }
}

function renderRooms(){
  window._roomEidMap = {};  // reset on every render
  // Build available rooms: vacant + notice_given with moveOutDate (available from date)
  var allV=[], hiddenV=[];
  state.properties.forEach(function(p){
    (p.roomList||[]).forEach(function(r){
      if(r._hidden) {
        hiddenV.push({p:p,r:r}); // collect separately — shown at bottom
        return;
      }
      if(r.status==='vacant') {
        allV.push({p:p,r:r,availFrom:null});
      } else if(r.status==='occupied') {
        // Check if occupying tenant has given notice
        var noticeTenant = state.tenants.find(function(t){
          return t.property===p.name && t.room===r.n && t.status==='notice_given' && t.moveOutDate;
        });
        if(noticeTenant) {
          allV.push({p:p,r:r,availFrom:noticeTenant.moveOutDate,_noticeTenant:noticeTenant});
        }
      }

// ── FILE HANDLERS ─────────────────────────────────────────────────────────────
function cleanPhone(raw) {
  var p = String(raw || '').replace(/[\s\-\(\)]/g, '');
  if(p.startsWith('+44')) p = '44' + p.slice(3);
  else if(p.startsWith('0044')) p = '44' + p.slice(4);
  else if(p.startsWith('07')) p = '44' + p.slice(1);
  else if(p.startsWith('7') && p.length === 10) p = '44' + p;
  return p.replace(/\D/g,'');
}

function cleanPostcode(raw) {
  return String(raw || '').trim().toUpperCase().replace(/\s+/,' ');
}

function cleanPropertyName(raw) {
  return String(raw || '').trim().replace(/\s+/g,' ');
}

function hasPropCode(name) {
  // Flag names that end in a number, single letter+number, or known code patterns
  return /[A-Z]?\d+[A-Z]?$/.test(name.trim().split(' ').pop()) ||
         /\b(Q\d+|Rm\d+|casa\s*\d+|flat\s*\d+)\b/i.test(name);
}

function handlePropertiesFile(input) {
  var file = input.files[0];
  if(!file) return;
  var reader = new FileReader();

  reader.onload = function(e) {
    try {
      var rows = [];
      var warnings = [];

      if(file.name.endsWith('.csv')) {
        // Parse CSV
        var text = e.target.result;
        var lines = text.split('\n').filter(function(l){return l.trim();});
        var headers = parseCSVLine(lines[0]);
        for(var i=1;i<lines.length;i++){
          var vals = parseCSVLine(lines[i]);
          var obj = {};
          headers.forEach(function(h,j){ obj[h.trim()] = (vals[j]||'').trim(); });
          rows.push(obj);
        }
      } else {
        // Parse XLSX with SheetJS
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type:'array'});
        var ws = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      }

      // Map and clean
      var mapped = [];
      rows.forEach(function(r) {
        var name = cleanPropertyName(r['Property Name'] || r['Name'] || r['property'] || '');
        if(!name) return;
        var landlordRent = parseFloat(String(r['Landlord Rent (£)']||r['Landlord Rent']||r['landlord']||0).replace(/[£,]/g,'')) || 0;
        var totalRooms   = parseInt(r['Total Rooms']||r['rooms']||0) || 0;
        var occupied     = parseInt(r['Occupied Rooms']||r['occupied']||0) || 0;
        var income       = parseFloat(String(r['Monthly Income (£)']||r['Monthly Income']||r['rent']||0).replace(/[£,]/g,'')) || 0;
        var postcode     = cleanPostcode(r['Postcode']||r['postcode']||'');
        var address      = String(r['Address']||r['address']||'').trim();
        var landlordName = String(r['Landlord Name']||r['landlord_name']||'').trim();
        var landlordPhone = cleanPhone(r['Landlord Contact']||r['landlord_contact']||r['Landlord Phone']||'');
        var status       = String(r['Status']||'active').toLowerCase();

        if(!totalRooms && !landlordRent) {
          warnings.push(name+': no rooms or rent data');
        }

        mapped.push({
          name: name, address: address, postcode: postcode,
          rooms: totalRooms, occupied: occupied, rent: income,
          landlord: landlordRent, landlordName: landlordName,
          landlordPhone: landlordPhone, status: status,
          area: deriveArea(postcode, address), type: 'HMO'
        });
      });

      _importPreview = {type:'properties', rows:mapped, warnings:warnings};
      render();
    } catch(err) {
      alert('Error reading file: '+err.message);
    }
  };

  if(file.name.endsWith('.csv')) reader.readAsText(file);
  else reader.readAsArrayBuffer(file);
}

function deriveArea(postcode, address) {
  var southLondon = {
    'SW':'Lambeth','SE':'Lewisham','CR':'Croydon','SW16':'Streatham',
    'SW2':'Brixton','SW9':'Brixton','SW4':'Clapham','SW11':'Clapham',
    'SE5':'Camberwell','SE15':'Peckham','SE22':'Dulwich','SE27':'Norwood',
    'SE26':'Sydenham','SE23':'Forest Hill','SE6':'Catford','SE13':'Lewisham'
  };
  var pc = (postcode||'').replace(' ','');
  var prefix4 = pc.slice(0,4);
  var prefix3 = pc.slice(0,3);
  var prefix2 = pc.slice(0,2);
  return southLondon[prefix4] || southLondon[prefix3] || southLondon[prefix2] || 'Other';
}

function handleTenantsFile(input) {
  var file = input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var text = e.target.result;
      var lines = text.split('\n').filter(function(l){return l.trim();});
      var headers = parseCSVLine(lines[0]);
      var warnings = [];
      var mapped = [];

      for(var i=1;i<lines.length;i++){
        var vals = parseCSVLine(lines[i]);
        var obj = {};
        headers.forEach(function(h,j){ obj[h.trim()] = (vals[j]||'').trim(); });

        var name = (obj['Name']||obj['name']||'').trim();
        if(!name) continue;

        var phone  = cleanPhone(obj['Phone']||obj['phone']||obj['WhatsApp']||'');
        var email  = (obj['Email']||obj['email']||'').trim();
        // Ignore auto-generated emails
        if(email.includes('@tenant.com')) email = '';

        var rentRaw = String(obj['Rent Amount']||obj['Rent']||obj['rent']||'0').replace(/[£,]/g,'');
        var rent    = parseFloat(rentRaw) || 0;
        var freq    = (obj['Rent Frequency']||obj['Frequency']||'weekly').toLowerCase().trim();
        var prop    = cleanPropertyName(obj['Property']||obj['property']||'');
        var room    = parseInt(obj['Room']||obj['room']||1) || 1;
        var checkin = parseDate(obj['Check-in Date']||obj['check_in']||'');
        var status  = (obj['Status']||'active').toLowerCase().trim();
        var flagged = hasPropCode(name);

        mapped.push({
          name:name, whatsapp:phone, email:email,
          rent:rent, freq:freq==='monthly'?'monthly':'weekly',
          property:prop, room:room,
          startDate:checkin,
          status:status==='notice_given'?'notice_given':'active',
          _flagged:flagged
        });
      }

      _importPreview = {type:'tenants', rows:mapped, warnings:warnings};
      render();
    } catch(err) {
      alert('Error reading CSV: '+err.message);
    }
  };
  reader.readAsText(file);
}

function parseDate(raw) {
  if(!raw) return '';
  // DD/MM/YYYY → YYYY-MM-DD
  var m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  // Already ISO
  if(/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
  return '';
}

function parseCSVLine(line) {
  var result = [], cur = '', inQuote = false;
  for(var i=0;i<line.length;i++){
    var ch = line[i];
    if(ch==='"'){ inQuote=!inQuote; continue; }
    if(ch===','&&!inQuote){ result.push(cur); cur=''; continue; }
    cur += ch;
  }
  result.push(cur);
  return result;
}

  if(!state.voidDates) return 0;

  return Math.max(0, Math.floor((TODAY - new Date(since)) / 86400000));

function renderVoidTracker() {
  if(!state.voidDates) state.voidDates = {};

    (p.roomList||[]).forEach(function(r) {
      if(r.status !== 'vacant') return;

      if(!state.voidDates[key]) {
        var d = new Date();
        d.setDate(d.getDate() - (Math.floor(Math.random()*83)+7));
        state.voidDates[key] = d.toISOString().split('T')[0];
      }
      var days = getVoidDays(p.id, r.n);
      var dailyCost = Math.round(r.price / 7);
      voids.push({p:p, r:r, days:days, cost:Math.round(days*dailyCost),
        since:new Date(state.voidDates[key]).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),
        dailyCost:dailyCost});
    });
  });
  voids.sort(function(a,b){return b.cost - a.cost;});
  var tc = voids.reduce(function(s,v){return s+v.cost;},0);
  var td = voids.reduce(function(s,v){return s+v.dailyCost;},0);
  var lng = voids.length ? voids.reduce(function(a,b){return a.days>b.days?a:b;}) : null;

  var html = '<div style="font-size:14px;font-weight:700;margin-bottom:4px">&#x1F4CA; Void Period Tracker</div>';

  html += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">';
  html += '<div style="background:var(--red-light);border:1px solid #FECDD3;border-radius:9px;padding:10px;text-align:center"><div style="font-size:13px;font-weight:800;color:var(--red);font-family:monospace">'+fmt(tc)+'</div><div style="font-size:9px;color:var(--red);font-weight:700;margin-top:2px">TOTAL VOID COST</div></div>';

  html += '<div style="background:var(--blue-light);border:1px solid #BFDBFE;border-radius:9px;padding:10px;text-align:center"><div style="font-size:13px;font-weight:800;color:var(--blue);font-family:monospace">'+(lng?lng.days+'d':'0d')+'</div><div style="font-size:9px;color:var(--blue);font-weight:700;margin-top:2px">LONGEST VOID</div></div>';
  html += '</div>';
  if(!voids.length) return html + '<div style="text-align:center;padding:16px;color:var(--dim)">&#x1F389; No vacant rooms!</div>';
  html += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">';
  html += '<tr style="background:var(--bg)"><th style="text-align:left;padding:6px 8px;color:var(--muted)">Room</th><th style="padding:6px 8px;color:var(--muted)">Since</th><th style="padding:6px 8px;color:var(--muted)">Days</th><th style="padding:6px 8px;color:var(--muted)">&pound;/day</th><th style="padding:6px 8px;color:var(--muted)">Total</th></tr>';
  voids.slice(0,12).forEach(function(v,i){
    var col = v.days>60?'var(--red)':v.days>30?'var(--amber)':'var(--muted)';
    html += '<tr style="border-top:1px solid var(--border);background:'+(i%2?'var(--bg)':'var(--surface)')+'"><td style="padding:6px 8px"><div style="font-weight:600">'+v.p.name+'</div><div style="color:var(--muted);font-size:10px">Rm '+v.r.n+' &middot; '+(v.r.type||'Room')+'</div></td><td style="padding:6px 8px;color:var(--muted)">'+v.since+'</td><td style="padding:6px 8px;font-weight:700;color:'+col+'">'+v.days+'d</td><td style="padding:6px 8px;color:var(--muted)">&pound;'+v.dailyCost+'</td><td style="padding:6px 8px;font-weight:800;color:var(--red);font-family:monospace">'+fmt(v.cost)+'</td></tr>';
  });
  html += '<tr style="border-top:2px solid var(--border)"><td colspan="3" style="padding:6px 8px;font-weight:700">TOTAL</td><td style="padding:6px 8px;color:var(--amber);font-weight:700">&pound;'+td+'/d</td><td style="padding:6px 8px;font-weight:800;color:var(--red);font-family:monospace">'+fmt(tc)+'</td></tr>';
  html += '</table></div>';
  return html;
}

    ctx.lineJoin = 'round';

    function start(e){ e.preventDefault(); drawing=true; var p=getPos(e); lastX=p.x; lastY=p.y; }
    function move(e){ e.preventDefault(); if(!drawing) return; var p=getPos(e); ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke(); lastX=p.x; lastY=p.y; }
    function stop(){ drawing=false; }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', stop);
    canvas.addEventListener('mouseleave', stop);
    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove', move, {passive:false});
    canvas.addEventListener('touchend', stop);
  }, 100);
}

// ── TENANT DOCUMENT VAULT ──────────────────────────────────────────────────────
async function uploadTenantDoc(tenantId, input) {
  if(!state.vault) state.vault = {};
  if(!state.vault[tenantId]) state.vault[tenantId] = [];
  var docType = (document.getElementById('vault-doc-type-'+tenantId)||{}).value || 'Other';
  var files = Array.from(input.files);
  if(!files.length) return;

  for(var fi=0; fi<files.length; fi++) {
    var file = files[fi];
    if(file.size > 10*1024*1024) { showToast(file.name+' exceeds 10MB limit.','error'); continue; }
    var sizeStr = file.size>1024*1024 ? (file.size/1024/1024).toFixed(1)+'MB' : Math.round(file.size/1024)+'KB';
    var now = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
    var docId = 'tdoc_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
    var ext = file.name.split('.').pop().toLowerCase();
    var path = 'tenants/'+tenantId+'/'+docId+'.'+ext;

    showToast('Uploading '+file.name+'…','success');

    var entry = { id:docId, name:file.name, type:docType, size:sizeStr,
      uploadedAt:now, dataUrl:null, storagePath:null };
    state.vault[tenantId].push(entry);

    var uploaded = false;
    try {
      var {error:upErr} = await supa.storage.from('tenant-docs').upload(path, file, {upsert:true});
      if(upErr) throw upErr;
      // Try public URL first
      var pubData = supa.storage.from('tenant-docs').getPublicUrl(path);
      if(pubData && pubData.data && pubData.data.publicUrl) {
        entry.dataUrl = pubData.data.publicUrl;
        entry.storagePath = path;
        uploaded = true;
      } else {
        var {data:urlData, error:urlErr} = await supa.storage.from('tenant-docs').createSignedUrl(path, 31536000);
        if(!urlErr && urlData && urlData.signedUrl) {
          entry.dataUrl = urlData.signedUrl;
          entry.storagePath = path;
          uploaded = true;
        }
      }
      if(uploaded) {
        showToast(file.name+' uploaded ✓','success');
      } else {
        throw new Error('Could not get download URL');
      }
    } catch(err) {
      console.warn('Tenant doc storage failed, falling back to base64:', err.message);
      try {
        var b64 = await new Promise(function(res,rej){
          var r=new FileReader(); r.onload=function(e){res(e.target.result);}; r.onerror=rej; r.readAsDataURL(file);
        });
        entry.dataUrl = b64;
        entry.storagePath = null;
        showToast(file.name+' saved locally','success');
        uploaded = true;
      } catch(b64err) {
        showToast('Upload failed: '+err.message,'error');
        state.vault[tenantId] = state.vault[tenantId].filter(function(d){return d.id!==docId;});
        continue;
      }
    }
    saveState();
  }
  input.value = '';
  state.tenantDetailTab = 'vault';
  openTenantDetail(tenantId);
}

function exportData() {
  var snapshot = {};
  var SAVE_KEYS_LOCAL = ['tenants','properties','payments','rentSchedule','expenses',
    'maintenance','landlords','landlordPayments','roomMedia','lateFeeConfig',
    'users','voidDates','vault','propDocs'];
  SAVE_KEYS_LOCAL.forEach(function(k){ snapshot[k] = state[k]; });
  snapshot._exportedAt = new Date().toISOString();
  snapshot._version    = '1.0';

  var blob = new Blob([JSON.stringify(snapshot, null, 2)], {type:'application/json'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  var date = new Date().toISOString().split('T')[0];
  a.href     = url;
  a.download = 'propmanager-backup-' + date + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(input) {
  var file = input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if(!data.tenants || !data.properties) {
        alert('\u26A0\uFE0F Invalid backup file. Please use a PropManager export file.');
        return;
      }
      var backupDate = data._exportedAt ? new Date(data._exportedAt).toLocaleDateString('en-GB') : 'unknown date';
      if(!confirm('\u26A0\uFE0F This will replace ALL current data with the backup from ' + backupDate + '.\n\nAre you sure?')) return;

      var SAVE_KEYS_LOCAL = ['tenants','properties','payments','rentSchedule','expenses',
        'maintenance','landlords','landlordPayments','roomMedia','lateFeeConfig',
        'users','voidDates','vault','propDocs'];
      SAVE_KEYS_LOCAL.forEach(function(k){
        if(data[k] !== undefined) {
          state[k] = data[k];
          localStorage.setItem('pm_' + k, JSON.stringify(data[k]));
        }
      });
      rebuildAllSchedules();
      render();
      alert('\u2705 Data imported successfully! ' + data.tenants.length + ' tenants and ' + data.properties.length + ' properties loaded.');
    } catch(err) {
      alert('\u26A0\uFE0F Failed to read backup file: ' + err.message);
    }
    input.value = '';
  };
  reader.readAsText(file);
}

function buildPortfolioSnapshot() {
  var active  = state.tenants.filter(function(t){return t.status==='active';});
  var notice  = state.tenants.filter(function(t){return t.status==='notice_given';});
  var arrears = active.filter(function(t){return (t.arrears||0)>0;});
  var arrTotal = arrears.reduce(function(s,t){return s+(t.arrears||0);},0);
  var vacant = [];
  state.properties.forEach(function(p){
    (p.roomList||[]).forEach(function(r){
      if(r.status==='vacant'){
        var days = state.voidDates&&state.voidDates[p.id+'_'+r.n]
          ? Math.floor((new Date()-new Date(state.voidDates[p.id+'_'+r.n]))/86400000) : 0;
        vacant.push({property:p.name,room:r.n,price:r.price||0,days:days});
      }
    });
  });
  var dailyVoidLoss = vacant.reduce(function(s,v){return s+Math.round(v.price/7);},0);
  var now = new Date();
  var llOverdue = (state.landlordPayments||[]).filter(function(p){
    return p.status!=='paid'&&p.dueDateTs&&p.dueDateTs<now.getTime();
  });
  var llOverdueTotal = llOverdue.reduce(function(s,p){return s+p.amount;},0);
  var openMaint   = state.maintenance.filter(function(m){return m.status==='open';});
  var urgentMaint = openMaint.filter(function(m){return m.priority==='urgent';});
  var totalRooms = state.properties.reduce(function(s,p){return s+p.rooms;},0);
  var occRooms   = state.properties.reduce(function(s,p){return s+p.occupied;},0);
  var expectedMo = Math.round(active.reduce(function(s,t){return s+(t.freq==='monthly'?t.rent:t.rent*52/12);},0));
  var landlordMo = state.properties.reduce(function(s,p){return s+p.landlord;},0);
  return {
    date: new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),
    portfolio:{properties:state.properties.length,totalRooms:totalRooms,occupiedRooms:occRooms,
      occupancyPct:Math.round(occRooms/totalRooms*100),vacantRooms:totalRooms-occRooms,
      expectedIncome:expectedMo,landlordCosts:landlordMo,netProfit:expectedMo-landlordMo},
    tenants:{active:active.length,onNotice:notice.length,inArrears:arrears.length,totalArrears:arrTotal,
      arrearsDetails:arrears.slice(0,5).map(function(t){return {name:t.name,property:t.property,arrears:t.arrears};})},
    voids:{count:vacant.length,dailyLoss:dailyVoidLoss,monthlyLoss:dailyVoidLoss*30,
      longestVoids:vacant.sort(function(a,b){return b.days-a.days;}).slice(0,5)},
    landlordPayments:{overdueCount:llOverdue.length,overdueTotal:llOverdueTotal,
      overdueItems:llOverdue.slice(0,5).map(function(p){return {landlord:p.landlordName,property:p.property,amount:p.amount,month:p.monthLabel};})},
    maintenance:{openCount:openMaint.length,urgentCount:urgentMaint.length,
      urgentItems:urgentMaint.slice(0,5).map(function(m){return {property:m.property,issue:m.issue,room:m.room};})}
  };
}

// ── DEAL ANALYZER: local scoring engine ───────────────────────────────────────
function analyzeLocalDeal() {
  var d=(state.dealInputs&&state.dealInputs._scratch)||{};
  var isWhole=(d.lettingType||'hmo')==='whole';
  if(!isWhole&&!d.rooms&&!d.wkrent) return null;
  if(isWhole&&!d.monthRent) return null;
  var isOwned=d.dealType==='owned';
  var grossIncome=d._grossIncome||0;
  var totalCosts=d._totalCosts||0;
  var net=grossIncome-totalCosts;
  var rooms=Math.max(1,d.rooms||1);
  var margin=grossIncome>0?Math.round(net/grossIncome*100):0;
  var annualNet=net*12;
  var cashIn=isOwned?Math.max(1,(d.price||0)*(d.dep||25)/100+(d.reno||0)):0;
  var grossYield=(isOwned&&(d.price||0)>0)?+((grossIncome*12/d.price)*100).toFixed(1):0;
  var netYield=(isOwned&&(d.price||0)>0)?+((annualNet/d.price)*100).toFixed(1):0;
  var roi=(isOwned&&cashIn>100&&annualNet>0)?+(annualNet/cashIn*100).toFixed(1):0;
  var payback=(isOwned&&cashIn>100&&net>0)?+(cashIn/net/12).toFixed(1):0;
  var beRooms=(!isOwned&&grossIncome>0)?Math.ceil(totalCosts/(grossIncome/rooms)):0;
  var beRatio=rooms>0?beRooms/rooms:1;
  var runCosts=(d.bills||0)+(d.maint||0)+(d.insur||0)+(d.mgmt||0)+(d.voidCost||0)+(d.other||0);

  var score=50,strengths=[],risks=[],suggestions=[];

  if(!isOwned) {
    // ── R2R scoring ──────────────────────────────────────────────────────────
    if(margin>=25){score+=20;strengths.push('Strong '+margin+'% profit margin — well above the 20% R2R benchmark');}
    else if(margin>=20){score+=12;strengths.push('Good '+margin+'% margin — meets the R2R 20% target');}
    else if(margin>=12){score+=2;suggestions.push('Margin of '+margin+'% is workable but tight — negotiate LL rent down or raise room rates to reach 20%+');}
    else if(margin>=0){score-=12;risks.push('Margin of '+margin+'% is dangerously thin — any void will push this into a loss');}
    else{score-=30;risks.push('Negative margin of '+margin+'% — costs already exceed income at current occupancy');}

    // Break-even
    if(beRooms>0){
      if(beRatio<=0.55){score+=15;strengths.push('Low break-even at '+beRooms+'/'+rooms+' rooms — good downside protection if rooms go void');}
      else if(beRatio<=0.70){score+=8;strengths.push('Manageable break-even at '+beRooms+'/'+rooms+' rooms');}
      else if(beRatio<=0.85){score-=5;risks.push('High break-even at '+beRooms+'/'+rooms+' rooms — limited void buffer');}
      else{score-=18;risks.push('Very high break-even at '+beRooms+'/'+rooms+' rooms — one empty room pushes into the red');}
    }

    // Void allowance
    if(!(d.voidCost>0))suggestions.push('Add a void allowance of at least '+fmt(Math.round(grossIncome*0.08))+'/mo (8%) — empty periods will happen');
    else if(d.voidCost>0&&d.voidCost<grossIncome*0.05)suggestions.push('Void allowance of '+fmt(d.voidCost)+'/mo may be low — consider '+fmt(Math.round(grossIncome*0.08))+'/mo (8%)');

    // Maintenance reserve
    if(!(d.maint>0))suggestions.push('No maintenance reserve — budget at least '+fmt(rooms*50)+'/mo (£50/room) for repairs and upkeep');

    // Room rate sense check (South London HMO)
    if(!isWhole&&(d.wkrent||0)>0){
      if(d.wkrent<120)risks.push('Weekly rate of £'+d.wkrent+'/room is below South London HMO market (typically £130–180/wk) — verify comparables');
      else if(d.wkrent>=130&&d.wkrent<=180){score+=5;strengths.push('Room rate of £'+d.wkrent+'/wk is within typical South London HMO range');}
      else if(d.wkrent>220)risks.push('Weekly rate of £'+d.wkrent+'/room is high — confirm rooms will let at this price before committing');
    }

    // LL rent as % of income
    var llRent=d.llrent||0;
    if(llRent>0&&grossIncome>0){
      var llPct=Math.round(llRent/grossIncome*100);
      if(llPct>85){score-=10;risks.push('LL rent is '+llPct+'% of gross income — leaves almost no margin for costs or voids');}
      else if(llPct<=70){score+=5;strengths.push('LL rent at '+llPct+'% of gross income leaves good headroom for running costs');}
    }

  } else {
    // ── Owned/BTL scoring ────────────────────────────────────────────────────
    if(grossYield>=10){score+=20;strengths.push('Excellent gross yield of '+grossYield+'% — well above the 8% BTL benchmark');}
    else if(grossYield>=8){score+=12;strengths.push('Good gross yield of '+grossYield+'%');}
    else if(grossYield>=6){score+=2;suggestions.push('Yield of '+grossYield+'% is modest — South London HMO conversions can achieve 8%+');}
    else if(grossYield>=4){score-=8;risks.push('Low yield of '+grossYield+'% — property may struggle to cash-flow after all costs');}
    else if(grossYield>0){score-=20;risks.push('Very low yield of '+grossYield+'% — returns do not justify the capital at risk');}

    if(roi>=12){score+=18;strengths.push('Strong cash ROI of '+roi+'% — good return on invested capital');}
    else if(roi>=8){score+=10;strengths.push('Good cash ROI of '+roi+'%');}
    else if(roi>=5){score+=2;}
    else if(roi>0){score-=8;risks.push('Cash ROI of '+roi+'% is below typical BTL expectations of 8–12%');}

    if((d.dep||25)>=25){score+=5;strengths.push('25%+ deposit unlocks better mortgage rates and reduces LTV risk');}
    else if((d.dep||25)<20){risks.push('Deposit below 20% — restricted mortgage options and higher interest costs likely');}

    if((d.mrate||4.5)>5.5){score-=5;risks.push('Mortgage rate of '+d.mrate+'% is high — stress-test cashflow at 7% in case of remortgage');}
    else if((d.mrate||4.5)<=4){score+=5;strengths.push('Mortgage rate of '+d.mrate+'% is favourable — lock in as long as possible');}

    if((d.reno||0)>0){
      var renoRatio=(d.reno/(d.price||1));
      if(renoRatio>0.15)risks.push('Renovation of '+fmt(d.reno)+' is '+(renoRatio*100).toFixed(0)+'% of purchase price — get independent contractor quotes before committing');
      else{score+=3;strengths.push('Renovation budget of '+fmt(d.reno)+' is reasonable relative to purchase price');}
    }

    if(payback>0&&payback<8){score+=8;strengths.push('Payback period of '+payback+' years — solid return of invested cash');}
    else if(payback>=12){risks.push('Long payback period of '+payback+' years — capital tied up for a long time');}

    // Void/maintenance checks
    if(!(d.voidCost>0))suggestions.push('Add void allowance of at least '+fmt(Math.round(grossIncome*0.06))+'/mo — empty periods reduce yield significantly');
    if(!(d.maint>0))suggestions.push('Include maintenance reserve of £50–75/room/month for an HMO property');
  }

  // Net profit check
  if(net<0){score=Math.max(5,score-30);risks.push('Deal produces a loss of '+fmt(Math.abs(net))+'/mo at '+d.occ+'% occupancy — only viable at 100% occupancy');}
  else if(net>0&&net<200){score=Math.max(10,score-8);suggestions.push('Net of '+fmt(net)+'/mo is very thin — a single void or repair bill will flip this to a loss');}
  else if(net>=1000){score+=5;}

  score=Math.max(5,Math.min(98,score));
  var verdict=score>=65?'GO':score>=40?'CAUTION':'NO-GO';
  var headline=verdict==='GO'
    ?(isOwned?'Strong deal — '+grossYield+'% yield with '+roi+'% cash ROI on '+fmt(cashIn)+' invested':'Good deal — '+margin+'% margin, break-even at '+beRooms+' of '+rooms+' rooms')
    :verdict==='CAUTION'
    ?(isOwned?'Proceed carefully — returns are moderate, stress-test all costs':'Marginal deal — thin margin leaves little room for error')
    :(isOwned?'Reconsider — capital could work harder elsewhere':'Not recommended at current terms — costs are too high relative to income');

  return {score:score,verdict:verdict,headline:headline,strengths:strengths.slice(0,3),risks:risks.slice(0,3),suggestions:suggestions.slice(0,3)};
}

// ── DASHBOARD: local portfolio intelligence engine ────────────────────────────
function runLocalPortfolioAnalysis() {
  var el=document.getElementById('ai-agent-output');
  if(!el) return;

  var props=state.properties||[];
  var tenants=(state.tenants||[]).filter(function(t){return t.status!=='inactive';});
  var maint=state.maintenance||[];

  // Core metrics
  var totalRooms=props.reduce(function(s,p){return s+p.rooms;},0);
  var occupiedRooms=props.reduce(function(s,p){return s+p.occupied;},0);
  var vacantRooms=totalRooms-occupiedRooms;
  var occupancyPct=totalRooms?Math.round(occupiedRooms/totalRooms*100):0;
  var totalIncome=props.reduce(function(s,p){return s+p.rent;},0);
  var totalLLCost=props.reduce(function(s,p){return s+p.landlord;},0);
  var totalNet=totalIncome-totalLLCost;
  var portfolioMargin=totalIncome>0?Math.round(totalNet/totalIncome*100):0;
  var avgRentPerRoom=occupiedRooms>0?Math.round(totalIncome/occupiedRooms):0;
  var voidLoss=vacantRooms*avgRentPerRoom;

  var lossProps=props.filter(function(p){return p.rent<p.landlord&&p.rent>0;});
  var profitProps=props.filter(function(p){return p.rent>=p.landlord&&p.rent>0;});
  var noIncomeProps=props.filter(function(p){return p.rent===0;});

  var urgentMaint=maint.filter(function(m){return m.priority==='urgent'&&m.status!=='resolved';});
  var openMaint=maint.filter(function(m){return m.status!=='resolved';});

  var arrearsTenants=tenants.filter(function(t){return t.arrears>0;});
  var totalArrears=arrearsTenants.reduce(function(s,t){return s+(t.arrears||0);},0);

  var noticeTenants=tenants.filter(function(t){return t.status==='notice';});

  // Top loss makers
  var topLosses=lossProps.slice().sort(function(a,b){return (a.rent-a.landlord)-(b.rent-b.landlord);}).slice(0,3);

  // Score
  var score=50;
  if(occupancyPct>=90){score+=18;}else if(occupancyPct>=85){score+=10;}else if(occupancyPct>=75){score+=2;}else if(occupancyPct<65){score-=15;}
  if(portfolioMargin>=25){score+=18;}else if(portfolioMargin>=20){score+=10;}else if(portfolioMargin>=15){score+=4;}else if(portfolioMargin<10){score-=12;}
  if(urgentMaint.length===0){score+=5;}else{score-=Math.min(20,urgentMaint.length*6);}
  if(totalArrears===0){score+=5;}else if(totalArrears<1000){score-=2;}else if(totalArrears<5000){score-=8;}else{score-=15;}
  if(lossProps.length===0){score+=8;}else{score-=Math.min(18,lossProps.length*3);}
  score=Math.max(10,Math.min(98,score));
  var scoreColor=score>=70?'var(--green)':score>=45?'var(--amber)':'var(--red)';
  var scoreLabel=score>=70?'Healthy':score>=45?'Needs Attention':'Critical';

  // Build insights
  var alerts=[],insights=[],actions=[];

  // Urgent maintenance
  if(urgentMaint.length>0){alerts.push({c:'var(--red)',icon:'&#x1F6A8;',t:urgentMaint.length+' urgent maintenance job'+(urgentMaint.length>1?'s':'')+': '+urgentMaint.map(function(m){return m.property.split(' ')[0];}).join(', ')});}

  // Arrears
  if(totalArrears>0){alerts.push({c:'var(--amber)',icon:'&#x26A0;&#xFE0F;',t:arrearsTenants.length+' tenant'+(arrearsTenants.length>1?'s':'')+' in arrears — total '+fmt(totalArrears)});}

  // Notice tenants
  if(noticeTenants.length>0){alerts.push({c:'var(--blue)',icon:'&#x1F4CB;',t:noticeTenants.length+' tenant'+(noticeTenants.length>1?'s':'')+' have given notice — plan re-letting now to avoid voids'});}

  // Occupancy insight
  if(occupancyPct>=90){insights.push({c:'var(--green)',t:'Occupancy at '+occupancyPct+'% is excellent — above the 90% target. Portfolio running near full capacity.'});}
  else if(occupancyPct>=85){insights.push({c:'var(--green)',t:'Occupancy at '+occupancyPct+'% is on target. '+vacantRooms+' vacant room'+(vacantRooms>1?'s':'')+' represent '+fmt(voidLoss)+'/mo in lost income.'});}
  else{insights.push({c:'var(--amber)',t:'Occupancy at '+occupancyPct+'% is below target. '+vacantRooms+' vacant rooms are costing '+fmt(voidLoss)+'/mo — prioritise re-letting.'});}

  // Margin insight
  if(portfolioMargin>=20){insights.push({c:'var(--green)',t:'Portfolio gross margin of '+portfolioMargin+'% is strong — keeping '+portfolioMargin+'p in every £1 of rent.'});}
  else if(portfolioMargin>=12){insights.push({c:'var(--amber)',t:'Gross margin of '+portfolioMargin+'% is acceptable. Review LL rent on renewal properties to push above 20%.'});}
  else{insights.push({c:'var(--red)',t:'Gross margin of '+portfolioMargin+'% is very thin. Urgent review of LL rents and room rates needed.'});}

  // Net profit
  if(totalNet>0){insights.push({c:'var(--green)',t:'Portfolio net (before expenses) is '+fmt(totalNet)+'/mo ('+fmt(totalNet*12)+'/yr) across '+props.length+' properties.'});}

  // Loss-making properties
  if(lossProps.length>0){
    var totalLoss=Math.abs(lossProps.reduce(function(s,p){return s+(p.rent-p.landlord);},0));
    var msg=lossProps.length+' propert'+(lossProps.length>1?'ies are':'y is')+' loss-making — combined '+fmt(totalLoss)+'/mo loss.';
    if(topLosses.length>0) msg+=' Worst: '+topLosses[0].name+' ('+fmt(Math.abs(topLosses[0].rent-topLosses[0].landlord))+'/mo).';
    insights.push({c:'var(--red)',t:msg});
    actions.push('Review LL rent terms on '+topLosses.map(function(p){return p.name.split(' ')[0];}).join(', ')+' — these are running at a loss');
  }

  // Open maintenance
  if(openMaint.length>0){actions.push(openMaint.length+' open maintenance job'+(openMaint.length>1?'s':'')+' — resolve to protect tenant satisfaction and property condition');}

  // Void action
  if(vacantRooms>0){actions.push('Fill '+vacantRooms+' vacant room'+(vacantRooms>1?'s':'')+' — each empty room costs ~'+fmt(avgRentPerRoom)+'/mo in lost rent');}

  // Arrears action
  if(totalArrears>2000){actions.push('Chase '+fmt(totalArrears)+' in arrears — contact '+arrearsTenants.map(function(t){return t.name.split(' ')[0];}).join(', ')+'  directly');}

  // Render
  var html='<div style="padding:14px 18px">';

  // Score bar
  html+='<div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)">'
    +'<div style="width:56px;height:56px;border-radius:50%;border:3px solid '+scoreColor+';display:flex;align-items:center;justify-content:center;flex-shrink:0">'
    +'<div style="text-align:center"><div style="font-size:18px;font-weight:800;color:'+scoreColor+'">'+score+'</div></div></div>'
    +'<div style="flex:1"><div style="font-size:14px;font-weight:700;color:'+scoreColor+';margin-bottom:2px">Portfolio Health: '+scoreLabel+'</div>'
    +'<div style="font-size:11px;color:var(--muted)">'+props.length+' properties · '+occupancyPct+'% occupied · '+fmt(totalNet)+'/mo net · '+openMaint.length+' open jobs</div>'
    +'<div style="margin-top:6px;height:6px;border-radius:3px;background:var(--border);overflow:hidden"><div style="height:100%;width:'+score+'%;background:'+scoreColor+';border-radius:3px;transition:width .5s"></div></div>'
    +'</div>'
    +'<button onclick="runLocalPortfolioAnalysis()" style="padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);font-size:11px;color:var(--muted);cursor:pointer;font-family:inherit;flex-shrink:0">&#x21BB; Refresh</button>'
    +'</div>';

  // Alerts
  if(alerts.length>0){
    html+='<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">';
    alerts.forEach(function(a){
      html+='<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-left:3px solid '+a.c+';border-radius:8px">'
        +'<span style="color:'+a.c+';flex-shrink:0">'+a.icon+'</span>'
        +'<span style="font-size:12px;color:var(--text)">'+a.t+'</span></div>';
    });
    html+='</div>';
  }

  // Insights
  if(insights.length>0){
    html+='<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Analysis</div>';
    html+='<div style="display:flex;flex-direction:column;gap:5px;margin-bottom:14px">';
    insights.forEach(function(ins){
      html+='<div style="display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--text);line-height:1.5">'
        +'<span style="color:'+ins.c+';flex-shrink:0;margin-top:2px">&#x25CF;</span>'+ins.t+'</div>';
    });
    html+='</div>';
  }

  // Actions
  if(actions.length>0){
    html+='<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Recommended Actions</div>';
    html+='<div style="display:flex;flex-direction:column;gap:5px">';
    actions.forEach(function(act,i){
      html+='<div style="display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--text);line-height:1.5">'
        +'<span style="background:var(--accent);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;flex-shrink:0;margin-top:2px">'+(i+1)+'</span>'+act+'</div>';
    });
    html+='</div>';
  }

  html+='<div style="margin-top:10px;font-size:10px;color:var(--dim)">Local analysis — runs offline, no API required</div>';
  html+='</div>';

  el.innerHTML=html;
}

// ── GLOBAL SEARCH ─────────────────────────────────────────────────────────────
var _gsIdx = -1;

function gsSearch(q) {
  var box = document.getElementById('gs-results');
  q = (q||'').trim().toLowerCase();
  if(q.length < 2) { box.style.display='none'; return; }

  var results = [];

  // Tenants
  state.tenants.forEach(function(t) {
    if(t.status==='inactive') return;
    var score = 0;
    if(t.name.toLowerCase().includes(q)) score=3;
    else if((t.property||'').toLowerCase().includes(q)) score=2;
    else if(String(t.whatsapp||'').includes(q)) score=2;
    else if(String(t.room||'').includes(q) && (t.name.toLowerCase().includes(q.split(' ')[0]))) score=1;
    if(score) results.push({
      type:'tenant', score:score+10, icon:'👤', bg:'#EFF6FF', label:t.name,
      sub:(t.status==='inactive'
        ? (t.previousTenancies&&t.previousTenancies.length ? 'Last: '+t.previousTenancies[t.previousTenancies.length-1].property : t.property||'Former tenant')+' · Moved out'
        : (t.property||'')+(t.room?' · Room '+t.room:'')+(t.arrears>0?' · ⚠️ £'+t.arrears+' arrears':'')),
      action:function(){ openTenantDetail(t.id); }
    });
  });

  // Properties
  state.properties.forEach(function(p) {
    if(!p.name.toLowerCase().includes(q) && !(p.address||'').toLowerCase().includes(q) && !(p.area||'').toLowerCase().includes(q)) return;
    results.push({
      type:'property', score:8, icon:'🏠', bg:'#F0FDF4', label:p.name,
      sub:(p.address||p.area||'')+(p.rooms?' · '+p.rooms+' rooms':''),
      action:function(){ openPropDetail(p.id); }
    });
  });

  // Maintenance
  state.maintenance.forEach(function(m) {
    if(m.status==='resolved') return;
    if(!(m.issue||'').toLowerCase().includes(q) && !(m.property||'').toLowerCase().includes(q) && !(m.tenant||'').toLowerCase().includes(q)) return;
    results.push({
      type:'maintenance', score:6, icon:'🔧', bg:'#FFF7ED', label:m.issue,
      sub:m.property+(m.room?' Rm '+m.room:'')+(m.priority==='urgent'?' · 🚨 URGENT':''),
      action:function(){ state.page='maintenance'; render(); }
    });
  });

  // Payments (overdue/outstanding only)
  state.payments.forEach(function(p) {
    if(p.status==='paid') return;
    if(!(p.tenant||p.tenantName||'').toLowerCase().includes(q)) return;
    results.push({
      type:'payment', score:5, icon:'💷', bg:'#FEF2F2', label:(p.tenant||p.tenantName||''),
      sub:'Outstanding £'+(p.amount||0)+' · Due '+new Date(p._dueDateRaw||Date.now()).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}),
      action:function(){ state.page='rent'; render(); }
    });
  });

  // Sort by score desc, then alphabetically
  results.sort(function(a,b){ return b.score-a.score || (a.label||'').localeCompare(b.label||''); });
  results = results.slice(0,10);

  if(!results.length) {
    box.innerHTML = '<div style="padding:16px;text-align:center;font-size:13px;color:var(--muted)">No results for "'+q.replace(/</g,'&lt;')+'"</div>';
    box.style.display='block'; _gsIdx=-1; return;
  }

  // Group by type
  var sections = {tenant:'Tenants',property:'Properties',maintenance:'Maintenance',payment:'Payments'};
  var grouped = {};
  results.forEach(function(r){ if(!grouped[r.type]) grouped[r.type]=[]; grouped[r.type].push(r); });

  var html = '';
  Object.keys(sections).forEach(function(type) {
    if(!grouped[type]) return;
    html += '<div class="gs-section">'+sections[type]+'</div>';
    grouped[type].forEach(function(r, i) {
      var idx = results.indexOf(r);
      html += '<div class="gs-item" data-gsidx="'+idx+'" onmousedown="gsGo('+idx+')">'
        +'<div class="gs-icon" style="background:'+r.bg+'">'+r.icon+'</div>'
        +'<div><div class="gs-label">'+r.label+'</div><div class="gs-sub">'+r.sub+'</div></div>'
        +'</div>';
    });
  });

  box.innerHTML = html;
  box.style.display = 'block';
  _gsIdx = -1;
  window._gsResults = results;
}

function gsKey(e) {
  var box = document.getElementById('gs-results');
  if(box.style.display==='none') return;
  var items = box.querySelectorAll('.gs-item');
  if(!items.length) return;
  if(e.key==='ArrowDown') {
    e.preventDefault();
    _gsIdx = Math.min(_gsIdx+1, items.length-1);
  } else if(e.key==='ArrowUp') {
    e.preventDefault();
    _gsIdx = Math.max(_gsIdx-1, 0);
  } else if(e.key==='Enter') {
    e.preventDefault();
    if(_gsIdx>=0) gsGo(_gsIdx);
    else if(items.length===1) gsGo(0);
    return;
  } else if(e.key==='Escape') {
    box.style.display='none'; return;
  } else return;
  items.forEach(function(el,i){ el.classList.toggle('gs-active', i===_gsIdx); });
}

function gsGo(idx) {
  var r = window._gsResults && window._gsResults[idx];
  if(!r) return;
  document.getElementById('gs-input').value = '';
  document.getElementById('gs-results').style.display = 'none';
  r.action();
}

// ── REPORTS PAGE ─────────────────────────────────────────────────────────────
function renderReports() {
  var tab = state.filters.reportTab || 'pl';
  var selCo = state.filters.reportCompany || '';
  var selYear = state.filters.reportYear || new Date().getFullYear();

  // Filter properties by company
  var props = selCo ? state.properties.filter(function(p){return p.companyId===selCo;}) : state.properties;
  var propNames = props.map(function(p){return p.name;});
  var tenants = state.tenants.filter(function(t){return t.status!=='inactive'&&propNames.indexOf(t.property)>=0;});
  var payments = state.payments.filter(function(p){return propNames.indexOf(p.property||p.propertyName||'')>=0||propNames.indexOf(p.propertyName||'')>=0;});
  var expenses = state.expenses.filter(function(e){return !selCo||(propNames.indexOf(e.property||'')>=0);});

  var coOpts = '<option value="">All Companies</option>'+(state.companies||[]).map(function(co){return '<option value="'+co.id+'" '+(selCo===co.id?'selected':'')+'>'+co.name+'</option>';}).join('');
  var yearOpts = [2024,2025,2026,2027].map(function(y){return '<option value="'+y+'" '+(selYear==y?'selected':'')+'>'+y+'</option>';}).join('');

  var tabs = [{v:'pl',l:'📊 P&L'},  {v:'arrears',l:'⚠️ Arrears'},  {v:'cashflow',l:'💰 Cash Flow'},  {v:'forecast',l:'🔮 Forecast'}];
  var tabBar = '<div style="display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto">'
    +tabs.map(function(t){
      var active = tab===t.v;
      return '<button onclick="state.filters.reportTab=\''+t.v+'\';render()" style="padding:11px 18px;border:none;border-bottom:3px solid '+(active?'var(--accent)':'transparent')+';margin-bottom:-2px;background:transparent;font-size:13px;font-weight:'+(active?700:500)+';color:'+(active?'var(--accent-dark)':'var(--muted)')+';cursor:pointer;font-family:inherit;white-space:nowrap">'+t.l+'</button>';
    }).join('')+'</div>';

  var controls = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center">'
    +'<select class="inp" style="max-width:200px" onchange="state.filters.reportCompany=this.value;render()">'+coOpts+'</select>'
    +'<select class="inp" style="max-width:100px" onchange="state.filters.reportYear=+this.value;render()">'+yearOpts+'</select>'
    +'<button onclick="exportReportCSV(\''+tab+'\')" style="padding:9px 16px;border-radius:9px;border:1px solid var(--accent);background:var(--accent-light);color:var(--accent-dark);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">&#x2B07; Export CSV</button>'
    +'</div>';

  var content = '';
  if(tab==='pl')        content = renderReportPL(props, tenants, payments, expenses, selYear);
  else if(tab==='arrears')  content = renderReportArrears(tenants);
  else if(tab==='cashflow') content = renderReportCashFlow(payments, expenses, selYear);
  else if(tab==='forecast') content = renderReportForecast(props, tenants, expenses);

  return '<div class="page-header"><div><div class="page-title">&#x1F4C8; Reports</div>'
    +'<div class="page-sub">Financial analysis across your portfolio</div></div></div>'
    +controls+tabBar+content;
}

// ── P&L Report ────────────────────────────────────────────────────────────────
function renderReportPL(props, tenants, payments, expenses, year) {
  var MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var months = MONTH_NAMES.map(function(m, i){
    var from = new Date(year, i, 1);
    var to   = new Date(year, i+1, 0);
    // Income: paid payments in this month (by paidDate)
    var income = payments.filter(function(p){
      if(p.status!=='paid') return false;
      var raw = p._paidDateRaw || p._dueDateRaw;
      if(!raw) return false;
      var d = new Date(raw);
      return d >= from && d <= to;
    }).reduce(function(s,p){return s+p.amount;},0);
    // Landlord cost: sum of property.landlord / 12 per month
    var landlord = props.reduce(function(s,p){return s+(p.landlord||0);},0);
    // Operating expenses in this month
    var opex = expenses.filter(function(e){
      if(!e.startDate) return false;
      var d = new Date(e.startDate);
      return d >= from && d <= to;
    }).reduce(function(s,e){return s+e.amount;},0);
    var net = income - landlord - opex;
    return {label:m, income:Math.round(income), landlord:Math.round(landlord), opex:Math.round(opex), net:Math.round(net)};
  });

  var ytdIncome   = months.filter(function(_,i){return i<=new Date().getMonth();}).reduce(function(s,m){return s+m.income;},0);
  var ytdLandlord = months.filter(function(_,i){return i<=new Date().getMonth();}).reduce(function(s,m){return s+m.landlord;},0);
  var ytdOpex     = months.filter(function(_,i){return i<=new Date().getMonth();}).reduce(function(s,m){return s+m.opex;},0);
  var ytdNet      = ytdIncome - ytdLandlord - ytdOpex;

  var maxVal = Math.max.apply(null, months.map(function(m){return Math.max(m.income, m.landlord);})) || 1;

  // Summary KPIs
  var kpis = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:20px">';
  [[fmt(ytdIncome),'YTD INCOME','var(--green)','var(--green-light)','#A7F3D0'],
   [fmt(ytdLandlord),'YTD LL COSTS','var(--red)','var(--red-light)','#FECDD3'],
   [fmt(ytdOpex),'YTD EXPENSES','var(--amber)','var(--amber-light)','#FDE68A'],
   [fmt(ytdNet),'YTD NET PROFIT',ytdNet>=0?'var(--green)':'var(--red)',ytdNet>=0?'var(--green-light)':'var(--red-light)',ytdNet>=0?'#A7F3D0':'#FECDD3']
  ].forEach(function(kpi){
    kpis += '<div style="background:'+kpi[3]+';border:1px solid '+kpi[4]+';border-radius:12px;padding:12px;text-align:center">'
      +'<div style="font-size:16px;font-weight:800;color:'+kpi[2]+';font-family:monospace">'+kpi[0]+'</div>'
      +'<div style="font-size:9px;font-weight:800;color:'+kpi[2]+';text-transform:uppercase;margin-top:3px">'+kpi[1]+'</div></div>';
  });
  kpis += '</div>';

  // Bar chart
  var chart = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px">'
    +'<div style="font-size:13px;font-weight:700;margin-bottom:14px">Monthly Income vs Costs &mdash; '+year+'</div>'
    +'<div style="display:flex;align-items:flex-end;gap:4px;height:180px;padding-bottom:24px;position:relative;overflow:hidden">';
  months.forEach(function(m){
    var h = Math.round((m.income/maxVal)*100);
    var hLL = Math.round((m.landlord/maxVal)*100);
    var isPast = MONTH_NAMES.indexOf(m.label) <= new Date().getMonth() && year == new Date().getFullYear();
    chart += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative">'
      +'<div style="position:absolute;bottom:24px;left:0;right:0;display:flex;gap:1px;align-items:flex-end;height:130px">'
      +'<div title="Income: '+fmt(m.income)+'" style="flex:1;background:'+(isPast?'var(--accent)':'var(--accent-light)')+';border-radius:4px 4px 0 0;height:'+h+'%"></div>'
      +'<div title="LL Cost: '+fmt(m.landlord)+'" style="flex:1;background:'+(isPast?'var(--red)':'#FECDD3')+';border-radius:4px 4px 0 0;height:'+hLL+'%"></div>'
      +'</div>'
      +'<div style="position:absolute;bottom:0;font-size:9px;font-weight:700;color:var(--muted)">'+m.label+'</div>'
      +'</div>';
  });
  chart += '</div>'
    +'<div style="display:flex;gap:14px;margin-top:6px;font-size:11px;color:var(--muted)">'
    +'<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent);margin-right:4px"></span>Income</span>'
    +'<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--red);margin-right:4px"></span>LL Costs</span>'
    +'</div></div>';

  // Monthly table
  var table = '<div style="overflow-x:auto;border:1px solid var(--border);border-radius:12px">'
    +'<table style="width:100%;border-collapse:collapse;font-size:12px">'
    +'<thead><tr style="background:var(--bg)">'
    +'<th style="padding:10px 12px;text-align:left;color:var(--muted);font-weight:700">Month</th>'
    +'<th style="padding:10px 12px;text-align:right;color:var(--green);font-weight:700">Income</th>'
    +'<th style="padding:10px 12px;text-align:right;color:var(--red);font-weight:700">LL Costs</th>'
    +'<th style="padding:10px 12px;text-align:right;color:var(--amber);font-weight:700">Expenses</th>'
    +'<th style="padding:10px 12px;text-align:right;font-weight:700">Net Profit</th>'
    +'</tr></thead><tbody>';
  var totI=0,totL=0,totO=0,totN=0;
  months.forEach(function(m, i){
    var isFuture = i > new Date().getMonth() && year == new Date().getFullYear();
    var netCol = m.net>=0?'var(--green)':'var(--red)';
    table += '<tr style="border-top:1px solid var(--border);'+(isFuture?'opacity:.45':'')+(i%2?';background:var(--bg)':'')+'">'
      +'<td style="padding:8px 12px;font-weight:600">'+m.label+' '+year+'</td>'
      +'<td style="padding:8px 12px;text-align:right;font-family:monospace;color:var(--green)">'+fmt(m.income)+'</td>'
      +'<td style="padding:8px 12px;text-align:right;font-family:monospace;color:var(--red)">'+fmt(m.landlord)+'</td>'
      +'<td style="padding:8px 12px;text-align:right;font-family:monospace;color:var(--amber)">'+fmt(m.opex)+'</td>'
      +'<td style="padding:8px 12px;text-align:right;font-family:monospace;font-weight:700;color:'+netCol+'">'+fmt(m.net)+'</td>'
      +'</tr>';
    totI+=m.income; totL+=m.landlord; totO+=m.opex; totN+=m.net;
  });
  var totNetCol = totN>=0?'var(--green)':'var(--red)';
  table += '<tr style="border-top:2px solid var(--border);background:var(--bg);font-weight:700">'
    +'<td style="padding:10px 12px">TOTAL '+year+'</td>'
    +'<td style="padding:10px 12px;text-align:right;font-family:monospace;color:var(--green)">'+fmt(totI)+'</td>'
    +'<td style="padding:10px 12px;text-align:right;font-family:monospace;color:var(--red)">'+fmt(totL)+'</td>'
    +'<td style="padding:10px 12px;text-align:right;font-family:monospace;color:var(--amber)">'+fmt(totO)+'</td>'
    +'<td style="padding:10px 12px;text-align:right;font-family:monospace;font-weight:800;font-size:14px;color:'+totNetCol+'">'+fmt(totN)+'</td>'
    +'</tr></tbody></table></div>';

  // Store for CSV export
  window._reportData = {tab:'pl', year:year, months:months};
  return kpis + chart + table;
}

// ── Arrears Report ─────────────────────────────────────────────────────────────
function renderReportArrears(tenants) {
  var withArrears = tenants.filter(function(t){return (t.arrears||0)>0;}).sort(function(a,b){return b.arrears-a.arrears;});
  var totalArrears = withArrears.reduce(function(s,t){return s+t.arrears;},0);
  var today = new Date();

  // Ageing buckets: 0-7d, 8-30d, 31-60d, 60d+
  var buckets = [{label:'0-7 days',min:0,max:7,col:'var(--amber)',bg:'var(--amber-light)'},
                 {label:'8-30 days',min:8,max:30,col:'#EA580C',bg:'#FFF7ED'},
                 {label:'31-60 days',min:31,max:60,col:'var(--red)',bg:'var(--red-light)'},
                 {label:'60+ days',min:61,max:9999,col:'#7F1D1D',bg:'#FEE2E2'}];

  // Assign ageing from last payment date
  var tenantWithAge = withArrears.map(function(t){
    var lastPay = state.payments.filter(function(p){
      return (p.tenantName===t.name||p.tenant===t.name) && p.status==='paid' && p._paidDateRaw;
    }).sort(function(a,b){return b._paidDateRaw-a._paidDateRaw;})[0];
    var age = lastPay ? Math.floor((today-new Date(lastPay._paidDateRaw))/86400000) : 90;
    return Object.assign({},t,{_age:age});
  });

  var kpis = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:20px">';
  kpis += '<div style="background:var(--red-light);border:1px solid #FECDD3;border-radius:12px;padding:12px;text-align:center"><div style="font-size:16px;font-weight:800;color:var(--red);font-family:monospace">'+fmt(totalArrears)+'</div><div style="font-size:9px;font-weight:800;color:var(--red);text-transform:uppercase;margin-top:3px">Total Arrears</div></div>';
  kpis += '<div style="background:var(--amber-light);border:1px solid #FDE68A;border-radius:12px;padding:12px;text-align:center"><div style="font-size:16px;font-weight:800;color:var(--amber);font-family:monospace">'+withArrears.length+'</div><div style="font-size:9px;font-weight:800;color:var(--amber);text-transform:uppercase;margin-top:3px">Tenants</div></div>';
  buckets.forEach(function(b){
    var bTenants = tenantWithAge.filter(function(t){return t._age>=b.min&&t._age<=b.max;});
    var bTotal = bTenants.reduce(function(s,t){return s+t.arrears;},0);
    kpis += '<div style="background:'+b.bg+';border:1px solid '+b.bg.replace('light','').replace('var(','')+';border-radius:12px;padding:12px;text-align:center"><div style="font-size:16px;font-weight:800;color:'+b.col+';font-family:monospace">'+fmt(bTotal)+'</div><div style="font-size:9px;font-weight:800;color:'+b.col+';text-transform:uppercase;margin-top:3px">'+b.label+'</div></div>';
  });
  kpis += '</div>';

  if(!withArrears.length) return kpis+'<div style="text-align:center;padding:40px;color:var(--green);font-size:14px;font-weight:600">&#x2705; No arrears — all tenants up to date!</div>';

  var table = '<div style="overflow-x:auto;border:1px solid var(--border);border-radius:12px">'
    +'<table style="width:100%;border-collapse:collapse;font-size:12px">'
    +'<thead><tr style="background:var(--bg)">'
    +'<th style="padding:10px 12px;text-align:left;color:var(--muted);font-weight:700">Tenant</th>'
    +'<th style="padding:10px 12px;text-align:left;color:var(--muted);font-weight:700">Property</th>'
    +'<th style="padding:10px 12px;text-align:right;color:var(--muted);font-weight:700">Arrears</th>'
    +'<th style="padding:10px 12px;text-align:center;color:var(--muted);font-weight:700">Age</th>'
    +'<th style="padding:10px 12px;text-align:center;color:var(--muted);font-weight:700">Action</th>'
    +'</tr></thead><tbody>';

  tenantWithAge.forEach(function(t, i){
    var bkt = buckets.find(function(b){return t._age>=b.min&&t._age<=b.max;})||buckets[3];
    var waMsg = encodeURIComponent('Hi '+t.name.split(' ')[0]+', your account has arrears of \u00a3'+t.arrears+'. Please contact us to arrange payment. Thank you \u2014 Reservations Direct.');
    table += '<tr style="border-top:1px solid var(--border)'+(i%2?';background:var(--bg)':'')+'">'
      +'<td style="padding:9px 12px"><div style="font-weight:700">'+t.name+'</div><div style="font-size:11px;color:var(--muted)">Rm '+t.room+'</div></td>'
      +'<td style="padding:9px 12px;color:var(--muted)">'+t.property+'</td>'
      +'<td style="padding:9px 12px;text-align:right;font-family:monospace;font-weight:800;color:var(--red)">'+fmt(t.arrears)+'</td>'
      +'<td style="padding:9px 12px;text-align:center"><span style="font-size:11px;font-weight:700;color:'+bkt.col+';background:'+bkt.bg+';padding:2px 8px;border-radius:6px">'+t._age+'d</span></td>'
      +'<td style="padding:9px 12px;text-align:center">'
      +(t.whatsapp?'<a href="https://wa.me/'+t.whatsapp+'?text='+waMsg+'" target="_blank" style="padding:5px 10px;border-radius:7px;background:#25D366;color:#fff;font-size:11px;font-weight:700;text-decoration:none">&#x1F4AC; Chase</a>':'<span style="font-size:11px;color:var(--dim)">No WA</span>')
      +'</td></tr>';
  });
  table += '</tbody></table></div>';
  window._reportData = {tab:'arrears', tenants:tenantWithAge};
  return kpis + table;
}

// ── Cash Flow Report ───────────────────────────────────────────────────────────
function renderReportCashFlow(payments, expenses, year) {
  var MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var months = MONTH_NAMES.map(function(m, i){
    var from = new Date(year, i, 1);
    var to   = new Date(year, i+1, 0);
    var inc = payments.filter(function(p){
      if(p.status!=='paid') return false;
      var raw = p._paidDateRaw||p._dueDateRaw; if(!raw) return false;
      var d = new Date(raw); return d>=from&&d<=to;
    }).reduce(function(s,p){return s+p.amount;},0);
    var out = expenses.filter(function(e){
      if(!e.startDate) return false;
      var d=new Date(e.startDate); return d>=from&&d<=to;
    }).reduce(function(s,e){return s+e.amount;},0);
    return {label:m, in:Math.round(inc), out:Math.round(out), net:Math.round(inc-out)};
  });

  var runningTotal = 0;
  var table = '<div style="overflow-x:auto;border:1px solid var(--border);border-radius:12px;margin-bottom:16px">'
    +'<table style="width:100%;border-collapse:collapse;font-size:12px">'
    +'<thead><tr style="background:var(--bg)">'
    +'<th style="padding:10px 12px;text-align:left;color:var(--muted);font-weight:700">Month</th>'
    +'<th style="padding:10px 12px;text-align:right;color:var(--green);font-weight:700">Cash In</th>'
    +'<th style="padding:10px 12px;text-align:right;color:var(--red);font-weight:700">Cash Out</th>'
    +'<th style="padding:10px 12px;text-align:right;font-weight:700">Net</th>'
    +'<th style="padding:10px 12px;text-align:right;color:var(--blue);font-weight:700">Running</th>'
    +'</tr></thead><tbody>';
  months.forEach(function(m, i){
    runningTotal += m.net;
    var isFuture = i > new Date().getMonth() && year == new Date().getFullYear();
    table += '<tr style="border-top:1px solid var(--border)'+(i%2?';background:var(--bg)':'')+(isFuture?';opacity:.45':'')+'">'
      +'<td style="padding:8px 12px;font-weight:600">'+m.label+'</td>'
      +'<td style="padding:8px 12px;text-align:right;font-family:monospace;color:var(--green)">'+fmt(m.in)+'</td>'
      +'<td style="padding:8px 12px;text-align:right;font-family:monospace;color:var(--red)">'+fmt(m.out)+'</td>'
      +'<td style="padding:8px 12px;text-align:right;font-family:monospace;font-weight:700;color:'+(m.net>=0?'var(--green)':'var(--red)')+'">'+fmt(m.net)+'</td>'
      +'<td style="padding:8px 12px;text-align:right;font-family:monospace;color:var(--blue)">'+fmt(runningTotal)+'</td>'
      +'</tr>';
  });
  table += '</tbody></table></div>';
  window._reportData = {tab:'cashflow', year:year, months:months};
  return table;
}

// ── Forecast Report ────────────────────────────────────────────────────────────
function renderReportForecast(props, tenants, expenses) {
  var monthlyIncome  = Math.round(tenants.filter(function(t){return t.status!=='inactive';}).reduce(function(s,t){return s+(t.freq==='monthly'?t.rent:(t.rent||0)*52/12);},0));
  var monthlyLL      = props.reduce(function(s,p){return s+(p.landlord||0);},0);
  var monthlyExpenses= Math.round(expenses.filter(function(e){return e.recurring;}).reduce(function(s,e){return s+(e.amount||0);},0));
  var monthlyNet     = monthlyIncome - monthlyLL - monthlyExpenses;
  var vacantRooms    = props.reduce(function(s,p){return s+(p.rooms-p.occupied);},0);
  var avgRent        = tenants.length ? Math.round(tenants.reduce(function(s,t){return s+t.rent;},0)/tenants.length) : 0;
  var vacantPotential= Math.round(vacantRooms * avgRent * 52/12);

  var kpis = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:20px">'
    +'<div style="background:var(--green-light);border:1px solid #A7F3D0;border-radius:12px;padding:12px;text-align:center"><div style="font-size:16px;font-weight:800;color:var(--green);font-family:monospace">'+fmt(monthlyIncome)+'</div><div style="font-size:9px;font-weight:800;color:var(--green);text-transform:uppercase;margin-top:3px">Monthly Income</div></div>'
    +'<div style="background:var(--red-light);border:1px solid #FECDD3;border-radius:12px;padding:12px;text-align:center"><div style="font-size:16px;font-weight:800;color:var(--red);font-family:monospace">'+fmt(monthlyLL)+'</div><div style="font-size:9px;font-weight:800;color:var(--red);text-transform:uppercase;margin-top:3px">LL Costs / mo</div></div>'
    +(monthlyExpenses>0?'<div style="background:var(--amber-light);border:1px solid #FDE68A;border-radius:12px;padding:12px;text-align:center"><div style="font-size:16px;font-weight:800;color:var(--amber);font-family:monospace">'+fmt(monthlyExpenses)+'</div><div style="font-size:9px;font-weight:800;color:var(--amber);text-transform:uppercase;margin-top:3px">Expenses / mo</div></div>':'')
    +'<div style="background:'+(monthlyNet>=0?'var(--green-light)':'var(--red-light)')+';border:1px solid '+(monthlyNet>=0?'#A7F3D0':'#FECDD3')+';border-radius:12px;padding:12px;text-align:center"><div style="font-size:16px;font-weight:800;color:'+(monthlyNet>=0?'var(--green)':'var(--red)')+';font-family:monospace">'+fmt(monthlyNet)+'</div><div style="font-size:9px;font-weight:800;color:'+(monthlyNet>=0?'var(--green)':'var(--red)')+';text-transform:uppercase;margin-top:3px">Net / Month</div></div>'
    +'<div style="background:var(--blue-light);border:1px solid #BFDBFE;border-radius:12px;padding:12px;text-align:center"><div style="font-size:16px;font-weight:800;color:var(--blue);font-family:monospace">'+fmt(vacantPotential)+'</div><div style="font-size:9px;font-weight:800;color:var(--blue);text-transform:uppercase;margin-top:3px">Void Potential</div></div>'
    +'</div>';

  // 12-month forward projection table
  var today = new Date();
  var table = '<div style="font-size:13px;font-weight:700;margin-bottom:10px">12-Month Forward Projection (at current run-rate)</div>'

  window._reportData = {tab:'forecast', monthlyIncome:monthlyIncome, monthlyLL:monthlyLL, monthlyNet:monthlyNet};

// ── CSV Export ─────────────────────────────────────────────────────────────────
function exportReportCSV(tab) {
  var d = window._reportData;
  if(!d) return;
  var rows = [], filename = 'propmanager-report-'+tab+'-'+new Date().toISOString().split('T')[0]+'.csv';

  if(tab==='pl' && d.months) {
    rows.push(['Month','Income','LL Costs','Expenses','Net Profit']);
    d.months.forEach(function(m){ rows.push([m.label+' '+d.year, m.income, m.landlord, m.opex, m.net]); });
    var tot = d.months.reduce(function(s,m){return {income:s.income+m.income,landlord:s.landlord+m.landlord,opex:s.opex+m.opex,net:s.net+m.net};},{income:0,landlord:0,opex:0,net:0});
    rows.push(['TOTAL', tot.income, tot.landlord, tot.opex, tot.net]);
  } else if(tab==='arrears' && d.tenants) {
    rows.push(['Tenant','Property','Room','Arrears','Age (days)','WhatsApp']);
    d.tenants.forEach(function(t){ rows.push([t.name, t.property, t.room, t.arrears, t._age, t.whatsapp||'']); });
  } else if(tab==='cashflow' && d.months) {
    rows.push(['Month','Cash In','Cash Out','Net','Running Total']);
    var run=0; d.months.forEach(function(m){run+=m.net; rows.push([m.label+' '+d.year, m.in, m.out, m.net, run]);});
  } else if(tab==='forecast') {
    rows.push(['Metric','Value']);
    rows.push(['Monthly Income',d.monthlyIncome],['Monthly LL Costs',d.monthlyLL],['Monthly Net',d.monthlyNet]);
  }

  var csv = rows.map(function(r){return r.map(function(v){return '"'+(v||'').toString().replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var blob = new Blob([csv],{type:'text/csv'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('CSV exported \u2713','success');
}
