async function _supaUpsert(table, rows, opts) {
  try {
    var r = await supa.from(table).upsert(rows, opts);
    if(r.error) console.warn('Save warning ['+table+']:', r.error.message);
  } catch(e) { console.warn('Save error ['+table+']:', e.message); }
}

async function _doSupaSave(){
  if(!_currentOrgId) { console.warn('_doSupaSave: no org_id — skipping save'); return; }
  // Stamp org_id on every row before saving
  function withOrg(rows){ return rows.map(function(r){ return Object.assign({}, r, {org_id: _currentOrgId}); }); }

  var landlordRows = withOrg(state.landlords.map(landlordToRow));
  var propRows = withOrg(state.properties.map(function(p){
    var r = propToRow(p);
    delete r.room_list;
    return r;
  }));
  var tenantRows = withOrg(state.tenants.map(function(t){
    var r = tenantToRow(t);
    if(!r.portal_username) delete r.portal_username;
    if(!r.portal_password) delete r.portal_password;
    return r;
  }));

  await Promise.all([
    _supaUpsert('landlords', landlordRows, {onConflict:'id'}),
    _supaUpsert('properties', propRows, {onConflict:'id'}),
    _supaUpsert('tenants', tenantRows, {onConflict:'id'}),
    _supaUpsert('payments', withOrg(state.payments.map(paymentToRow)), {onConflict:'id'}),
    _supaUpsert('expenses', withOrg(state.expenses.map(expenseToRow)), {onConflict:'id'}),
    _supaUpsert('maintenance', withOrg(state.maintenance.map(maintenanceToRow)), {onConflict:'id'}),
    _supaUpsert('contractors', withOrg((state.contractors||[]).map(contractorToRow)), {onConflict:'id'}),
    _supaUpsert('landlord_payments',
      withOrg(state.landlordPayments.filter(function(lp){return lp.propId&&lp.monthKey;}).map(landlordPaymentToRow)),
      {onConflict:'property_id,month_key',ignoreDuplicates:false})
  ]);
  if(typeof showToast === 'function') showToast('✓ Saved', 'success');
}
// ── loadState: fetch all data from Supabase ───────────────
async function loadState(){
  if(!_currentOrgId){
    // Do not load unscoped data before auth/org resolution.
    console.warn('loadState skipped: org not resolved yet');
    return false;
  }
  setAppBootMessage('Loading your data…');
  try{
    var results = await Promise.all([
      supa.from('landlords').select('*').eq('org_id', _currentOrgId),
      supa.from('properties').select('*').eq('org_id', _currentOrgId),
      supa.from('tenants').select('*').eq('org_id', _currentOrgId),
      supa.from('payments').select('*').eq('org_id', _currentOrgId),
      supa.from('expenses').select('*').eq('org_id', _currentOrgId),
      supa.from('maintenance').select('*').eq('org_id', _currentOrgId),
      supa.from('landlord_payments').select('*').eq('org_id', _currentOrgId),
      supa.from('contractors').select('*').eq('org_id', _currentOrgId)
    ]);
    var errors = results.filter(function(r){ return r.error; });
    if(errors.length){ console.warn('Supabase load errors:', errors); }
    state.landlords        = (results[0].data||[]).map(rowToLandlord);
    state.properties       = (results[1].data||[]).map(rowToProp);
    state.tenants          = (results[2].data||[]).map(rowToTenant);
    state.payments         = (results[3].data||[]).map(rowToPayment);
    state.expenses         = (results[4].data||[]).map(rowToExpense);
    state.maintenance      = (results[5].data||[]).map(rowToMaintenance);
    state.landlordPayments = (results[6].data||[]).map(rowToLandlordPayment);
    state.contractors      = (results[7].data||[]).map(rowToContractor);
    // Compute t.paid from most recent payment for each tenant
    state.tenants.forEach(function(t){
      var tenantPays = state.payments.filter(function(p){
        return (p.tenantId===t.id||p.tenantName===t.name) && p.status==='paid' && p.paidDate;
      });
      if(tenantPays.length){
        tenantPays.sort(function(a,b){return new Date(b.paidDate)-new Date(a.paidDate);});
        var d = new Date(tenantPays[0].paidDate);
        t.paid = d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
      }
    });
    // Restore local-only state from localStorage
    try {
      var localKeys = ['rentSchedule','roomMedia','vault','voidDates','lateFeeConfig','propDocs','companies','config','roles','maintExtras','dealInputs'];
      localKeys.forEach(function(k){
        var raw = localStorage.getItem('pm_local_'+k);
        if(raw) { try{ state[k]=JSON.parse(raw); }catch(e){} }
      });
      // Restore last visited page (so refresh doesn't always go to dashboard)
      var savedPage = localStorage.getItem('pm_local_page');
      if(savedPage && savedPage !== 'dashboard') state.page = savedPage;
    } catch(e) {}
    // Room photos loaded from localStorage cache — full sync runs in background after first render
    // (syncRoomPhotosBackground is called via setTimeout in the render chain)

    // Load property docs from Supabase Storage (refresh signed URLs)
    try {
      if(state.propDocs) {
        Object.keys(state.propDocs).forEach(function(pid){
          (state.propDocs[pid]||[]).forEach(function(doc){
            if(doc.storagePath && !doc.dataUrl) {
              // Refresh expired signed URL silently
              supa.storage.from('property-docs').createSignedUrl(doc.storagePath, 31536000)
                .then(function(r){ if(r.data) { doc.dataUrl=r.data.signedUrl; } })
                .catch(function(){});
            }
          });
        });
      }
      if(state.vault) {
        Object.keys(state.vault).forEach(function(tid){
          (state.vault[tid]||[]).forEach(function(doc){
            if(doc.storagePath && !doc.dataUrl) {
              supa.storage.from('tenant-docs').createSignedUrl(doc.storagePath, 31536000)
                .then(function(r){ if(r.data) { doc.dataUrl=r.data.signedUrl; } })
                .catch(function(){});
            }
          });
        });
      }
    } catch(_de) { console.warn('Doc URL refresh error:', _de); }

    // Migrate roomMedia keys from old numeric ids to new UUID ids
    if(state.roomMedia && Object.keys(state.roomMedia).length > 0) {
      var newMedia = {};
      state.properties.forEach(function(p) {
        // Find old numeric key entries for this property
        Object.keys(state.roomMedia).forEach(function(oldKey) {
          // Check if this is a numeric-id key for this property
          var parts = oldKey.split('_');
          if(parts.length >= 2) {
            var lastNum = parts[parts.length-1];
            var possibleOldId = parts.slice(0,-1).join('_');
            // Try to match by property name (numeric IDs were 1001, 1002 etc)
            var oidNum = parseInt(possibleOldId);
            if(!isNaN(oidNum) && oidNum >= 1000 && oidNum <= 2000) {
              // This looks like an old numeric key - remap to use actual p.id
              // We can't perfectly match but copy under new key too
              var newKey = p.id + '_' + lastNum;
              if(state.roomMedia[oldKey] && state.roomMedia[oldKey].photos && state.roomMedia[oldKey].photos.length > 0) {
                newMedia[newKey] = state.roomMedia[oldKey];
              }
            } else {
              newMedia[oldKey] = state.roomMedia[oldKey];
            }
          }
        });
      });
      if(Object.keys(newMedia).length > 0) state.roomMedia = newMedia;
    }
    // Back-fill propName for landlord payments loaded from Supabase
    state.landlordPayments.forEach(function(lp){
      if((!lp.propName||lp.propName==='') && lp.propId){
        var p = state.properties.find(function(x){return x.id===lp.propId;});
        if(p) lp.propName = p.name;
      }
      if((!lp.landlordName||lp.landlordName==='') && lp.landlordId){
        var ll = state.landlords.find(function(x){return x.id===lp.landlordId;});
        if(ll) lp.landlordName = ll.name;
      }
    });
    console.log('Loaded from Supabase:', state.landlords.length, 'landlords,', state.properties.length, 'props,', state.tenants.length, 'tenants');
    // Re-apply companies/config from localStorage AFTER Supabase load
    // (Supabase doesn't store these, so localStorage is the source of truth)
    ['companies','config'].forEach(function(k){
      try {
        var raw = localStorage.getItem('pm_local_'+k);
        if(raw){
          var parsed = JSON.parse(raw);
          if(parsed) state[k]=parsed;
        }
      } catch(e2){}
    });
    return true;
  }catch(e){
    console.error('loadState error:', e);
    showToast && showToast('Database error — running in offline mode', 'error');
    return false;
  }
}
async function backfillPaymentDueDates() {
  // Fix existing Supabase payments that have due_date=null by using paid_date as proxy
  // This clears phantom outstanding entries caused by null due_date dedup failure
  var toFix = state.payments.filter(function(p) {
    return !p.dueDate && p.paidDate;
  });
  if(toFix.length === 0) {
    showToast('No payments need fixing ✓', 'success');
    return;
  }
  showToast('Fixing ' + toFix.length + ' payments...', 'success');
  var fixed = 0;
  for(var i = 0; i < toFix.length; i++) {
    var p = toFix[i];
    // Use paid_date as due_date proxy — close enough for weekly dedup
    var paidStr = p.paidDate;
    var parts = String(paidStr).replace(/[^0-9\-]/g,'').split('T')[0];
    var isoDate = null;
    // Parse "21 Mar 2026" (en-GB) or ISO "2026-03-21" format
    var _bmonths = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    if(paidStr) {
      var _bdp = String(paidStr).split(' ');
      if(_bdp.length===3 && _bmonths[_bdp[1]]!==undefined) {
        var _bdt = new Date(+_bdp[2], _bmonths[_bdp[1]], +_bdp[0]);
        isoDate = _bdt.getFullYear()+'-'+String(_bdt.getMonth()+1).padStart(2,'0')+'-'+String(_bdt.getDate()).padStart(2,'0');
      } else if(paidStr.match && paidStr.match(/\d{4}-\d{2}-\d{2}/)) {
        isoDate = paidStr.split('T')[0];
      }
    }
    if(!isoDate) continue;
    p.dueDate = isoDate;
    var pp = paidStr.split('T')[0].split('-');
    p._dueDateRaw = isoDate.split('-').length===3 ? new Date(+isoDate.split('-')[0],+isoDate.split('-')[1]-1,+isoDate.split('-')[2]).getTime() : null;
    // Update Supabase
    try {
      await supa.from('payments').update({due_date: isoDate}).eq('id', p.id);
      fixed++;
    } catch(e) {}
  }
  saveState();
  render();
  showToast('Fixed ' + fixed + ' of ' + toFix.length + ' payments ✓', 'success');
}

      html += '👁 Make Available</button>';
      html += '</div>';
    });
    html += '</div></div>';
  }

  return html;
}

function uploadLogo(input) {
  var file = input.files[0];
  if(!file) return;
  if(file.size > 500*1024){ showToast('Logo must be under 500KB','error'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    if(!state.config) state.config={};
    state.config.logoUrl = e.target.result;
    saveState(); render();
    // Also update topbar logo immediately
    showToast('Logo saved ✓','success');
  };
  reader.readAsDataURL(file);
}

function removeLogo() {
  if(!state.config) return;
  state.config.logoUrl = '';
  saveState(); render();
}

function saveBranding() {
  if(!state.config) state.config={};
  var pn = document.getElementById('cfg-portname');
  var st = document.getElementById('cfg-sitetitle');
  if(pn) state.config.portfolioName = pn.value.trim();
  if(st) state.config.siteTitle     = st.value.trim();
  // Update live
  var sbSub = document.getElementById('sb-sub-txt');
  if(sbSub && state.config.portfolioName) sbSub.textContent = state.config.portfolioName;
  if(state.config.siteTitle) document.title = state.config.siteTitle;
  saveState();
  showToast('Branding saved ✓','success');
}

function saveNewCompany() {
  var name=(document.getElementById('co-name').value||'').trim();
  if(!name){showToast('Company name required','error');return;}
  if(!state.companies) state.companies=[];
  state.companies.push({
    id:'co_'+Date.now(), name:name,
    companyNo:(document.getElementById('co-regno').value||'').trim(),
    vatNo:    (document.getElementById('co-vat').value||'').trim(),
    director: (document.getElementById('co-director').value||'').trim(),
    address:  (document.getElementById('co-address').value||'').trim(),
    email:    (document.getElementById('co-email').value||'').trim(),
    phone:    (document.getElementById('co-phone').value||'').trim(),
    whatsapp: (document.getElementById('co-wa').value||'').trim().replace(/\D/g,''),
    color:    document.getElementById('co-color').value
  });
  saveState(); closeModal(); render();
  showToast('Company saved ✓','success');
}

function saveEditCompany() {
  var cid=document.getElementById('co-edit-id').value;
  var co=(state.companies||[]).find(function(c){return c.id===cid;});
  if(!co) return;
  co.name      =(document.getElementById('co-name').value||'').trim();
  co.companyNo =(document.getElementById('co-regno').value||'').trim();
  co.vatNo     =(document.getElementById('co-vat').value||'').trim();
  co.director  =(document.getElementById('co-director').value||'').trim();
  co.address   =(document.getElementById('co-address').value||'').trim();
  co.email     =(document.getElementById('co-email').value||'').trim();
  co.phone     =(document.getElementById('co-phone').value||'').trim();
  co.whatsapp  =(document.getElementById('co-wa').value||'').trim().replace(/\D/g,'');
  co.color     =document.getElementById('co-color').value;
  saveState(); closeModal(); render();
  showToast('Company updated ✓','success');
}

function deleteCompany(cid) {
  if(!confirm('Delete this company? Properties will become unassigned.')) return;
  state.companies=(state.companies||[]).filter(function(c){return c.id!==cid;});
  state.properties.forEach(function(p){if(p.companyId===cid) p.companyId='';});
  saveState(); closeModal(); render();
}

async function sendInvite() {
  var email=(document.getElementById('inv-email').value||'').trim();
  var name =(document.getElementById('inv-name').value||'').trim();
  var role = document.getElementById('inv-role').value;
  var statusEl=document.getElementById('inv-status');
  var btn=document.getElementById('inv-btn');
  if(!email){showToast('Email required','error');return;}
  btn.disabled=true; btn.textContent='Sending…';
  statusEl.style.display='none';
  try {
    var {error}=await supa.auth.signInWithOtp({
      email:email,
      options:{emailRedirectTo:window.location.origin+'/index.html',data:{full_name:name,role:role}}
    });
    if(error) throw error;
    var initials=name?name.split(' ').map(function(w){return w[0]||'';}).join('').toUpperCase().slice(0,2):email.slice(0,2).toUpperCase();
    if(!state.users.find(function(u){return u.email===email;})){
      state.users.push({id:crypto.randomUUID(),name:name||email,initials:initials,email:email,phone:'',role:role,status:'pending',lastLogin:'Never'});
      saveState();
    }
    statusEl.style.cssText='display:block;background:#D1FAE5;border:1px solid #A7F3D0;color:#065F46;padding:10px 12px;border-radius:9px;font-size:13px';
    statusEl.innerHTML='&#x2713; Invite sent to '+email;
    btn.textContent='Sent ✓'; btn.style.background='var(--green)';
    setTimeout(function(){closeModal();render();},2000);
  } catch(e){
    statusEl.style.cssText='display:block;background:#FEE2E2;border:1px solid #FECDD3;color:#B91C1C;padding:10px 12px;border-radius:9px;font-size:13px';
    statusEl.textContent='Error: '+(e.message||'Could not send invite');
    btn.disabled=false; btn.textContent='Send Invite';
  }
}

function previewDoc(docId) {
  var doc = null;
  if(state.vault) { Object.values(state.vault).forEach(function(arr){ arr.forEach(function(d){ if(d.id===docId||d.name===docId) doc=d; }); }); }
  if(!doc && state.propDocs) { Object.values(state.propDocs).forEach(function(arr){ arr.forEach(function(d){ if(d.id===docId||d.name===docId) doc=d; }); }); }
  if(!doc || !doc.dataUrl) { showToast('No preview available','error'); return; }
  var isPdf = doc.name && doc.name.match(/\.pdf$/i);
  var isImg = doc.name && doc.name.match(/\.(jpg|jpeg|png|gif|webp)$/i);
  var isSupaUrl = doc.dataUrl && doc.dataUrl.indexOf('supabase.co') >= 0;
  if(isSupaUrl){
    document.getElementById('modal-container').innerHTML =
      '<div class="modal-overlay" onclick="if(event.target===this)closeModal()">'
      +'<div class="modal" style="max-width:460px"><div class="modal-header">'
      +'<span class="modal-title">'+doc.name+'</span>'
      +'<button class="modal-close" onclick="closeModal()">&times;</button></div>'
      +'<div class="modal-body" style="text-align:center;padding:32px 24px">'
      +'<div style="font-size:52px;margin-bottom:16px">'+(isPdf?'&#x1F4C4;':isImg?'&#x1F5BC;&#xFE0F;':'&#x1F4CB;')+'</div>'
      +'<div style="font-size:15px;font-weight:700;margin-bottom:6px">'+doc.name+'</div>'
      +'<div style="font-size:12px;color:var(--muted);margin-bottom:24px">'+(doc.type||'Document')+(doc.size?' &middot; '+doc.size:'')+'</div>'
      +'<div style="display:flex;gap:10px;justify-content:center">'
      +'<a href="'+doc.dataUrl+'" target="_blank" style="padding:11px 24px;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;text-decoration:none">Open / View</a>'
      +'<a href="'+doc.dataUrl+'" download="'+doc.name+'" style="padding:11px 24px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-weight:700;text-decoration:none">Download</a>'
      +'</div></div>'
      +'<div class="modal-footer"><button onclick="closeModal()" style="padding:9px 18px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit">Close</button></div>'
      +'</div></div>';
    return;
  }
  var inner = isPdf
    ? '<iframe src="'+doc.dataUrl+'" style="width:100%;height:70vh;border:none;border-radius:8px"></iframe>'
    : isImg
      ? '<img src="'+doc.dataUrl+'" style="max-width:100%;max-height:70vh;border-radius:8px;display:block;margin:0 auto">'
      : '<div style="padding:40px;text-align:center;color:var(--muted)">Preview not available for this file type.<br><a href="'+doc.dataUrl+'" download="'+doc.name+'" style="color:var(--blue)">Download instead ↓</a></div>';
  document.getElementById('modal-container').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this)closeModal()" style="align-items:flex-start;padding-top:40px">'
    +'<div class="modal" style="max-width:900px;width:95vw">'
    +'<div class="modal-header"><span class="modal-title">👁 '+doc.name+'</span>'
    +'<button class="modal-close" onclick="closeModal()">&times;</button></div>'
    +'<div class="modal-body" style="padding:16px">'+inner+'</div>'
    +'<div class="modal-footer">'
    +'<button onclick="closeModal()" style="padding:9px 18px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Close</button>'
    +'<a href="'+doc.dataUrl+'" download="'+doc.name+'" style="padding:9px 18px;border-radius:9px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;text-decoration:none">↓ Download</a>'
    +'</div></div></div>';
}

function saveContractor(id) {
  var name = (document.getElementById('cx-name')||{value:''}).value.trim();
  if(!name){ alert('Please enter a contractor name.'); return; }
  var c = {
    id:   id || crypto.randomUUID(),
    name: name,
    trade:        (document.getElementById('cx-trade')||{value:'General'}).value,
    phone:        (document.getElementById('cx-phone')||{value:''}).value.trim(),
    whatsapp:     (document.getElementById('cx-wa')||{value:''}).value.trim().replace(/\s+/g,'').replace(/^\+/,''),
    email:        (document.getElementById('cx-email')||{value:''}).value.trim(),
    callOutCharge:+(document.getElementById('cx-callout')||{value:0}).value||0,
    rating:       +((document.getElementById('cx-rating')||{value:''}).value)||null,
    notes:        (document.getElementById('cx-notes')||{value:''}).value.trim(),
    lastUsed:     id ? ((state.contractors||[]).find(function(x){return x.id===id;})||{}).lastUsed : null,
  };
  if(!state.contractors) state.contractors = [];
  if(id) {
    var idx = state.contractors.findIndex(function(x){ return x.id===id; });
    if(idx>=0) state.contractors[idx] = c; else state.contractors.push(c);
  } else {
    state.contractors.push(c);
  }
  closeModal();
  saveState();
  render();
}

function deleteContractor(id) {
  if(!confirm('Delete this contractor?')) return;
  state.contractors = (state.contractors||[]).filter(function(c){ return c.id!==id; });
  closeModal();
  saveState();
  render();
}

      state.filters.maintView = 'contractors';

  }

  // Pre-build the WA message for this job
  var prop = state.properties.find(function(p){ return p.name===m.property; });
  var NL = '\n';
  var jobMsg = '🔧 *JOB REQUEST — PropManager*'+NL
    +'━━━━━━━━━━━━━━━━━'+NL
    +'*Issue:* '+m.issue+NL
    +'*Property:* '+m.property+NL
    +(prop&&prop.address&&prop.address!==m.property?'*Address:* '+prop.address+NL:'')
    +(m.room?'*Room:* '+m.room+NL:'')
    +(m.tenant?'*Tenant:* '+m.tenant+NL:'')
    +'*Priority:* '+(m.priority||'Normal').toUpperCase()+NL

      +(mailHref?'<a href="'+mailHref+'" onclick="markContractorUsed(\''+c.id+'\');closeModal()" style="padding:7px 12px;border-radius:8px;background:var(--blue-light);border:1px solid #BFDBFE;color:var(--blue);font-size:12px;font-weight:700;text-decoration:none">✉️ Email</a>':'')

function shareMaintWA(e, maintId) {
  if(e) e.stopPropagation();
  var m=state.maintenance.find(function(x){return String(x.id)===String(maintId);});if(!m)return;
  var prop=state.properties.find(function(p){return p.name===m.property;});
  var mx=(state.maintExtras&&state.maintExtras[m.id])||{};
  var NL='\n',pri=m.priority==='urgent'?' [URGENT]':m.priority==='high'?' [HIGH]':'';
  var msg='MAINTENANCE'+pri+'\n---\n'+m.issue+'\n\nProperty: '+m.property+NL;
  if(prop&&prop.address&&prop.address!==m.property)msg+=prop.address+NL;
  if(m.room)msg+='Room: '+m.room+NL;
  msg+='Tenant: '+(m.tenant||'-')+NL+NL+'Priority: '+(m.priority||'normal').toUpperCase()+NL+'Status: '+(m.status||'open').replace('_',' ').toUpperCase()+NL;
  if(m.cat||m.category)msg+='Category: '+(m.cat||m.category)+NL;
  msg+='Logged: '+(m.date||new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}))+NL;
  if(mx.cost)msg+='Job Cost: £'+mx.cost+NL;
  if(m.notes)msg+=NL+'Notes: '+m.notes+NL;
  if(prop&&prop.mapsUrl)msg+=NL+'Location: '+prop.mapsUrl+NL;
  msg+='---\nSent via PropManager';
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

function shareAllMaintWA() {
  var open=state.maintenance.filter(function(m){return m.status!=='resolved';});
  if(!open.length){showToast('No open maintenance tasks','error');return;}
  var msg='OPEN MAINTENANCE ('+open.length+')\n'+new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+'\n---\n';
  open.forEach(function(m,i){msg+=(i+1)+'. '+m.issue+(m.priority==='urgent'?' [URGENT]':'')+'\n   '+m.property+(m.room?' Rm '+m.room:'')+'\n   '+((m.status||'open').replace('_',' ').toUpperCase())+'\n'+(m.notes?'   '+m.notes+'\n':'');});
  msg+='---';
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

// ─────────────────────────────────────────────────────────────────────────────
// WHATSAPP — PROPERTY DOCUMENTS
// ─────────────────────────────────────────────────────────────────────────────
function shareAllPropDocs(propId, propNameEncoded) {
  var propName = decodeURIComponent(propNameEncoded);
  var docs = (state.propDocs&&state.propDocs[propId])||[];
  if(!docs.length){ showToast('No documents to share','error'); return; }
  var msg = '📂 *PROPERTY DOCUMENTS*\n*Property:* '+propName+'\n━━━━━━━━━━━━━━━━━\n';
  docs.forEach(function(doc,i){
    var days = doc.expiresAt ? getDaysUntilExpiry(doc.expiresAt) : null;
    var expStr = days===null?'':(days<0?' ⛔ EXPIRED':days<=30?' ⚠️ Expires in '+days+'d':' ✓ Valid');
    msg+=(i+1)+'. *'+doc.type+'*'+expStr+'\n   '+doc.name+' ('+doc.size+')'+'\n'
      +(doc.expiresAt?'   Exp: '+new Date(doc.expiresAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+'\n':'');
  });
  msg+='━━━━━━━━━━━━━━━━━\n_Sent via PropManager_';
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

function clearSavedState(){
  var _kr=[];for(var _i=0;_i<localStorage.length;_i++){var _k=localStorage.key(_i);if(_k&&_k.startsWith('pm_'))_kr.push(_k);}
  _kr.forEach(function(k){localStorage.removeItem(k);});
  location.reload();
}
var _origRender=render;
render=function(){
  if(_appBootPending) return;
  _origRender();
  // Debounce saveState — prevents expensive serialisation on every rapid render
  clearTimeout(window._renderSaveTimer);
  window._renderSaveTimer=setTimeout(saveState,800);
  // Debounce dashboard agent — prevents multiple concurrent DOM rebuilds
  if(state.page==='dashboard'){
    clearTimeout(window._dashAgentTimer);
    window._dashAgentTimer=setTimeout(renderDashboardAgent,200);
  }
  // Debounce deal recalc
  if(state.page==='properties'&&(state.filters.propView||'list')==='deal'){
    clearTimeout(window._dealCalcTimer);
    window._dealCalcTimer=setTimeout(recalcDealPage,80);
  }
  // Trigger room photo background sync once, 3s after first render
  if(!window._roomSyncDone){
    clearTimeout(window._roomSyncTimer);
    window._roomSyncTimer=setTimeout(function(){
      window._roomSyncDone=true;
      syncRoomPhotosBackground();
    },3000);
  }
};
loadState().then(function(loaded){
if(!loaded) return;
// ALWAYS resync property occupancy, room prices and income from tenants.
// This runs after loadState() so it corrects any stale localStorage data too.
(function syncPropertiesFromTenants() {
  state.properties.forEach(function(p){
    if(!p.roomList) return;
    p.roomList.forEach(function(r){
      var tenant = state.tenants.find(function(t){
        return t.property===p.name && t.room===r.n && t.status!=='inactive';
      });
      r.status = tenant ? 'occupied' : 'vacant';
      if(tenant && tenant.rent > 0) r.price = tenant.rent;
    });
    p.occupied = p.roomList.filter(function(r){return r.status==='occupied';}).length;
    // Backfill vacant room prices from property average so void tracker works
    var occupiedPrices = p.roomList.filter(function(r){return r.status==='occupied'&&r.price>0;}).map(function(r){return r.price;});
    if(occupiedPrices.length) {
      var avgPrice = Math.round(occupiedPrices.reduce(function(s,v){return s+v;},0)/occupiedPrices.length);
      p.roomList.forEach(function(r){if(r.status==='vacant'&&r.price===0) r.price=avgPrice;});
    }
    var propTenants = state.tenants.filter(function(t){return t.property===p.name&&t.status!=='inactive';});
    p.rent = Math.round(propTenants.reduce(function(s,t){
      return s + (t.freq==='monthly' ? t.rent : (t.rent||0)*52/12);
    }, 0));
  });
})();
// Always rebuild schedule on load so date changes take effect immediately
rebuildAllSchedules();

// Auto move-out tenants whose notice move-out date has passed
(function autoMoveOut() {
  var today = new Date();
  today.setHours(0,0,0,0);
  state.tenants.forEach(function(t) {
    if(t.status === 'notice_given' && t.moveOutDate) {
      var moveOut = new Date(t.moveOutDate);
      moveOut.setHours(0,0,0,0);
      if(moveOut <= today) {
        t.status = 'inactive';
        freeRoom(t.property, t.room);
      }
    }
  });
})();

render();
}); // end loadState().then

var PROP_DOC_TYPES = [
  {type:'Gas Safety Certificate',    icon:'🔥', warn:60, color:'#FEF3C7', textColor:'#92400E'},
  {type:'HMO Licence',               icon:'🏠', warn:90, color:'#EDE9FE', textColor:'#5B21B6'},
  {type:'Electrical Certificate (EICR)', icon:'⚡', warn:60, color:'#EFF6FF', textColor:'#1E40AF'},
  {type:'Energy Performance (EPC)',  icon:'🌿', warn:90, color:'#DCFCE7', textColor:'#166534'},
  {type:'Fire Risk Assessment',      icon:'🧯', warn:60, color:'#FEE2E2', textColor:'#991B1B'},
  {type:'Boiler Service',            icon:'🔧', warn:60, color:'#F0FDF4', textColor:'#166534'},
  {type:'Landlord Insurance',        icon:'🛡️', warn:30, color:'#EFF6FF', textColor:'#1D4ED8'},
  {type:'Planning Permission',       icon:'📋', warn:0,  color:'#F8FAFC', textColor:'#475569'},
  {type:'Other',                     icon:'📄', warn:0,  color:'#F8FAFC', textColor:'#475569'},
];

function getPropDocMeta(type) {
  return PROP_DOC_TYPES.find(function(d){return d.type===type;}) || PROP_DOC_TYPES[PROP_DOC_TYPES.length-1];
}

function getDaysUntilExpiry(expiresAt) {
  if(!expiresAt) return null;
  return Math.ceil((new Date(expiresAt) - new Date()) / 86400000);
}

async function renderPropDocsTab(p) {
  if(!state.propDocs) state.propDocs = {};
  var localDocs = (state.propDocs[p.id] || []).slice();
  // Load from Supabase Storage — ensures files show on all devices/sessions
  var supaFiles = [];
  try {
    var lr = await supa.storage.from('property-docs').list('properties/'+String(p.id),{limit:50});
    if(!lr.error && Array.isArray(lr.data)) {
      lr.data.filter(function(f){return f.name&&!f.name.startsWith('.');}).forEach(function(f){
        var path = 'properties/'+String(p.id)+'/'+f.name;
        var pub = supa.storage.from('property-docs').getPublicUrl(path);
        var url = pub.data ? pub.data.publicUrl : null;
        var local = localDocs.find(function(d){return d.storagePath===path;});
        if(local){ if(url&&!local.dataUrl) local.dataUrl=url; return; }
        var fsz = f.metadata&&f.metadata.size ? (f.metadata.size>1048576?(f.metadata.size/1048576).toFixed(1)+'MB':Math.round(f.metadata.size/1024)+'KB') : '';
        var fdt = f.created_at ? new Date(f.created_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '';
        supaFiles.push({id:f.name,name:f.name,type:'Document',size:fsz,uploadedAt:fdt,expiresAt:null,dataUrl:url,storagePath:path,_fromStorage:true});
      });
    }
  } catch(e){ console.warn('Property docs list err:',e.message); }
  if(supaFiles.length){if(!state.propDocs)state.propDocs={};if(!state.propDocs[p.id])state.propDocs[p.id]=[];supaFiles.forEach(function(sd){if(!state.propDocs[p.id].find(function(d){return d.storagePath===sd.storagePath;}))state.propDocs[p.id].push(sd);});}
  var docs = localDocs.concat(supaFiles);

  // Sort: expired first, then soonest expiry, then no expiry
  docs = docs.slice().sort(function(a,b){
    var da = a.expiresAt ? getDaysUntilExpiry(a.expiresAt) : 9999;
    var db = b.expiresAt ? getDaysUntilExpiry(b.expiresAt) : 9999;
    return da - db;
  });

  // Expiry summary strip
  var expiring = docs.filter(function(d){
    if(!d.expiresAt) return false;
    var days = getDaysUntilExpiry(d.expiresAt);
    return days !== null && days <= 90;
  });

  var html = '';
  if(expiring.length) {
    html += '<div style="background:#FFF7ED;border:1px solid #FED7AA;border-radius:10px;padding:12px 14px;margin-bottom:14px">';
    html += '<div style="font-size:12px;font-weight:700;color:#C2410C;margin-bottom:8px">⚠️ '+expiring.length+' document'+(expiring.length===1?'':'s')+' expiring soon</div>';
    expiring.forEach(function(d){
      var days = getDaysUntilExpiry(d.expiresAt);
      var col  = days < 0 ? '#DC2626' : days <= 30 ? '#EA580C' : '#D97706';
      html += '<div style="font-size:12px;color:var(--text);display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #FED7AA">'
        +'<span>'+d.type+'</span>'
        +'<span style="font-weight:700;color:'+col+'">'+(days<0?'Expired '+Math.abs(days)+'d ago':days===0?'Expires today':'Expires in '+days+'d')+'</span></div>';
    });
    html += '</div>';
  }

  // Upload controls
  html += '<div style="background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px">';
  html += '<div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">Upload Document</div>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">';
  html += '<div><label style="font-size:11px;color:var(--muted);font-weight:600">Document Type</label>'
    +'<select class="inp" id="pdoc-type-'+p.id+'" style="margin-top:4px">'
    +PROP_DOC_TYPES.map(function(dt){return '<option>'+dt.type+'</option>';}).join('')
    +'</select></div>';
  html += '<div><label style="font-size:11px;color:var(--muted);font-weight:600">Expiry Date</label>'
    +'<input type="date" class="inp" id="pdoc-expires-'+p.id+'" style="margin-top:4px"></div>';
  html += '</div>';
  html += '<input type="file" id="pvault-input-'+p.id+'" accept=".pdf,.jpg,.jpeg,.png" style="display:none" onchange="uploadPropDocFromInput(this)">'
    +'<button onclick="document.getElementById(\'pvault-input-'+p.id+'\').click()" style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:9px;border:2px dashed var(--accent);background:var(--accent-light);cursor:pointer;width:100%;font-family:inherit;text-align:left">'
    +'<span style="font-size:20px">📎</span>'
    +'<div><div style="font-size:13px;font-weight:700;color:var(--accent-dark)">Choose File</div>'
    +'<div style="font-size:11px;color:var(--muted)">PDF, JPG, PNG · max 20MB</div></div>'
    +'</button>';
  html += '</div>';

  // Document list
  if(!docs.length) {
    html += '<div style="text-align:center;padding:32px;color:var(--dim);font-size:13px">📂 No documents uploaded yet</div>';
  } else {
    docs.forEach(function(doc){
      var meta  = getPropDocMeta(doc.type);
      var days  = doc.expiresAt ? getDaysUntilExpiry(doc.expiresAt) : null;
      var expiryBadge = '';
      if(days !== null) {
        var col  = days < 0 ? '#DC2626' : days <= 30 ? '#EA580C' : days <= 90 ? '#D97706' : '#059669';
        var bg   = days < 0 ? '#FEE2E2' : days <= 30 ? '#FFF7ED' : days <= 90 ? '#FFFBEB' : '#DCFCE7';
        var txt  = days < 0 ? 'Expired' : days === 0 ? 'Today!' : days <= 30 ? days+'d left' : days <= 90 ? days+'d left' : 'Valid';
        expiryBadge = '<span style="font-size:10px;font-weight:700;color:'+col+';background:'+bg+';padding:2px 8px;border-radius:6px">⏰ '+txt+'</span>';
      }
      html += '<div style="display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid '
        +(days!==null&&days<=30?'#FECDD3':days!==null&&days<=90?'#FED7AA':'var(--border)')
        +';border-radius:10px;padding:11px 13px;margin-bottom:8px">'
        +'<div style="width:38px;height:38px;border-radius:9px;background:'+meta.color+';display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">'+meta.icon+'</div>'
        +'<div style="flex:1;min-width:0">'
        +'<div style="font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+doc.name+'</div>'
        +'<div style="display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap">'
        +'<span style="font-size:10px;font-weight:700;color:'+meta.textColor+';background:'+meta.color+';padding:1px 7px;border-radius:5px">'+doc.type+'</span>'
        +'<span style="font-size:10px;color:var(--muted)">'+doc.size+' · '+doc.uploadedAt+'</span>'
        +(doc.expiresAt?'<span style="font-size:10px;color:var(--muted)">Exp: '+new Date(doc.expiresAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+'</span>':'')
        +expiryBadge
        +'</div></div>'
        +'<div style="display:flex;gap:5px;flex-shrink:0">'
        +(doc.dataUrl?'<a href="'+doc.dataUrl+'" download="'+doc.name+'" style="padding:5px 9px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:11px;font-weight:700;color:var(--blue);text-decoration:none">↓</a>':'')
        +'<button onclick="removePropDoc(\'+p.id+\',\'+doc.id+\')" style="padding:5px 9px;border-radius:7px;border:1px solid #FECDD3;background:#FFF1F2;font-size:11px;font-weight:700;color:#E11D48;cursor:pointer;font-family:inherit">&#x2715;</button>'
        +'</div></div>';
    });
  }
  return html;
}


// ── EXPORT / IMPORT ──────────────────────────────────────────────────────────

function uploadPropDocFromInput(input){uploadPropDoc(input.id.replace('pvault-input-',''),input);}

async function uploadPropDoc(propId, input) {
  if(!state.propDocs) state.propDocs = {};
  if(!state.propDocs[propId]) state.propDocs[propId] = [];
  var typeEl  = document.getElementById('pdoc-type-'+propId);
  var expEl   = document.getElementById('pdoc-expires-'+propId);
  var docType   = typeEl ? typeEl.value : 'Other';
  var expiresAt = expEl ? expEl.value : '';
  var files = Array.from(input.files);
  if(!files.length) return;
  for(var fi=0;fi<files.length;fi++){
    var file=files[fi];
    if(file.size>20*1024*1024){showToast(file.name+' exceeds 20MB.','error');continue;}
    var sizeStr=file.size>1024*1024?(file.size/1024/1024).toFixed(1)+'MB':Math.round(file.size/1024)+'KB';
    var now=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
    var docId='pdoc_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
    var ext=file.name.split('.').pop().toLowerCase();
    var path='properties/'+String(propId)+'/'+docId+'.'+ext;
    showToast('Uploading…','success');
    var entry={id:docId,name:file.name,type:docType,size:sizeStr,uploadedAt:now,expiresAt:expiresAt||null,dataUrl:null,storagePath:null};
    state.propDocs[propId].push(entry);
    try {
      var up=await supa.storage.from('property-docs').upload(path,file,{upsert:true});
      if(up.error) throw up.error;
      var pub=supa.storage.from('property-docs').getPublicUrl(path);
      if(pub.data&&pub.data.publicUrl){
        entry.dataUrl=pub.data.publicUrl;entry.storagePath=path;
      } else {
        var sig=await supa.storage.from('property-docs').createSignedUrl(path,31536000);
        if(sig.error||!sig.data||!sig.data.signedUrl) throw new Error('Cannot get URL — check storage policy');
        entry.dataUrl=sig.data.signedUrl;entry.storagePath=path;
      }
      showToast(file.name+' uploaded ✓','success');
    } catch(err){
      console.warn('Storage failed, using base64:',err.message);
      try{
        entry.dataUrl=await new Promise(function(res,rej){var r=new FileReader();r.onload=function(e){res(e.target.result);};r.onerror=rej;r.readAsDataURL(file);});
        entry.storagePath=null;
        showToast(file.name+' saved locally','success');
      } catch(e2){
        showToast('Upload failed: '+err.message,'error');
        state.propDocs[propId]=state.propDocs[propId].filter(function(d){return d.id!==docId;});
        continue;
      }
    }
    saveState();
  }
  input.value='';state.propDetailTab='docs';openPropDetail(propId);
}

function removePropDoc(propId,docId){
  if(!state.propDocs||!state.propDocs[propId]) return;
  var doc=state.propDocs[propId].find(function(d){return d.id===docId;});
  if(doc&&doc.storagePath) supa.storage.from('property-docs').remove([doc.storagePath]).catch(function(){});
  state.propDocs[propId]=state.propDocs[propId].filter(function(d){return d.id!==docId;});
  saveState();state.propDetailTab='docs';openPropDetail(propId);
}
