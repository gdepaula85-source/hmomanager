<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PropManager</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F8F9FB;--surface:#FFFFFF;--border:#E8ECF0;--border2:#D1D9E0;
  --accent:#00B894;--accent-light:#E8F8F5;--accent-dark:#00997D;
  --red:#E8375A;--red-light:#FEF0F3;
  --amber:#F59E0B;--amber-light:#FFFBEB;
  --blue:#3B82F6;--blue-light:#EFF6FF;
  --purple:#8B5CF6;--purple-light:#F5F3FF;
  --green:#10B981;--green-light:#ECFDF5;
  --text:#0F172A;--muted:#64748B;--dim:#94A3B8;
  --wa:#25D366;--wa-light:#F0FBF4;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
select option{background:#fff;color:var(--text)}

#app{display:flex;flex:1;overflow:hidden}
#sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:8px;flex-wrap:wrap}
.gs-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s}
.gs-item:hover,.gs-item.gs-active{background:var(--bg)}
.gs-item:last-child{border-bottom:none}
.gs-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.gs-label{font-size:13px;font-weight:600;color:var(--text)}
.gs-sub{font-size:11px;color:var(--muted);margin-top:1px}
.gs-section{padding:6px 14px;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;background:var(--bg);border-bottom:1px solid var(--border)}
#content{flex:1;overflow-y:auto;padding:24px}
#mobile-nav{display:none;background:var(--surface);border-top:1px solid var(--border);padding:6px 0 env(safe-area-inset-bottom,10px);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:fixed;bottom:0;left:0;right:0;z-index:100}

@media(max-width:680px){
  #sidebar{display:none}
  #mobile-nav{display:flex;justify-content:flex-start;gap:0}
  #content{padding:16px;padding-bottom:100px}
  #main{padding-bottom:0}
}

/* Sidebar */
.sb-logo{padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.sb-brand{display:flex;align-items:center;gap:10px}
.sb-icon{width:34px;height:34px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.sb-name{font-size:15px;font-weight:700;color:var(--text)}
.sb-sub{font-size:11px;color:var(--muted);margin-top:1px}
.sb-nav{padding:10px 10px;flex:1}
.nav-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:9px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;margin-bottom:2px;text-align:left;font-family:inherit;transition:all .15s}
.nav-btn:hover{background:var(--bg);color:var(--text)}
.nav-btn.active{background:var(--accent-light);color:var(--accent-dark);font-weight:600}
.nav-inner{display:flex;align-items:center;gap:9px}
.nav-badge{font-size:10px;font-weight:700;background:var(--red);color:#fff;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center}
.sb-footer{padding:14px 18px;border-top:1px solid var(--border)}
.sb-footer-label{font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:500}
.sb-occ{font-size:11px;color:var(--accent-dark);margin-top:5px;font-weight:600}

/* Mobile nav */
.mob-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:6px 0;min-width:62px;flex-shrink:0;border-radius:8px;color:var(--muted);font-size:10px;font-family:inherit;position:relative;font-weight:500}
.mob-btn.active{color:var(--accent-dark);font-weight:600}
.mob-badge{position:absolute;top:2px;right:6px;font-size:9px;font-weight:700;background:var(--red);color:#fff;padding:1px 4px;border-radius:8px}

/* Progress bar */
.bar-track{height:8px;background:rgba(0,0,0,.15);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .8s ease,background .8s ease}

/* Badge */
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:600;letter-spacing:.03em;padding:3px 8px;border-radius:5px;white-space:nowrap;text-transform:capitalize}

/* KPI */
.kpi-grid{display:grid;gap:14px;margin-bottom:16px}
.kpi-4{grid-template-columns:repeat(4,1fr)}
.kpi-3{grid-template-columns:repeat(3,1fr)}
.kpi-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.kpi-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.kpi-4{grid-template-columns:repeat(2,1fr)}.kpi-3{grid-template-columns:repeat(3,1fr)}}

.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;position:relative}
.kpi-accent-bar{position:absolute;top:0;left:0;width:100%;height:3px;border-radius:12px 12px 0 0}
.kpi-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:12px}
.kpi-label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.kpi-value{font-size:24px;font-weight:700;font-family:'DM Mono',monospace;line-height:1;color:var(--text)}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:5px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
.card-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:7px}

/* Tables */
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:12px 16px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;background:var(--bg);border-bottom:1px solid var(--border)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#FAFBFC}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(.95)}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:var(--red-light);color:var(--red);border:1px solid #FECDD3}
.btn-wa{background:var(--wa-light);color:var(--wa);border:1px solid #BBF7D0}
.btn-sm{padding:6px 11px;font-size:11px;border-radius:7px}

/* Forms */
.field{margin-bottom:14px}
.field-label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px;display:block}
.inp{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;outline:none;font-family:inherit;transition:border-color .15s}
.inp:focus{border-color:var(--accent);background:#fff}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:#0006;z-index:999;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px #0000001A}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-title{font-size:15px;font-weight:700}
.modal-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:22px;line-height:1;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.modal-close:hover{background:var(--bg)}
.modal-body{padding:22px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

/* Alert chips */
.alert-chip{font-size:11px;font-weight:600;padding:5px 11px;border-radius:7px;display:flex;align-items:center;gap:5px}

/* Page header */
.page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.page-title{font-size:21px;font-weight:700;color:var(--text)}
.page-sub{font-size:12px;color:var(--muted);margin-top:3px}

/* Filters */
.filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s}
.filter-btn:hover{border-color:var(--border2);color:var(--text)}
.filter-btn.active{border-color:var(--accent);background:var(--accent-light);color:var(--accent-dark);font-weight:600}
.search-wrap{position:relative;flex:1;min-width:160px}
.search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:14px;pointer-events:none}
.search-inp{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px 8px 34px;color:var(--text);font-size:13px;outline:none;font-family:inherit}
.search-inp:focus{border-color:var(--accent)}

/* Property cards */
.prop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.prop-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:20px;transition:box-shadow .2s}
.prop-card:hover{box-shadow:0 4px 20px #0000000A}
.prop-card.loss{border-color:#FECDD3}
.prop-metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.metric-box{background:var(--bg);border-radius:8px;padding:10px 11px;border:1px solid var(--border)}
.metric-label{font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:500}
.metric-val{font-size:13px;font-weight:700;font-family:'DM Mono',monospace}

/* Tenant cards */
.tenant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.tenant-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:20px;transition:box-shadow .2s}
.tenant-card:hover{box-shadow:0 4px 20px #0000000A}
.tenant-card.arrears{border-color:#FECDD3}
.t-avatar{width:42px;height:42px;border-radius:12px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--accent-dark);flex-shrink:0}

/* Maint cards */
.maint-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.maint-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:20px}
.maint-card.urgent-open{border-color:#FECDD3}

/* Divider */
.divider{height:1px;background:var(--border);margin:10px 0}

/* P&L rows */
.pl-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.pl-row:last-child{border-bottom:none;padding-top:12px}
.pl-label{font-size:13px;color:var(--muted)}
.pl-val{font-size:13px;font-weight:700;font-family:'DM Mono',monospace}

/* Chart */
.chart-bars{display:flex;align-items:flex-end;gap:10px;height:110px}
.chart-month{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.chart-pair{width:100%;display:flex;gap:2px;align-items:flex-end;height:90px}
.chart-bar{flex:1;border-radius:4px 4px 0 0;transition:height .6s}
.chart-lbl{font-size:10px;color:var(--muted)}

/* Exp bar */
.exp-bar-row{margin-bottom:14px}
.exp-bar-top{display:flex;justify-content:space-between;margin-bottom:5px}

/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-6-4{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-bottom:16px}
@media(max-width:700px){.grid-2,.grid-6-4{grid-template-columns:1fr}}

/* WhatsApp button */
.wa-btn{display:inline-flex;align-items:center;gap:5px;background:var(--wa-light);color:var(--wa);border:1px solid #BBF7D0;border-radius:7px;padding:6px 11px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;transition:all .15s;white-space:nowrap}
.wa-btn:hover{background:#D1FAE5}

/* Mono */
.mono{font-family:'DM Mono',monospace}

/* Tag */
.tag-wa{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--wa);background:var(--wa-light);border:1px solid #BBF7D0;border-radius:5px;padding:2px 7px;font-weight:500}

/* Empty */
.empty{padding:48px 20px;text-align:center;color:var(--dim);font-size:13px}

/* Section title */
.section-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}

/* Input group */
.input-prefix{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.input-prefix:focus-within{border-color:var(--accent)}
.input-prefix-label{padding:9px 10px;font-size:13px;color:var(--muted);background:var(--border);white-space:nowrap;font-weight:500;border-right:1px solid var(--border)}
.input-prefix .inp{border:none;border-radius:0;background:transparent}
.input-prefix .inp:focus{background:transparent}
@media print {
  body > *:not(#agreement-overlay) { display: none !important; }
  #agreement-overlay { position: static !important; overflow: visible !important; }
  #agreement-overlay > div:first-child { display: none !important; }
}


@keyframes kf-pulse {
  0%,100%{opacity:.3;transform:scale(1)}
  50%{opacity:1;transform:scale(1.3)}
}

/* Boot / org resolution — hide main UI until workspace is ready */
#app-boot-overlay{position:fixed;inset:0;z-index:100000;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px}
#app-boot-overlay.app-boot--hide{display:none}
.app-boot-inner{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:320px}
.app-boot-spinner{width:44px;height:44px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:app-boot-spin .75s linear infinite}
@keyframes app-boot-spin{to{transform:rotate(360deg)}}
.app-boot-text{font-size:14px;color:var(--muted);font-weight:600;line-height:1.45}
</style>

  </div>
</div>
<div id="app">
  <div id="sidebar">
    <div class="sb-logo">
      <div class="sb-brand">
        <div class="sb-icon">🏠</div>
        <div><div class="sb-name">PropManager</div><div class="sb-sub" id="sb-sub-txt">South London HMOs</div></div>

    <div class="sb-nav" id="sb-nav"></div>
    <div class="sb-footer">
      <div class="sb-footer-label">Portfolio Occupancy</div>

      <div class="sb-occ" id="occ-label"></div>

  <div id="main">
    <div id="topbar" style="display:flex;align-items:center;gap:12px;position:relative">
      <div style="font-size:12px;color:var(--muted);font-weight:500;flex-shrink:0">📅 March 2026</div>
      <!-- Global Search -->
      <div style="flex:1;max-width:420px;position:relative" id="gs-wrap">
        <div style="position:relative">
          <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted);pointer-events:none">🔍</span>
          <input id="gs-input" type="text" placeholder="Search tenants, properties, maintenance…"
            oninput="gsSearch(this.value)"
            onfocus="if(this.value)gsSearch(this.value)"
            onblur="setTimeout(function(){document.getElementById('gs-results').style.display='none'},180)"
            onkeydown="gsKey(event)"
            style="width:100%;padding:8px 10px 8px 32px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface);font-family:inherit;font-size:13px;color:var(--text)">
        </div>
        <div id="gs-results" style="display:none;position:absolute;top:calc(100%+4px);left:0;right:0;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:9000;max-height:380px;overflow-y:auto"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex-shrink:0" id="alerts-bar"></div>
    </div>
    <div id="content"></div>
  </div>
</div>

// ── Restore persisted user data immediately (before async loadState) ──────────
// This runs synchronously so saved users/companies/config win over hardcoded defaults
(function _restoreLocalState() {
  var keys = ['companies', 'config'];
  keys.forEach(function(k) {
    try {
      var raw = localStorage.getItem('pm_local_' + k);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed !== null && parsed !== undefined) state[k] = parsed;
      }
    } catch(e) {}
  });
})();

const fmt = n => '£' + Math.round(Number(n)||0).toLocaleString('en-GB');
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const net = p => p.rent - p.landlord;

const BADGE_COLORS = {
  active:['#10B981','#ECFDF5'], notice_given:['#F59E0B','#FFFBEB'],
  paid:['#10B981','#ECFDF5'], outstanding:['#E8375A','#FEF0F3'],
  open:['#E8375A','#FEF0F3'], in_progress:['#F59E0B','#FFFBEB'], resolved:['#10B981','#ECFDF5'],
  confirmed:['#10B981','#ECFDF5'], estimated:['#F59E0B','#FFFBEB'],
  urgent:['#E8375A','#FEF0F3'], medium:['#F59E0B','#FFFBEB'], low:['#94A3B8','#F1F5F9'],
  bank:['#3B82F6','#EFF6FF'], cash:['#F59E0B','#FFFBEB'],
  Loss:['#E8375A','#FEF0F3'], Active:['#10B981','#ECFDF5'], Notice:['#F59E0B','#FFFBEB'],
};
function badge(label, override) {
  const clean = String(label).replace('_',' ');
  const key = label;
  const [c,bg] = override || BADGE_COLORS[key] || ['#64748B','#F1F5F9'];
  return `<span class="badge" style="color:${c};background:${bg}">${clean}</span>`;
}

function kpi(label, value, sub, color, icon) {
  return `<div class="kpi">
    <div class="kpi-accent-bar" style="background:${color}"></div>
    <div class="kpi-icon" style="background:${color}15">${icon||'📊'}</div>
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${value}</div>
    ${sub?`<div class="kpi-sub">${sub}</div>`:''}
  </div>`;
}

function btn(label, onclick, variant='primary', sm=false) {
  return `<button class="btn btn-${variant}${sm?' btn-sm':''}" onclick="${onclick}">${label}</button>`;
}

function waLink(number, message='') {
  const clean = number.replace(/\D/g,'');
  const msg = encodeURIComponent(message);
  return `https://wa.me/${clean}${msg?'?text='+msg:''}`;
}

function waBtn(number, message, label='WhatsApp') {
  if(!number) return '<span style="font-size:11px;color:var(--dim)">No number</span>';
  return `<a href="${waLink(number,message)}" target="_blank" class="wa-btn">💬 ${label}</a>`;
}

function getStats() {
  const income = state.properties.reduce((s,p)=>s+p.rent,0);
  const landlord = state.properties.reduce((s,p)=>s+p.landlord,0);
  const opex = state.expenses.reduce((s,e)=>s+e.amount,0);
  const rooms = state.properties.reduce((s,p)=>s+p.rooms,0);
  const occ = state.properties.reduce((s,p)=>s+p.occupied,0);
  const paid = state.payments.filter(p=>p.status==='paid');
  const owed = state.payments.filter(p=>p.status==='outstanding');
  const openM = state.maintenance.filter(m=>m.status!=='resolved');
  return {income,landlord,opex,profit:income-landlord-opex,rooms,occ,paid,owed,openM};
}

function normalizeRole(role) {

/** Bind Supabase session to state.users / state.currentUser (always use session.user.id). */
function upsertSessionUser(session, roleHint) {
  if (!session || !session.user) return null;
  var authId = session.user.id;
  var authEmail = (session.user.email || '').trim();
  var authName = (session.user.user_metadata && session.user.user_metadata.full_name)
    ? String(session.user.user_metadata.full_name).trim()
    : (authEmail ? authEmail.split('@')[0] : 'User');
  var role = normalizeRole(roleHint != null ? roleHint : _currentMemberRole);
  var initials = (authName || 'U').split(/\s+/).map(function(w){ return w[0]||''; }).join('').toUpperCase().slice(0,2) || 'U';

  var matched = state.users.find(function(u){ return String(u.id) === String(authId); });
  if (!matched && authEmail) {
    matched = state.users.find(function(u){
      return u.email && u.email.toLowerCase() === authEmail.toLowerCase();
    });
  }
  if (matched) {
    matched.id = authId;
    matched.name = authName || matched.name || 'User';
    matched.email = authEmail || matched.email || '';
    matched.initials = initials;
    matched.role = role;
    matched.status = matched.status || 'active';
    matched.lastLogin = 'Today';
    state.currentUser = matched;
  } else {
    state.currentUser = {
      id: authId, name: authName, initials: initials,
      email: authEmail, phone: '', role: role, status: 'active', lastLogin: 'Today'
    };
    state.users.push(state.currentUser);
  }
  return state.currentUser;
}

async function syncUsersFromOrgMembers(session){
  if(!_currentOrgId) return;
  try{
    var existingById = {};
    (state.users||[]).forEach(function(u){ existingById[String(u.id)] = u; });
    var pendingInvites = (state.users||[]).filter(function(u){ return u && u.status === 'pending'; });
    var currentId = String(session && session.user ? session.user.id : '');
    var currentEmail = session && session.user ? (session.user.email||'') : '';
    var currentName = session && session.user && session.user.user_metadata && session.user.user_metadata.full_name
      ? session.user.user_metadata.full_name
      : (state.currentUser && state.currentUser.name ? state.currentUser.name : 'User');

    var q = await supa.from('org_members')
      .select('user_id, role, created_at')
      .eq('org_id', _currentOrgId)
      .order('created_at', {ascending:true});
    if(q.error) {
      console.warn('syncUsersFromOrgMembers:', q.error);
      return;
    }

    var mapped = (q.data||[]).map(function(m){
      var uid = String(m.user_id||'');
      var prev = existingById[uid] || {};
      var isMe = uid === currentId;
      var name = prev.name || (isMe ? currentName : ('User ' + uid.slice(-6)));
      var email = prev.email || (isMe ? currentEmail : '');
      var initials = (name||'U').split(/\s+/).map(function(w){return w[0]||'';}).join('').toUpperCase().slice(0,2) || 'U';
      return {
        id: uid,
        name: name,
        initials: initials,
        email: email,
        phone: prev.phone || '',
        role: normalizeRole(m.role),
        status: 'active',
        lastLogin: isMe ? 'Today' : (prev.lastLogin || '—')
      };
    });

    state.users = mapped.concat(pendingInvites);
    var me = state.users.find(function(u){ return String(u.id) === currentId; });
    if(me) state.currentUser = me;
  }catch(e){
    console.warn('syncUsersFromOrgMembers failed:', e);
  }
}

async function resolveOrg(session) {
  _currentMemberRole = 'viewer';
  setAppBootMessage('Preparing your workspace…');
  // 1. Look up org_members for this user (maybeSingle: no row is OK)
  var { data: membership, error: memberErr } = await supa.from('org_members')
    .select('org_id, role, organisations(id,name,plan,status,trial_ends_at)')
    .eq('user_id', session.user.id)
    .maybeSingle();
  if (memberErr && memberErr.code !== 'PGRST116') {
    console.warn('org_members lookup:', memberErr);
  }

  if (membership && membership.org_id) {
    _currentOrgId = membership.org_id;
    _currentMemberRole = normalizeRole(membership.role);
    var org = membership.organisations;
    state._currentOrg = org; // store for Settings page

    // Trial enforcement — check if expired
    if (org && org.status === 'trial' && org.trial_ends_at) {
      var daysLeft = Math.ceil((new Date(org.trial_ends_at) - new Date()) / 86400000);
      if (daysLeft < 0) {
        // Trial expired — show locked screen
        showTrialExpired(org.name);
        return false;
      }
      // Trial active — show warning if close
      if (daysLeft <= 3) {
        setTimeout(function(){
          showToast && showToast('⚠️ Trial expires in ' + daysLeft + ' day' + (daysLeft===1?'':'s'), 'warn');
        }, 2000);
      }
    }

    // Account paused or cancelled
    if (org && (org.status === 'paused' || org.status === 'cancelled')) {
      showAccountInactive(org.status, org.name);
      return false;
    }

    return true;
  }

  // 2. No org found — this is a brand new user. Provision their org.
  setAppBootMessage('Creating your organisation…');
  var email     = session.user.email || '';
  var name      = (session.user.user_metadata && session.user.user_metadata.full_name) || email.split('@')[0];
  var companyName = (session.user.user_metadata && session.user.user_metadata.company_name) || name + "'s Properties";
  companyName = String(companyName).trim() || (name + "'s Properties");
  var selectedPlan = (session.user.user_metadata && session.user.user_metadata.selected_plan) || 'trial';
  var slug      = companyName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + Date.now();
  var trialEnd  = new Date(Date.now() + 14 * 86400000).toISOString();

  // Create organisation (owner_email = account email; creator becomes admin in org_members)
  var { data: newOrg, error: orgErr } = await supa.from('organisations').insert([{
    name:          companyName,
    slug:          slug,
    owner_email:   email,
    plan:          selectedPlan !== 'trial' ? selectedPlan : 'trial',
    status:        'trial',
    trial_ends_at: trialEnd,
  }]).select().single();

  if (orgErr || !newOrg) {
    console.error('Failed to create org:', orgErr);
    showToast && showToast('Could not create your organisation. Check console / Supabase policies.', 'error');
    return false;
  }

  // Link user to org — first user is organisation admin (owner)
  var { error: omErr } = await supa.from('org_members').insert([{
    org_id:  newOrg.id,
    user_id: session.user.id,
    role:    'admin',
  }]);
  if (omErr) {
    console.error('Failed to create org_members:', omErr);
    showToast && showToast('Organisation created but membership failed. Contact support.', 'error');
    return false;
  }

  _currentOrgId = newOrg.id;
  _currentMemberRole = 'admin';
  state._currentOrg = newOrg; // store for Settings page
  console.log('New org provisioned:', newOrg.name, newOrg.id);
  return true;
}

const WEEKS_AHEAD = 8;
const MONTHS = (function() {
  var now = new Date();
  var result = [];
  for(var i=5; i>=0; i--) {
    var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    var y = d.getFullYear(), m = d.getMonth();
    var lastDay = new Date(y, m+1, 0).getDate();
    var MONTHS_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var key = y+'-'+(m+1<10?'0':'')+(m+1);
    result.push({
      key: key,
      label: MONTHS_ABBR[m]+' '+y,
      from: new Date(y, m, 1),
      to:   new Date(y, m, lastDay)
    });
  }
  return result;
})();

function _parseRoomEid(el) {
  var id = el.id || '';
  if(!id || id === 'rm-') return null; // stale element, ignore silently
  var m = id.match(/^rm-(.+)__(\d+)-/);
  if(!m) return null; // silently ignore non-matching elements
  var eidKey = m[1] + '__' + m[2];
  if(window._roomEidMap && window._roomEidMap[eidKey]) return window._roomEidMap[eidKey];
  return {pid: m[1], rn: parseInt(m[2])};
}

function getMonthStats(monthKey) {
  var mo = MONTHS.find(function(m){return m.key===monthKey;});
  if(!mo) return null;
  var pool = getFullPaymentPool();
  var pays = pool.filter(function(p){var d=getDueDateObj(p);return d>=mo.from&&d<=mo.to;});
  var income = pays.filter(function(p){return p.status==='paid';}).reduce(function(s,p){return s+p.amount;},0);
  var landlord = state.properties.reduce(function(s,p){return s+p.landlord;},0);
  var opex = state.expenses.reduce(function(s,e){return s+e.amount;},0);
  var occ = state.properties.reduce(function(s,p){return s+p.occupied;},0);
  var rooms = state.properties.reduce(function(s,p){return s+p.rooms;},0);
  // Outstanding: count unpaid entries from rentSchedule in this month
  var schedOutstanding = (state.rentSchedule||[]).filter(function(s){
    if(s.status==='paid') return false;
    if(!s.dueDateRaw) return false;
    var d = new Date(s.dueDateRaw);
    return d>=mo.from && d<=mo.to;
  }).length;
  // Expected income = weekly rent × 52/12 for all active tenants
  var expectedIncome = Math.round(state.tenants.filter(function(t){return t.status==='active';})
    .reduce(function(s,t){return s+(t.freq==='monthly'?t.rent:(t.rent||0)*52/12);},0));
  var expectedGross = expectedIncome - landlord;
  var expectedNet   = expectedIncome - landlord - opex;
  return {income:income, landlord:landlord, opex:opex, profit:income-landlord-opex,
          occ:occ, rooms:rooms, outstanding:schedOutstanding, pays:pays,
          label:mo.label, expectedIncome:expectedIncome,
          expectedGross:expectedGross, expectedNet:expectedNet};
}

  html += '<div class="card" style="'+(lossProps.length>0?'border-color:#FECDD3':'')+'"><div class="card-title" style="color:'+(lossProps.length>0?'var(--red)':'var(--text)')+'">&#x26A0;&#xFE0F; Loss-Making ('+lossProps.length+')</div>';
  if(!lossProps.length){html+='<div style="font-size:13px;color:var(--green)">&#x2713; All properties profitable</div>';}
  else{lossProps.slice(0,6).forEach(function(p){html+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><div><div style="font-size:12px;font-weight:600">'+p.name+'</div><div style="font-size:11px;color:var(--muted)">'+p.occupied+'/'+p.rooms+' rooms</div></div><span class="mono" style="font-size:12px;font-weight:700;color:var(--red)">'+fmt(net(p))+'</span></div>';});if(lossProps.length>6)html+='<div style="font-size:11px;color:var(--muted);padding-top:6px">+'+(lossProps.length-6)+' more</div>';}
  html += '</div>';
  html += '<div class="card"><div class="card-title" style="color:var(--amber)">&#x1F527; Open Maintenance</div>';
  if(!s.openM.length){html+='<div style="font-size:13px;color:var(--green)">&#x2713; No open issues</div>';}
  else{s.openM.slice(0,5).forEach(function(m){html+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><div><div style="font-size:12px;font-weight:600">'+m.issue+'</div><div style="font-size:11px;color:var(--muted)">'+m.property+' &middot; Rm '+m.room+'</div></div>'+badge(m.priority)+'</div>';});}
  html += '</div></div>';

  // Void tracker
  // Property docs expiry alerts
  if(state.propDocs) {
    var expiringDocs = [];
    Object.keys(state.propDocs).forEach(function(pid){
      (state.propDocs[pid]||[]).forEach(function(doc){
        if(!doc.expiresAt) return;
        var days = Math.ceil((new Date(doc.expiresAt)-TODAY)/86400000);
        if(days <= 90) {
          var p = state.properties.find(function(x){return x.id===+pid;});
          expiringDocs.push({doc:doc, days:days, propName:p?p.name:'Unknown'});
        }
      });
    });
    expiringDocs.sort(function(a,b){return a.days-b.days;});
    if(expiringDocs.length) {
      html += '<div class="card" style="border-color:#FED7AA;margin-top:0">';
      html += '<div class="card-title" style="color:#C2410C">⚠️ Documents Expiring Soon ('+expiringDocs.length+')</div>';
      expiringDocs.slice(0,8).forEach(function(item){
        var col = item.days<0?'var(--red)':item.days<=30?'#EA580C':'#D97706';
        var bg  = item.days<0?'#FEE2E2':item.days<=30?'#FFF7ED':'#FFFBEB';
        html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">';
        html += '<div><div style="font-size:12px;font-weight:700">'+item.doc.type+'</div>';
        html += '<div style="font-size:11px;color:var(--muted)">'+item.propName+'</div></div>';
        html += '<span style="font-size:11px;font-weight:700;color:'+col+';background:'+bg+';padding:3px 10px;border-radius:8px">';
        html += item.days<0?'Expired':item.days===0?'Today!':item.days+'d left';
        html += '</span></div>';
      });
      html += '</div>';
    }
  }
  // ── AI Agent card ──
  html += '<div class="card" style="margin-top:0;padding:0;overflow:hidden">';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#0F0F1A 0%,#1a1a3e 100%)">';
  html += '<div style="display:flex;align-items:center;gap:10px">';
  html += '<div style="font-size:22px">🤖</div>';
  html += '<div><div style="font-size:14px;font-weight:800;color:#fff">AI Portfolio Agent</div>';
  html += '<div style="font-size:11px;color:rgba(255,255,255,.5)">Daily insights · Tasks · Health score</div></div>';
  html += '</div>';
  html += '</div>';
  html += '<div id="ai-agent-output"></div>';
  html += '</div>';
  html += '<div class="card" style="margin-top:0">'+renderVoidTracker()+'</div>';

  return html;
}


function renderProperties() {
  if((state.filters.propView||'list')==='deal') return renderPropertiesDealView();
  const f = state.filters.props||'all';
  const q = (state.filters.propQ||'').toLowerCase();
  const pco = state.filters.propCompany||'';
  const data = state.properties.filter(p=>{
    if(pco && p.companyId!==pco) return false;
    const ok = p.name.toLowerCase().includes(q)||p.area.toLowerCase().includes(q);
    if(f==='profitable') return ok&&net(p)>0;
    if(f==='loss') return ok&&net(p)<0;
    if(f==='vacant') return ok&&p.occupied<p.rooms;
    if(f==='owned')   return ok&&p.ownershipType==='owned';
    if(f==='managed') return ok&&p.ownershipType!=='owned';
    return ok;
  });
  const coOpts = '<option value="">&#x1F3E2; All Companies</option>'+(state.companies||[]).map(c=>'<option value="'+c.id+'" '+(pco===c.id?'selected':'')+'>'+c.name+'</option>').join('');
  return `
    <div class="page-header">
      <div><div class="page-title">Properties</div><div class="page-sub">${data.length} of ${state.properties.length} properties</div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button onclick="propViewDeal()" style="padding:9px 14px;border-radius:10px;border:1.5px solid var(--accent);background:var(--accent-light);color:var(--accent-dark);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Deal Analyzer</button>
        <select onchange="state.filters.propCompany=this.value;render()" style="padding:9px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);font-family:inherit;font-size:13px;font-weight:600;color:var(--text);cursor:pointer">${coOpts}</select>
        ${btn('+ Add Property',"openModal('addProp')")}
      </div>
    </div>
    <div class="filters">
      <div class="search-wrap"><span class="search-ico">🔍</span><input class="search-inp" placeholder="Search properties…" value="${state.filters.propQ||''}" oninput="state.filters.propQ=this.value;debouncedPropSearch()"></div>
      ${['all','owned','managed','profitable','loss','vacant'].map(v=>`<button class="filter-btn ${f===v?'active':''}" onclick="state.filters.props='${v}';render()">${v==='loss'?'Loss-Making':v==='vacant'?'Has Vacancies':v==='owned'?'🏠 Owned':v==='managed'?'🤝 Managed':v[0].toUpperCase()+v.slice(1)}</button>`).join('')}
    </div>
    <!-- Portfolio KPI strip -->
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px">
        <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Total Portfolio</div>
        <div style="display:flex;justify-content:space-between;align-items:flex-end">
          <div>
            <div style="font-size:22px;font-weight:800;color:var(--text);font-family:monospace">${state.properties.length}</div>
            <div style="font-size:11px;color:var(--muted)">properties</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:18px;font-weight:800;color:var(--muted);font-family:monospace">${data.reduce((s,p)=>s+p.rooms,0)}</div>
            <div style="font-size:11px;color:var(--muted)">total rooms</div>
          </div>
        </div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px">
        <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Occupancy</div>
        <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px">
          <div>
            <div style="font-size:22px;font-weight:800;font-family:monospace;color:${(()=>{const occ=data.reduce((s,p)=>s+p.occupied,0);const tot=data.reduce((s,p)=>s+p.rooms,0);const pct=tot?Math.round(occ/tot*100):0;return pct>=85?'var(--green)':pct>=70?'var(--amber)':'var(--red)';})()} ">${(()=>{const occ=data.reduce((s,p)=>s+p.occupied,0);const tot=data.reduce((s,p)=>s+p.rooms,0);return tot?Math.round(occ/tot*100):0;})()}%</div>
            <div style="font-size:11px;color:var(--muted)">${data.reduce((s,p)=>s+p.occupied,0)} occupied</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:18px;font-weight:800;color:var(--red);font-family:monospace">${state.properties.reduce((s,p)=>s+(p.rooms-p.occupied),0)}</div>
            <div style="font-size:11px;color:var(--muted)">vacant</div>
          </div>
        </div>
        <div style="background:var(--border);border-radius:3px;height:4px;overflow:hidden"><div style="height:100%;border-radius:3px;background:var(--green);width:${(()=>{const occ=data.reduce((s,p)=>s+p.occupied,0);const tot=data.reduce((s,p)=>s+p.rooms,0);return tot?Math.round(occ/tot*100):0;})()}%"></div></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">
      <div style="background:var(--green-light);border:1px solid #A7F3D0;border-radius:12px;padding:12px;text-align:center">
        <div style="font-size:14px;font-weight:800;color:var(--green);font-family:monospace">${fmt(data.reduce((s,p)=>s+p.rent,0))}</div>
        <div style="font-size:10px;font-weight:700;color:var(--green);margin-top:3px">MONTHLY INCOME</div>
      </div>
      <div style="background:var(--red-light);border:1px solid #FECDD3;border-radius:12px;padding:12px;text-align:center">
        <div style="font-size:14px;font-weight:800;color:var(--red);font-family:monospace">${fmt(data.reduce((s,p)=>s+p.landlord,0))}</div>
        <div style="font-size:10px;font-weight:700;color:var(--red);margin-top:3px">LANDLORD COSTS</div>
      </div>
      <div style="background:${data.reduce((s,p)=>s+net(p),0)>=0?'var(--green-light)':'var(--red-light)'};border:1px solid ${data.reduce((s,p)=>s+net(p),0)>=0?'#A7F3D0':'#FECDD3'};border-radius:12px;padding:12px;text-align:center">
        <div style="font-size:14px;font-weight:800;color:${data.reduce((s,p)=>s+net(p),0)>=0?'var(--green)':'var(--red)'};font-family:monospace">${fmt(data.reduce((s,p)=>s+net(p),0))}</div>
        <div style="font-size:10px;font-weight:700;color:${data.reduce((s,p)=>s+net(p),0)>=0?'var(--green)':'var(--red)'};margin-top:3px">NET PROFIT/MO</div>
      </div>
    </div>

    <div class="prop-grid">
      ${data.map(p=>{
        const n=net(p); const o=pct(p.occupied,p.rooms);
        const oc=o===100?'var(--green)':o<70?'var(--red)':'var(--amber)';
        const vacantRooms = p.roomList ? p.roomList.filter(r=>r.status==='vacant').length : p.rooms-p.occupied;
        return `<div class="prop-card${n<0?' loss':''}" onclick="openPropDetail('${p.id}')" style="cursor:pointer">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
            <div style="flex:1;min-width:0">
              <div style="font-size:15px;font-weight:700;margin-bottom:2px">${p.name}</div>
              <div style="font-size:12px;color:var(--muted)">${p.address||p.area}</div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:10px;flex-wrap:wrap;justify-content:flex-end">
              ${p.ownershipType==='owned'
                ? `<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0">🏠 Owned</span>`
                : `<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;background:#FFFBEB;color:#92400E;border:1px solid #FDE68A">🤝 Managed</span>`}
              ${p.lettingType==='whole'
                ? `<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE">🏡 ${p.bedrooms||'?'}-bed</span>`
                : ''}
              ${badge(n<0?'Loss':'Active')}
            </div>
          </div>
          <div style="margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;margin-bottom:5px">
              <span style="font-size:11px;color:var(--muted);font-weight:500">Occupancy</span>
              <span style="font-size:11px;font-weight:600;color:${oc}">${p.lettingType==='whole' ? (p.occupied>0?'Occupied':'Vacant')+' · '+(p.bedrooms||'?')+' bed' : p.occupied+'/'+p.rooms+' rooms · '+o+'%'+(vacantRooms>0?' · '+vacantRooms+' vacant':'')}</span>
            </div>
            <div class="bar-track"><div class="bar-fill" style="width:${o}%;background:${oc}"></div></div>
          </div>
          <div class="prop-metrics">
            <div class="metric-box"><div class="metric-label">Income</div><div class="metric-val" style="color:var(--green)">${fmt(p.rent)}</div></div>
            <div class="metric-box"><div class="metric-label">Landlord</div><div class="metric-val" style="color:var(--red)">${fmt(p.landlord)}</div></div>
            <div class="metric-box"><div class="metric-label">Profit</div><div class="metric-val" style="color:${n>=0?'var(--green)':'var(--red)'}">${fmt(n)}</div></div>
          </div>
          <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
            ${p.mapsUrl?`<a href="${p.mapsUrl}" target="_blank" onclick="event.stopPropagation()" style="font-size:11px;color:var(--blue);text-decoration:none;display:flex;align-items:center;gap:4px">📍 View on Maps</a>`:'<span></span>'}
            <span style="font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px">Tap to edit ✏️</span>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

function renderTenants() {
  const f = state.filters.tenants||'all';
  const q = (state.filters.tenantQ||'').toLowerCase();
  const propFilter = state.filters.tenantProp||'';
  const typeFilter = state.filters.tenantType || '';
  const data = state.tenants.filter(t=>{
    const ok = t.name.toLowerCase().includes(q)||t.property.toLowerCase().includes(q);
    if(propFilter && t.property !== propFilter) return false;
    if(typeFilter && (t.roomType||'Single') !== typeFilter) return false;
    if(f==='active')   return ok&&t.status==='active';
    if(f==='notice')   return ok&&t.status==='notice_given';
    if(f==='arrears')  return ok&&t.arrears>0&&t.status!=='inactive';
    if(f==='archived') return ok&&t.status==='inactive';
    return ok&&t.status!=='inactive';
  });

  return `
    <div class="page-header">
      <div><div class="page-title">Tenants</div><div class="page-sub">${state.tenants.filter(t=>t.status==='active').length} active · ${state.tenants.filter(t=>t.arrears>0).length} in arrears</div></div>
      ${btn('+ Add Tenant',"openModal('addTenant')")}
    </div>
    <!-- Tenant KPIs -->
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px">
        <div style="display:flex;justify-content:space-between;align-items:flex-end">
          <div>
            <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:4px">Active Tenants</div>
            <div style="font-size:24px;font-weight:800;color:var(--green);font-family:monospace">${state.tenants.filter(t=>t.status==='active').length}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:18px;font-weight:800;color:var(--muted);font-family:monospace">${(()=>{const r=state.properties.reduce((s,p)=>s+p.rooms,0);const a=state.tenants.filter(t=>t.status==='active').length;return r?Math.round(a/r*100):0;})()}%</div>
            <div style="font-size:10px;color:var(--muted)">occupancy</div>
          </div>
        </div>
        <div style="background:var(--border);border-radius:3px;height:4px;margin-top:8px;overflow:hidden">
          <div style="height:100%;border-radius:3px;background:${(()=>{const r=state.properties.reduce((s,p)=>s+p.rooms,0);const a=state.tenants.filter(t=>t.status==='active').length;const pct=r?Math.round(a/r*100):0;return pct>=90?'#10B981':pct>=70?'#F59E0B':'#EF4444';})()};width:${(()=>{const r=state.properties.reduce((s,p)=>s+p.rooms,0);const a=state.tenants.filter(t=>t.status==='active').length;return r?Math.round(a/r*100):0;})()}%"></div>
        </div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:${state.tenants.filter(t=>t.arrears>0&&t.status!=='inactive').length?'10px':'14px'}">
      <div style="background:var(--green-light);border:1px solid #A7F3D0;border-radius:10px;padding:10px;text-align:center">
        <div style="font-size:18px;font-weight:800;color:var(--green)">${state.tenants.filter(t=>t.status==='active').length}</div>
        <div style="font-size:10px;font-weight:700;color:var(--green);text-transform:uppercase;margin-top:2px">Active</div>
      </div>
      <div style="background:${state.tenants.filter(t=>t.status==='notice_given').length?'var(--amber-light)':'var(--bg)'};border:1px solid ${state.tenants.filter(t=>t.status==='notice_given').length?'#FDE68A':'var(--border)'};border-radius:10px;padding:10px;text-align:center">
        <div style="font-size:18px;font-weight:800;color:${state.tenants.filter(t=>t.status==='notice_given').length?'var(--amber)':'var(--dim)'}">${state.tenants.filter(t=>t.status==='notice_given').length}</div>
        <div style="font-size:10px;font-weight:700;color:${state.tenants.filter(t=>t.status==='notice_given').length?'var(--amber)':'var(--dim)'};text-transform:uppercase;margin-top:2px">On Notice</div>
      </div>
      <div style="background:${state.tenants.filter(t=>t.arrears>0&&t.status!=='inactive').length?'var(--red-light)':'var(--bg)'};border:1px solid ${state.tenants.filter(t=>t.arrears>0&&t.status!=='inactive').length?'#FECDD3':'var(--border)'};border-radius:10px;padding:10px;text-align:center">
        <div style="font-size:18px;font-weight:800;color:${state.tenants.filter(t=>t.arrears>0&&t.status!=='inactive').length?'var(--red)':'var(--dim)'}">${state.tenants.filter(t=>t.arrears>0&&t.status!=='inactive').length}</div>
        <div style="font-size:10px;font-weight:700;color:${state.tenants.filter(t=>t.arrears>0&&t.status!=='inactive').length?'var(--red)':'var(--dim)'};text-transform:uppercase;margin-top:2px">In Arrears</div>
      </div>
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center">
        <div style="font-size:18px;font-weight:800;color:var(--muted)">${state.tenants.filter(t=>t.status==='inactive').length}</div>
        <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-top:2px">Archived</div>
      </div>
    </div>

    <!-- Row 2 KPIs: rent roll, avg rate, longest overdue -->
    ${(function(){
      // Room type occupancy — count occupied vs total per type across all properties
      var TYPES = [
        {key:'Single',      icon:'🛏️',  color:'var(--blue)',   bg:'var(--blue-light)'},
        {key:'Double',      icon:'🛏️🛏️', color:'#7C3AED',      bg:'#F5F3FF'},
        {key:'Suite',       icon:'✨',   color:'var(--amber)',  bg:'var(--amber-light)'},
        {key:'Studio',      icon:'🏠',   color:'#0891B2',      bg:'#ECFEFF'},
        {key:'Whole House', icon:'🏡',   color:'var(--green)',  bg:'var(--green-light)'}
      ];
      var typeStats = {};
      TYPES.forEach(function(t){ typeStats[t.key] = {occ:0, total:0}; });
      state.properties.forEach(function(p){
        (p.roomList||[]).forEach(function(r){
          var key = r.type||'Single';
          if(!typeStats[key]) typeStats[key] = {occ:0, total:0};
          typeStats[key].total++;
          if(r.status==='occupied') typeStats[key].occ++;
        });
      });
      // Show ALL 5 types always so the row is always full
      var active = TYPES;
      var curTypeFilter = state.filters.tenantType||'';
      var html = '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px">';
      active.forEach(function(t){
        var s = typeStats[t.key];
        var pct = s.total ? Math.round(s.occ/s.total*100) : 0;
        var vacant = s.total - s.occ;
        var isActive = curTypeFilter===t.key;
        html += '<div onclick="state.filters.tenantType=(state.filters.tenantType===\''+t.key+'\' ? \'\':\''+t.key+'\'\');render()" style="background:'+(isActive?t.bg.replace('light','').trim()||t.bg:t.bg)+';border:'+(isActive?'2px solid '+t.color:'1px solid var(--border)')+';border-radius:11px;padding:10px 8px;text-align:center;cursor:pointer;transition:all .15s">';
        html += '<div style="font-size:16px;margin-bottom:2px">'+t.icon+'</div>';
        html += '<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:3px;white-space:nowrap">'+t.key+'</div>';
        html += '<div style="font-size:18px;font-weight:800;color:'+t.color+';font-family:monospace;line-height:1">'+s.occ+'/'+s.total+'</div>';
        html += '<div style="background:var(--border);border-radius:3px;height:3px;margin:5px 0 3px">';
        html += '<div style="background:'+t.color+';border-radius:3px;height:100%;width:'+pct+'%"></div></div>';
        html += '<div style="font-size:10px;color:var(--muted)">'+pct+'% · '+vacant+' free</div>';
        html += '</div>';
      });
      html += '</div>';
      return html;

// Simulate due dates based on payment id for demo realism
function getDueDateObj(p) {
  if(p._dueDateRaw) return new Date(p._dueDateRaw);
  return TODAY;
}
function getDueDate(p) { return getDueDateObj(p); }

function getDueStatus(p) {
  if(p.status==='paid') return 'paid';
  var due=getDueDateObj(p);
  // Normalize both to midnight for clean whole-day comparison
  var dueDay = new Date(due.getFullYear(), due.getMonth(), due.getDate());
  var todDay = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
  var diff = Math.round((dueDay - todDay) / 86400000);
  if(diff<0) return 'overdue';
  if(diff===0) return 'today';
  if(diff===1) return 'tomorrow';
  return 'upcoming';
}


function getRentTab(p) {
  const today = TODAY;
  const due = new Date(getDueDate(p));
  const diff = Math.round((due - today) / 86400000);
  if(p.status==='paid') return 'paid';
  if(diff < 0) return 'overdue';
  if(diff === 0) return 'today';
  if(diff === 1) return 'tomorrow';
  return 'upcoming';
}

function getPeriodDates(period) {
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  // Monday of current week
  var dow = now.getDay(); var diff = (dow===0?-6:1-dow);
  var monThis = new Date(y,m,d+diff);
  var sunThis = new Date(y,m,d+diff+6);
  var monPrev = new Date(monThis); monPrev.setDate(monPrev.getDate()-7);
  var sunPrev = new Date(sunThis); sunPrev.setDate(sunPrev.getDate()-7);
  // Current month
  var monthStart = new Date(y,m,1);
  var monthEnd   = new Date(y,m+1,0);
  // Prev month
  var pm = m===0?11:m-1; var py = m===0?y-1:y;
  var prevMonthStart = new Date(py,pm,1);
  var prevMonthEnd   = new Date(py,pm+1,0);
  var MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var fmt2 = function(d){return d.getDate()+' '+MONTHS_SHORT[d.getMonth()];};
  if(period==='week')      return {from:monThis, to:sunThis,      label:'This Week ('+fmt2(monThis)+'–'+fmt2(sunThis)+' '+y+')'};
  if(period==='prev-week') return {from:monPrev, to:sunPrev,      label:'Last Week ('+fmt2(monPrev)+'–'+fmt2(sunPrev)+')'};
  if(period==='month')     return {from:monthStart, to:monthEnd,  label:MONTHS_SHORT[m]+' '+y};
  if(period==='prev-month')return {from:prevMonthStart, to:prevMonthEnd, label:MONTHS_SHORT[pm]+' '+py};
  if(period==='ytd')       return {from:new Date(y,0,1), to:now,  label:'Year to Date '+y};
  return {from:monThis, to:sunThis, label:'This Week'};
}

function getFullPaymentPool() {
  var pool = state.payments.slice();
  var seen = new Set(pool.map(function(p){
    var t = p.tenant||p.tenantName||'';
    var d = p._dueDateRaw||(p.dueDate?new Date(p.dueDate).getTime():null)||0;
    return t+'|'+d+'|'+(p.amount||0);
  }));
  state.tenants.forEach(function(t) {
    if(!t.paymentHistory) return;
    t.paymentHistory.forEach(function(h) {
      if(h.type!=='history') return;
      var parts=h.date.split(' ');
      var months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
      var d=new Date(+parts[2],months[parts[1]],+parts[0]);
      var raw=d.getTime();
      var key=t.name+'|'+raw+'|'+h.amount;
      if(!seen.has(key)){seen.add(key);pool.push({id:'h_'+t.id+'_'+raw,tenant:t.name,property:t.property,room:t.room,amount:h.amount,method:h.method,status:h.status,_dueDateRaw:raw,_fromHistory:true});}
    });
  });
  return pool;
}

function calcLateFee(p) {
  var cfg = state.lateFeeConfig;
  if(!cfg||!cfg.enabled) return 0;
  var due = getDueDateObj(p);
  var daysLate = Math.floor((TODAY - due) / 86400000);
  if(daysLate <= cfg.graceDays) return 0;
  return cfg.feeType==='fixed' ? cfg.feeAmount : Math.round(p.amount * cfg.feeAmount / 100);
}

function togglePaymentMethod(payId) {
  var idStr = String(payId);
  var found = false;
  state.payments = state.payments.map(function(p) {
    if(String(p.id)===idStr) {
      found = true;
      var nm = p.method==='cash'?'bank':'cash';
      var t = state.tenants.find(function(x){return x.name===p.tenant;});
      if(t) t.method = nm;
      return Object.assign({},p,{method:nm});
    }
    return p;
  });
  if(!found) {
    var s = state.rentSchedule.find(function(x){return String(x.id)===idStr;});
    if(s) {
      s.method = s.method==='cash'?'bank':'cash';
      var t = state.tenants.find(function(x){return x.id===s.tenantId;});
      if(t) t.method = s.method;
    }
  }
  render();
}

function bulkChaseOverdue(mode) {
  mode = mode || 'overdue';
  var pool = (window._renderedOverdue||[]);
  var source;
  if(mode==='all')    source = pool.filter(function(p){return !p._isArrears;});
  else if(mode==='today') source = pool.filter(function(p){var s=getDueStatus(p);return s==='today'||s==='overdue';});
  else                source = pool.filter(function(p){return getDueStatus(p)==='overdue';});

  if(!source.length){showToast('No payments to chase in this view','success');return;}

  var byT={};
  source.forEach(function(p){
    var tn=p.tenant||p.tenantName||'';
    if(!byT[tn]) byT[tn]={total:0,pays:[],t:state.tenants.find(function(x){return x.name===tn;})};
    byT[tn].total+=p.amount; byT[tn].pays.push(p);
  });
  var items=Object.keys(byT).map(function(n){return byT[n];}).filter(function(x){return x.t&&x.t.whatsapp;});
  var noWA =Object.keys(byT).map(function(n){return byT[n];}).filter(function(x){return !x.t||!x.t.whatsapp;});

  function buildMsg(item){

    +'<button onclick="closeModal();bulkChaseOverdue(\'today\')" style="flex:1;padding:10px;border:none;border-bottom:3px solid '+(mode==='today'?'var(--amber)':'transparent')+';background:transparent;font-size:12px;font-weight:700;color:'+(mode==='today'?'var(--amber)':'var(--muted)')+';cursor:pointer;font-family:inherit">&#x1F4C5; Due today+overdue</button>'
    +'<button onclick="closeModal();bulkChaseOverdue(\'all\')" style="flex:1;padding:10px;border:none;border-bottom:3px solid '+(mode==='all'?'var(--blue)':'transparent')+';background:transparent;font-size:12px;font-weight:700;color:'+(mode==='all'?'var(--blue)':'var(--muted)')+';cursor:pointer;font-family:inherit">&#x1F4B7; All outstanding</button>'
    +'</div>';

        +'<a href="'+waHref+'" target="_blank" style="padding:7px 14px;border-radius:8px;background:#25D366;color:#fff;font-size:12px;font-weight:700;text-decoration:none">&#x1F4AC; Send</a>'

function shareCashCollections(cashList) {
  if(!cashList.length){ alert('No cash collections to share.'); return; }
  var NL = '\n';
  var today = new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  var total = cashList.reduce(function(s,p){ return s + p.amount; }, 0);

  var msg = '\uD83D\uDCB5 *CASH COLLECTION LIST*' + NL;
  msg += '\uD83D\uDCC5 ' + today + NL;
  msg += '\u2501'.repeat(18) + NL + NL;

  cashList.forEach(function(p, i) {
    var t = state.tenants.find(function(x){ return x.name === p.tenant; });
    var prop = state.properties.find(function(x){ return x.name === p.property; });
    var address = prop ? (prop.address || p.property) : p.property;
    var phone = t && t.whatsapp ? '+' + t.whatsapp : '\u2014';
    var dueStatus = getDueStatus(p);
    var statusIcon = dueStatus === 'overdue' ? '\u26A0\uFE0F OVERDUE' : dueStatus === 'today' ? '\uD83D\uDD34 TODAY' : '\uD83D\uDCC5 DUE';

    msg += (i + 1) + '. \uD83D\uDC64 *' + p.tenant + '*' + NL;
    msg += '   \uD83C\uDFE0 ' + address + ', Rm ' + (t ? t.room : '?') + NL;
    msg += '   \uD83D\uDCB0 *\u00A3' + p.amount + '* ' + statusIcon + NL;
    msg += '   \uD83D\uDCDE ' + phone + NL;
    if(i < cashList.length - 1) msg += NL;
  });

  msg += NL + '\u2501'.repeat(18) + NL;
  msg += '\uD83D\uDCB0 *TOTAL: \u00A3' + total + '* (' + cashList.length + ' collection' + (cashList.length === 1 ? '' : 's') + ')' + NL;
  msg += '\u2705 Mark each as collected once received.';

  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

function renderRent() {
  var period=state.filters.rentPeriod||'week';
  var rentTab=state.filters.rentTab||'today';
  var periodInfo=getPeriodDates(period);
  var from=periodInfo.from,to=periodInfo.to;
  var pool=getFullPaymentPool();
  var existing=period==='ytd'?pool:pool.filter(function(p){var d=getDueDateObj(p);return d>=from&&d<=to;});
  var seenDates=new Set(existing.map(function(p){return (p.tenant||p.tenantName||'')+'_'+getDueDateObj(p).toDateString();}));
  // Build per-tenant payment date list using BOTH due date and paid date for robust dedup
  // This handles legacy payments that have due_date=null but have a valid paid_date
  var _tenantPayTimes = {};
  state.payments.forEach(function(p) {
    var tn = p.tenant||p.tenantName||''; if(!tn) return;
    if(!_tenantPayTimes[tn]) _tenantPayTimes[tn] = [];
    if(p._dueDateRaw && !isNaN(p._dueDateRaw)) _tenantPayTimes[tn].push(p._dueDateRaw);
    else if(p._paidDateRaw && !isNaN(p._paidDateRaw)) _tenantPayTimes[tn].push(p._paidDateRaw);
  });
  var schedInPeriod=period==='ytd'?state.rentSchedule:state.rentSchedule.filter(function(s){var d=new Date(s.dueDateRaw);return d>=from&&d<=to;});
  var schedOnly=schedInPeriod.filter(function(s){
    if(s.status==='paid') return false;
    // Exact date match
    if(seenDates.has((s.tenantName||'')+'_'+new Date(s.dueDateRaw).toDateString())) return false;
    // Fuzzy match: any payment for this tenant within ±6 days of schedule due date
    var times = _tenantPayTimes[s.tenantName||''];
    if(times) {
      for(var _i=0;_i<times.length;_i++) {
        if(Math.abs(times[_i] - s.dueDateRaw) <= 6*86400000) return false;
      }
    }
    return true;
  });
  var synth=schedOnly.map(function(s){return {id:s.id,tenant:s.tenantName,property:s.property,amount:s.amount,method:s.method,status:'outstanding',_dueDateRaw:s.dueDateRaw,_fromSched:true};});
  var allPayments=existing.concat(synth);
  // For collected tab: filter ALL payments by paidDate in period (not dueDate)
  // This shows payments RECEIVED in the period, regardless of when they were due
  var paidInPeriod = state.payments.filter(function(p){
    if(p.status!=='paid' && p.status!=='Paid') return false;
    if(period==='ytd') return true;
    // Parse paidDate (stored as "21 Mar 2026" or ISO)
    var pd = p.paidDate || p.date;
    if(!pd) return false;
    var _months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    var _parts = String(pd).split(' ');
    var paidD;
    if(_parts.length===3 && _months[_parts[1]]!==undefined){
      paidD = new Date(+_parts[2], _months[_parts[1]], +_parts[0]);
    } else {
      var iso = String(pd).split('T')[0];
      paidD = iso ? new Date(iso) : null;
    }
    if(!paidD || isNaN(paidD)) return false;
    paidD.setHours(0,0,0,0);
    var fromD = new Date(from); fromD.setHours(0,0,0,0);
    var toD = new Date(to); toD.setHours(23,59,59,999);
    return paidD >= fromD && paidD <= toD;
  });
  var paid = paidInPeriod.length > 0 ? paidInPeriod : allPayments.filter(function(p){return p.status==='paid';});
  // Use paidInPeriod for the collected tab, allPayments paid for stats
  var paidForTab = paidInPeriod;
  var owed=allPayments.filter(function(p){return p.status!=='paid';});
  var overdue=owed.filter(function(p){return getDueStatus(p)==='overdue';});
  // Also add tenants with standing arrears (from partials) into overdue tab
  var arrearsEntries = state.tenants
    .filter(function(t){return t.status!=='inactive' && (t.arrears||0)>0;})

      };
    });
  overdue = overdue.concat(arrearsEntries);
  var dueToday=owed.filter(function(p){return getDueStatus(p)==='today';});
  var tomorrow=owed.filter(function(p){return getDueStatus(p)==='tomorrow';});

  var totalExpect = totalCollected + totalOutstanding;
  var rate = totalExpect ? Math.round(totalCollected/totalExpect*100) : 0;
  window._renderedOverdue = overdue;
  // Chase button: only tenants with overdue items in CURRENT PERIOD view

  overdueWithWA=overdue.filter(function(p){
    if(p._isArrears) {

  h+='<div style="text-align:center;border-left:1px solid var(--border);border-right:1px solid var(--border)"><div style="font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;margin-bottom:3px">Outstanding</div><div style="font-size:15px;font-weight:800;color:'+(owed.length>0?'var(--red)':'var(--muted)')+';font-family:monospace">£'+totalOwed+'</div><div style="font-size:10px;color:var(--muted)">'+owed.length+' tenants</div></div>';

function renderExpenses() {
  const tab      = state.filters.expenses||'overview';
  const selMonth = state.filters.expMonth||'all';

  // Filter expenses by month
  function expInMonth(e) {
    if(selMonth==='all') return true;
    var mo = MONTHS.find(function(m){return m.key===selMonth;});
    if(!mo) return true;
    if(e.recurring && e.startDate) {
      // Recurring monthly: show in selected month if started on/before that month
      var startD = new Date(e.startDate);
      return startD <= mo.to;
    }
    if(e.startDate) {
      var d = new Date(e.startDate);
      return d >= mo.from && d <= mo.to;
    }
    return true;
  }

  const expCo = state.filters.expCompany||'';
  const filtered = state.expenses.filter(function(e){
    if(!expInMonth(e)) return false;
    if(!expCo) return true;

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function getNextPayDate(fromDate,freq,payDay,payDayOfMonth){
  var d=new Date(fromDate);
  if(freq==='weekly'){var target=DAYS.indexOf(payDay);var cur=d.getDay();var diff=(target-cur+7)%7;d.setDate(d.getDate()+(diff===0?7:diff));}
  else{var dom=+payDayOfMonth||1;d.setDate(dom);if(d<=fromDate)d.setMonth(d.getMonth()+1);}
  return d;
}
function dateToStr(d){return d.toISOString().split('T')[0];}
function generateSchedule(tenant){
  if(!tenant.startDate||tenant.status==='inactive') return [];
  var entries=[];
  var freq=tenant.freq||'weekly';
  var payDay=tenant.payDay||'Friday';
  var payDom=tenant.payDayOfMonth||1;
  var startD=new Date(tenant.startDate);

  // Generate from (today - WEEKS_AHEAD weeks) so overdue entries appear in the rent page
  var pastWindow = new Date(TODAY.getTime() - WEEKS_AHEAD * 7 * 86400000);
  var genFrom = startD > pastWindow ? startD : pastWindow;
  // Search from one day before the window start
  var searchFrom = new Date(genFrom.getTime() - 86400000);
  var nextDue = getNextPayDate(searchFrom, freq, payDay, payDom);
  // Safety: never show dates before tenancy started
  while(nextDue < startD) {
    nextDue = getNextPayDate(nextDue, freq, payDay, payDom);
  }

  var count = freq==='weekly' ? WEEKS_AHEAD*2 : 6; // past + future window
  for(var i=0; i<count; i++){
    var isOverdue = nextDue < TODAY;
    var isToday   = nextDue.toDateString() === TODAY.toDateString();
    var nextDueMidnight = new Date(nextDue.getFullYear(), nextDue.getMonth(), nextDue.getDate());
    entries.push({
      id: String(tenant.id)+'_sch_'+nextDueMidnight.getTime(),
      tenantId: tenant.id, tenantName: tenant.name,
      property: tenant.property, room: tenant.room,
      amount: tenant.rent, dueDate: dateToStr(nextDue),
      dueDateRaw: nextDueMidnight.getTime(), method: tenant.method,
      status: isOverdue?'overdue':isToday?'due_today':'upcoming',
      freq: freq, payDay: payDay, type: 'schedule'
    });
    nextDue = getNextPayDate(nextDue, freq, payDay, payDom);
  }
  return entries;
}
function rebuildAllSchedules(){
  // Wipe and regenerate fresh — paid status comes from state.payments, not stale localStorage
  var newSchedule = [];
  state.tenants.filter(function(t){return t.status==='active'||t.status==='notice_given';}).forEach(function(t){
    newSchedule = newSchedule.concat(generateSchedule(t));
  });
  // Cross-reference with actual payments to mark schedule entries as paid
  // Use a set of {tenantName}_{dueDateRaw} keys from paid payments
  var paidKeys = new Set();
  state.payments.forEach(function(p){
    if(p.status!=='paid') return;
    var tn = p.tenantName||p.tenant||'';
    // Match by due date raw
    if(p._dueDateRaw) paidKeys.add(tn+'_'+p._dueDateRaw);
    // Also match by paid date ±3 days (handles payments logged on slightly different dates)
    if(p._paidDateRaw) {
      for(var d=-3; d<=3; d++) paidKeys.add(tn+'_'+(p._paidDateRaw + d*86400000));
    }
  });
  newSchedule.forEach(function(s){
    var key = (s.tenantName||'')+'_'+s.dueDateRaw;
    if(paidKeys.has(key)) s.status = 'paid';
  });
  state.rentSchedule = newSchedule;
}

// Rebuild schedule for a single tenant only (faster after individual edits)
function rebuildTenantSchedule(tenantId){
  // Remove all existing entries for this tenant
  state.rentSchedule = (state.rentSchedule||[]).filter(function(s){
    return s.tenantId !== tenantId;
  });
  var t = state.tenants.find(function(x){return x.id===tenantId;});
  if(t && t.status==='active'){
    state.rentSchedule = state.rentSchedule.concat(generateSchedule(t));
  }
}

function confirmPartialPaid() {
  var inp = document.getElementById('partial-amount-inp');
  var idEl = document.getElementById('partial-id');
  var fullEl = document.getElementById('partial-full');
  if(!inp||!idEl||!fullEl) return;
  var id = idEl.value;
  var fullAmount = parseFloat(fullEl.value);
  var partial = parseFloat(inp.value);
  if(isNaN(partial) || partial <= 0) { inp.focus(); return; }
  if(partial >= fullAmount) { closeModal(); markPaid(String(id), 'bank'); return; }
  var shortfall = Math.round((fullAmount - partial) * 100) / 100;
  var idStr = String(id);
  var found = false;
  if(idStr.indexOf('_sch_') >= 0) {
    var s = state.rentSchedule.find(function(x){return String(x.id)===idStr;});
    if(s) {
      var t = state.tenants.find(function(x){return x.name===s.tenantName;});
      var _dueDateISO = new Date(s.dueDateRaw).toISOString().split('T')[0];
      var _paidStr = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
      state.payments.push({
        id: crypto.randomUUID(), tenant: s.tenantName, tenantName: s.tenantName,
        tenantId: s.tenantId, property: s.property, propertyName: s.property,
        amount: partial, method: 'bank', status: 'paid',
        date: _paidStr, paidDate: _paidStr, dueDate: _dueDateISO,
        _dueDateRaw: s.dueDateRaw, isPartial: true, shortfall: shortfall,
        _partial: true, _shortfall: shortfall
      });
      if(t) { t.arrears = Math.round(((t.arrears||0) + shortfall) * 100) / 100; }
      // Keep schedule entry as outstanding but reduce amount shown
      s.amount = shortfall;
      s._partialPaid = partial;
      found = true;
    }
  } else {
    var pay = state.payments.find(function(p){return String(p.id)===idStr;});
    if(pay) {
      var t2 = state.tenants.find(function(x){return x.name===pay.tenant;});
      // Keep in outstanding — reduce amount to shortfall
      pay.amount = shortfall;
      pay._partial = true; pay._shortfall = shortfall; pay._partialPaid = partial;
      if(t2) { t2.arrears = Math.round(((t2.arrears||0) + shortfall) * 100) / 100; }
      found = true;
    }
  }
  closeModal();
  if(found) render();
}

function markPaid(id,method){
  var idStr=String(id);
  // Handle arrears clearance entry
  if(idStr.startsWith('arrears_')) {
    var _tidStr = idStr.replace('arrears_', '');
    // Support both numeric ids and UUID string ids
    var ta = state.tenants.find(function(x){return String(x.id)===_tidStr;});
    if(ta) {
      var _aDate = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
      var _aNow = new Date(); var _aISO = _aNow.toISOString().split('T')[0];
      var _aRaw = new Date(_aNow.getFullYear(),_aNow.getMonth(),_aNow.getDate()).getTime();
      state.payments.push({
        id: crypto.randomUUID(), tenant: ta.name, tenantName: ta.name,
        tenantId: ta.id, property: ta.property, propertyName: ta.property,
        amount: ta.arrears, method: method||'bank', status: 'paid',
        date: _aDate, paidDate: _aDate, dueDate: _aISO, _dueDateRaw: _aRaw,
        _arrearsClearance: true
      });
      ta.arrears = 0;
    }
    render(); return;
  }
  if(idStr.indexOf('_sch_')>=0){markSchedulePaid(id,method);render();return;}
  var found=false;
  state.payments=state.payments.map(function(p){if(String(p.id)===idStr){found=true;return Object.assign({},p,{status:'paid',paidMethod:method});}return p;});
  if(!found){var s=state.rentSchedule.find(function(x){return String(x.id)===idStr;});if(s)markSchedulePaid(id,method);}
  saveState();
  render();
}

function recalcProperty(p) {
  if(!p) return;
  p.occupied = (p.roomList||[]).filter(function(r){return r.status==='occupied';}).length;
  // Income is always calculated from actual tenant rents — never manually entered
  var tenants = state.tenants.filter(function(t){return t.property===p.name&&t.status!=='inactive';});
  p.rent = Math.round(tenants.reduce(function(s,t){
    return s + (t.freq==='monthly' ? t.rent : (t.rent||0)*52/12);
  }, 0));
}
function freeRoom(propName, roomN) {
  var p = state.properties.find(function(x){return x.name===propName;});
  if(!p||!p.roomList) return;
  var r = p.roomList.find(function(rm){return rm.n===roomN;});
  if(r) r.status = 'vacant';
  recalcProperty(p);
  if(!state.voidDates) state.voidDates={};
  var key = p.id+'_'+roomN;
  if(!state.voidDates[key]) state.voidDates[key] = new Date().toISOString().split('T')[0];
}
function occupyRoom(propName, roomN, rentAmount) {
  var p = state.properties.find(function(x){return x.name===propName;});
  if(!p||!p.roomList) return;
  var r = p.roomList.find(function(rm){return rm.n===roomN;});
  if(r) {
    r.status = 'occupied';
    if(rentAmount && +rentAmount > 0) r.price = +rentAmount;
  }
  recalcProperty(p);
  if(state.voidDates) delete state.voidDates[p.id+'_'+roomN];
}

function renderTenantDueDaySection(freq, payDay, payDayOfMonth) {
  if(freq === 'monthly') {
    var opts = Array.from({length:28}, function(_,i) {
      var s = i+1;
      var sfx = [1,21].includes(s)?'st':[2,22].includes(s)?'nd':[3,23].includes(s)?'rd':'th';
      return '<option value="'+s+'" '+(payDayOfMonth===s?'selected':'')+'>'+s+sfx+' of month</option>';
    }).join('');
    return '<div class="field" style="margin:0"><label class="field-label">Due Date (monthly)</label>'
      +'<select class="inp" id="td-paydom">'+opts+'</select></div>';
  } else {
    var days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
    var opts = days.map(function(d){
      return '<option '+(payDay===d?'selected':'')+'>'+d+'</option>';
    }).join('');
    return '<div class="field" style="margin:0"><label class="field-label">Due Day (weekly)</label>'
      +'<select class="inp" id="td-payday">'+opts+'</select></div>';
  }
}

      opt.textContent = 'Room '+r.n+' ('+(r.type||'Room')+') '+(ten?'— '+ten.name:'[Vacant]');
      roomSel.appendChild(opt);
    });
  }
  refreshMaintTenantInfo();
}

function refreshMaintTenantInfo() {
  var propName = (document.getElementById('f-mprop')||{}).value;
  var roomSel  = document.getElementById('f-mroom');
  var roomVal  = roomSel ? roomSel.value : '';
  var infoBox  = document.getElementById('f-maint-tenant-info');
  var infoEl   = document.getElementById('f-maint-tenant-detail');
  if(!infoBox || !infoEl) return;
  if(!roomVal || roomVal==='communal' || isNaN(+roomVal)) {
    infoBox.style.display = 'none';
    return;
  }
  var t = state.tenants.find(function(x){return x.property===propName&&x.room===+roomVal&&x.status!=='inactive';});
  if(!t) { infoBox.style.display='none'; return; }
  var phone = t.whatsapp ? '+'+t.whatsapp : '—';
  infoEl.innerHTML =
    '<div style="display:flex;gap:16px;flex-wrap:wrap">'
    +'<div><span style="font-weight:600">👤</span> '+t.name+'</div>'
    +'<div><span style="font-weight:600">📞</span> <a href="tel:+'+t.whatsapp+'" style="color:var(--blue)">'+phone+'</a></div>'
    +(t.whatsapp?'<div><a href="https://wa.me/'+t.whatsapp+'" target="_blank" style="color:#25D366;font-weight:700">💬 WhatsApp</a></div>':'')
    +'</div>';
  infoBox.style.display = 'block';
}

          <button onclick="document.getElementById('f-mphoto-preview').style.display='none';document.getElementById('f-mphoto-input').value=''" style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);border:none;color:#fff;border-radius:50%;width:24px;height:24px;font-size:12px;cursor:pointer">✕</button>
        </div>
      </div>
      <div class="field"><label class="field-label">Notes</label>
        <input class="inp" id="f-mnotes" placeholder="Any additional context, access details, best times to attend…">
      </div>`,
  };
  const titles = {addProp:'Add Property',addTenant:'Add Tenant',addExpense:'Add Expense',addMaint:'Log Maintenance Request'};
  const saveLabels = {addProp:'Add Property',addTenant:'Add Tenant',addExpense:'Add Expense',addMaint:'Log Request'};
  const saveType = {addProp:'prop',addTenant:'tenant',addExpense:'expense',addMaint:'maint'};

  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-header">
          <span class="modal-title">${titles[type]}</span>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          ${modals[type]}
          <div class="modal-footer">
            ${btn('Cancel',"closeModal()",'secondary')}
            ${btn(saveLabels[type],`saveModal('${saveType[type]}')`,'primary')}
          </div>
        </div>
      </div>
    </div>`;
}
