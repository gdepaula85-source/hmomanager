// ── LANDLORD PAYMENT SCHEDULE ──────────────────────────────────────────────
// Generates one entry per PROPERTY per month — so each can be paid independently
function ensureLandlordSchedule() {
  if(!state.landlordPayments) state.landlordPayments = [];
  // Purge any old bundle-style entries (created before per-property migration)
  // These are identified by having no propId field
  state.landlordPayments = state.landlordPayments.filter(function(p){
    return p.propId !== undefined && p.propId !== null;
  });
  var now = new Date();
  // Generate for last 3 months, current month, next 2 months
  var months = [];
  for(var offset=-3; offset<=2; offset++) {
    var d = new Date(now.getFullYear(), now.getMonth()+offset, 1);
    var y = d.getFullYear(), m = d.getMonth();
    var key = y+'-'+(m+1<10?'0':'')+(m+1);
    var label = d.toLocaleDateString('en-GB',{month:'short',year:'numeric'});
    months.push({key:key, label:label, ts: d.getTime()});
  }

  state.landlords.forEach(function(ll) {
    var llProps = state.properties.filter(function(p){return p.landlordName===ll.name && p.landlord>0;});
    if(!llProps.length) return;

    llProps.forEach(function(prop) {
      months.forEach(function(mo) {
        // One entry per property per month — keyed by landlordId + propId + monthKey
        var exists = state.landlordPayments.find(function(p){
          return p.landlordId===ll.id && p.propId===prop.id && p.monthKey===mo.key;
        });
        if(!exists) {
          state.landlordPayments.push({
            id: crypto.randomUUID(),
            landlordId: ll.id,
            landlordName: ll.name,
            propId: prop.id,
            monthKey: mo.key,
            monthLabel: mo.label,
            propName: prop.name,
            property: prop.name,
            amount: prop.landlord,
            dueDate: '01 '+mo.label,
            dueDateTs: mo.ts,
            paidDate: null,
            method: 'bank',
            status: 'pending',
            ref: 'LP-'+mo.key+'-'+prop.id
          });
        }
      });
    });
  });
}


function renderLandlords() {
  ensureLandlordSchedule();
  var lls   = state.landlords || [];
  var lpays = state.landlordPayments || [];
  var selLL = state.filters.landlords || 'all';

  // ── Month filter ─────────────────────────────────────────────────────────────
  var selMonth = state.filters.landlordMonth || '';
  var filteredPays = lpays;
  if(selMonth) {
    var mo = MONTHS.find(function(m){return m.key===selMonth;});
    if(mo) {
      filteredPays = lpays.filter(function(p){
        if(!p.dueDate) return false;
        var d = new Date(p.dueDate.replace(/ /g,'-'));
        return d >= mo.from && d <= mo.to;
      });
    }
  }

  // ── Summary KPIs ────────────────────────────────────────────────────────────
  var totalOwed    = filteredPays.filter(function(p){return p.status==='pending';}).reduce(function(s,p){return s+p.amount;},0);
  var totalPaidAll = filteredPays.filter(function(p){return p.status==='paid';}).reduce(function(s,p){return s+p.amount;},0);
  var pendingCount = filteredPays.filter(function(p){return p.status==='pending';}).length;
  var totalMonthly = lls.reduce(function(s,ll){
    return s+(state.properties||[]).filter(function(p){return p.landlordName===ll.name;}).reduce(function(ss,p){return ss+p.landlord;},0);
  },0);

  var html = '<div class="page-header">'    +'<div><div class="page-title">Landlords</div>'    +'<div class="page-sub">'+lls.length+' landlords \u00B7 '+pendingCount+' payments pending'+(selMonth?' \u00B7 '+MONTHS.find(function(m){return m.key===selMonth;}).label:'')+'</div></div>'    +'<select onchange="state.filters.landlordMonth=this.value;render()" style="padding:9px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);font-family:inherit;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;min-width:130px">'    +'<option value="">All Time</option>'    +MONTHS.map(function(m){return '<option value="'+m.key+'" '+(selMonth===m.key?'selected':'')+'>'+m.label+'</option>';}).join('')    +'</select>'    +'</div>';

  // KPI strip
  html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px">';
  html += '<div style="background:var(--red-light);border:1px solid #FECDD3;border-radius:11px;padding:12px;text-align:center"><div style="font-size:14px;font-weight:800;color:var(--red);font-family:monospace">'+fmt(totalMonthly)+'</div><div style="font-size:10px;color:var(--red);font-weight:700;margin-top:2px">MONTHLY RENT</div></div>';
  html += '<div style="background:var(--amber-light);border:1px solid #FDE68A;border-radius:11px;padding:12px;text-align:center"><div style="font-size:14px;font-weight:800;color:var(--amber);font-family:monospace">'+fmt(totalOwed)+'</div><div style="font-size:10px;color:var(--amber);font-weight:700;margin-top:2px">PENDING ('+pendingCount+')</div></div>';
  html += '<div style="background:var(--green-light);border:1px solid #A7F3D0;border-radius:11px;padding:12px;text-align:center"><div style="font-size:14px;font-weight:800;color:var(--green);font-family:monospace">'+fmt(totalPaidAll)+'</div><div style="font-size:10px;color:var(--green);font-weight:700;margin-top:2px">PAID (ALL TIME)</div></div>';
  html += '</div>';

  // Landlord cards
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:28px">';
  // Sort landlords: those with pending payments first, then by pending amount desc
  var sortedLls = lls.slice().sort(function(a, b) {
    var aPend = filteredPays.filter(function(p){return p.landlordId===a.id&&p.status==='pending';});
    var bPend = filteredPays.filter(function(p){return p.landlordId===b.id&&p.status==='pending';});
    // Pending first
    if(aPend.length && !bPend.length) return -1;
    if(!aPend.length && bPend.length) return 1;
    // Both pending: sort by earliest due date (most overdue first)
    if(aPend.length && bPend.length) {
      var aEarliest = Math.min.apply(null, aPend.map(function(p){return new Date(p.dueDate).getTime();}));
      var bEarliest = Math.min.apply(null, bPend.map(function(p){return new Date(p.dueDate).getTime();}));
      return aEarliest - bEarliest;
    }
    // Both fully paid: sort alphabetically
    return (a.name||'').localeCompare(b.name||'');
  });

  sortedLls.forEach(function(ll) {
    var llProps    = (state.properties||[]).filter(function(p){return p.landlordName===ll.name;});
    var llMonthly  = llProps.reduce(function(s,p){return s+p.landlord;},0);
    var llPending  = filteredPays.filter(function(p){return p.landlordId===ll.id&&p.status==='pending';});
    var llPaid     = filteredPays.filter(function(p){return p.landlordId===ll.id&&p.status==='paid';});
    var initials   = ll.name.split(' ').map(function(w){return w[0];}).join('').slice(0,2);
    var hasPending = llPending.length > 0;

    html += '<div style="background:var(--surface);border:1px solid '+(hasPending?'#FDE68A':'var(--border)')+';border-radius:13px;overflow:hidden">';

    // Card header — click to open detail
    html += '<div style="padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px" onclick="openLandlordDetail('+ll.id+')">';
    html += '<div style="width:42px;height:42px;border-radius:11px;background:var(--accent-light);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--accent-dark)">'+initials+'</div>';
    html += '<div style="flex:1;min-width:0">';
    html += '<div style="font-size:14px;font-weight:700">'+ll.name+'</div>';
    html += '<div style="font-size:11px;color:var(--muted)">'+ll.phone+' · '+llProps.length+' propert'+(llProps.length===1?'y':'ies')+'</div>';
    html += '</div>';
    html += '<div style="text-align:right;flex-shrink:0">';
    html += '<div style="font-size:15px;font-weight:800;color:var(--red);font-family:monospace">'+fmt(llMonthly)+'</div>';
    html += '<div style="font-size:10px;color:var(--muted)">per month</div>';
    html += '</div>';
    html += '</div>';

    // Properties mini-list
    if(llProps.length) {
      html += '<div style="padding:0 16px 10px;display:flex;flex-wrap:wrap;gap:5px">';
      llProps.forEach(function(p){
        html += '<span style="font-size:10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 8px;color:var(--muted)">'+p.name+'</span>';
      });
      html += '</div>';
    }

    // ── Payment schedule: per-property rows, grouped by month ───────────────
    var llAllPays = filteredPays.filter(function(p){return p.landlordId===ll.id;});
    var nowMs = new Date().getTime();

    // Group payments by monthKey, sorted overdue→upcoming→paid
    var monthKeys = [];
    llAllPays.forEach(function(p){ if(monthKeys.indexOf(p.monthKey)<0) monthKeys.push(p.monthKey); });
    monthKeys.sort(function(a,b){
      var aMs = new Date(a+'-01').getTime();
      var bMs = new Date(b+'-01').getTime();
      // Check if any pending in this month
      var aPend = llAllPays.some(function(p){return p.monthKey===a&&p.status!=='paid';});
      var bPend = llAllPays.some(function(p){return p.monthKey===b&&p.status!=='paid';});
      var aOver = aPend && aMs < nowMs;
      var bOver = bPend && bMs < nowMs;
      if(aOver && !bOver) return -1;
      if(!aOver && bOver) return 1;
      if(aPend && !bPend) return -1;
      if(!aPend && bPend) return 1;
      return aMs - bMs;
    });

    if(monthKeys.length) {
      html += '<div style="border-top:1px solid var(--border)">';
      monthKeys.forEach(function(mk) {
        var mPays = llAllPays.filter(function(p){return p.monthKey===mk;});
        var mMs   = new Date(mk+'-01').getTime();
        var mLabel = mPays[0].monthLabel;
        var allPaid = mPays.every(function(p){return p.status==='paid';});
        var anyOverdue = mPays.some(function(p){return p.status!=='paid' && mMs < nowMs;});
        var mTotal = mPays.reduce(function(s,p){return s+p.amount;},0);
        var paidTotal = mPays.filter(function(p){return p.status==='paid';}).reduce(function(s,p){return s+p.amount;},0);

        // Month header row
        var headBg = allPaid ? 'var(--green-light)' : anyOverdue ? '#FFF1F2' : 'var(--bg)';

async function handlePhotoUpload(pid,rn,input){
  // Guard: reject truly empty or undefined pids
  if(!pid || pid === 'undefined' || pid === 'prop' || pid.length < 3) {
    showToast('Please refresh the page and try again', 'error');
    return;
  }
  var files=Array.from(input.files);var media=getMedia(pid,rn);
  var maxPhotos = 4;
  var toUpload = Array.from(files).slice(0, maxPhotos - media.photos.length);
  for(var i=0; i<toUpload.length; i++){
    var file = toUpload[i];
    if(file.size > 5*1024*1024){ showToast('Photo too large (max 5MB)', 'error'); continue; }
    showToast('Uploading...', 'success');
    // Always store locally first for immediate display
    var localReader = new FileReader();
    var fileRef = file;
    localReader.onload = (function(lf, lpid, lrn) { return function(e) {
      var localMedia = getMedia(lpid, lrn);
      var localEntry = {src:e.target.result, name:lf.name, _localOnly:true};
      localMedia.photos.push(localEntry);
      saveState();
      // Update just the photo display for this room without full re-render
      var photoEl = document.getElementById('rm-'+_eid+'-photos');
      if(photoEl) {
        // Refresh just this room card
        render();
      } else {
        render();
      }
      showToast('Photo saved ✓', 'success');
      // Scroll to show the photo
      setTimeout(function(){
        var inp = document.getElementById('rm-'+_eid+'-photo');
        if(inp) inp.closest && inp.closest('[data-room]') && inp.closest('[data-room]').scrollIntoView({behavior:'smooth',block:'nearest'});
      }, 200);
      // Then try to upload to Supabase Storage in background
      (async function() {
        try {
          var ext = lf.name.split('.').pop();
          var path = 'rooms/'+lpid+'/'+lrn+'/'+Date.now()+'.'+ext;
          var upload = await supa.storage.from('room-media').upload(path, lf, {upsert:true});
          if(upload.error) throw upload.error;
          var urlData = supa.storage.from('room-media').getPublicUrl(path);
          var url = urlData.data.publicUrl;
          if(url) {
            // Replace local copy with Supabase URL
            var idx = localMedia.photos.indexOf(localEntry);
            if(idx >= 0) localMedia.photos[idx] = {src:url, name:lf.name, path:path};
            saveState();
            console.log('Photo synced to Supabase:', url);
          }
        } catch(err) {
          console.warn('Supabase upload failed:', err.message);
          showToast('Photo saved locally only – storage upload failed. Check Supabase bucket permissions.', 'error');
          // Remove the local-only entry so it doesn't silently disappear on reload
          var idx2 = localMedia.photos.indexOf(localEntry);
          if(idx2 >= 0) localMedia.photos.splice(idx2, 1);
          saveState();
          render();
        }
      })();
    };})(fileRef, pid, rn);
    localReader.readAsDataURL(file);
  }
}

// ── FILE HANDLERS ─────────────────────────────────────────────────────────────
function cleanPhone(raw) {
  var p = String(raw || '').replace(/[\s\-\(\)]/g, '');
  if(p.startsWith('+44')) p = '44' + p.slice(3);
  else if(p.startsWith('0044')) p = '44' + p.slice(4);
  else if(p.startsWith('07')) p = '44' + p.slice(1);
  else if(p.startsWith('7') && p.length === 10) p = '44' + p;
  return p.replace(/\D/g,'');
}

function cleanPostcode(raw) {
  return String(raw || '').trim().toUpperCase().replace(/\s+/,' ');
}

function cleanPropertyName(raw) {
  return String(raw || '').trim().replace(/\s+/g,' ');
}

function hasPropCode(name) {
  // Flag names that end in a number, single letter+number, or known code patterns
  return /[A-Z]?\d+[A-Z]?$/.test(name.trim().split(' ').pop()) ||
         /\b(Q\d+|Rm\d+|casa\s*\d+|flat\s*\d+)\b/i.test(name);
}

function handlePropertiesFile(input) {
  var file = input.files[0];
  if(!file) return;
  var reader = new FileReader();

  reader.onload = function(e) {
    try {
      var rows = [];
      var warnings = [];

      if(file.name.endsWith('.csv')) {
        // Parse CSV
        var text = e.target.result;
        var lines = text.split('\n').filter(function(l){return l.trim();});
        var headers = parseCSVLine(lines[0]);
        for(var i=1;i<lines.length;i++){
          var vals = parseCSVLine(lines[i]);
          var obj = {};
          headers.forEach(function(h,j){ obj[h.trim()] = (vals[j]||'').trim(); });
          rows.push(obj);
        }
      } else {
        // Parse XLSX with SheetJS
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type:'array'});
        var ws = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      }

      // Map and clean
      var mapped = [];
      rows.forEach(function(r) {
        var name = cleanPropertyName(r['Property Name'] || r['Name'] || r['property'] || '');
        if(!name) return;
        var landlordRent = parseFloat(String(r['Landlord Rent (£)']||r['Landlord Rent']||r['landlord']||0).replace(/[£,]/g,'')) || 0;
        var totalRooms   = parseInt(r['Total Rooms']||r['rooms']||0) || 0;
        var occupied     = parseInt(r['Occupied Rooms']||r['occupied']||0) || 0;
        var income       = parseFloat(String(r['Monthly Income (£)']||r['Monthly Income']||r['rent']||0).replace(/[£,]/g,'')) || 0;
        var postcode     = cleanPostcode(r['Postcode']||r['postcode']||'');
        var address      = String(r['Address']||r['address']||'').trim();
        var landlordName = String(r['Landlord Name']||r['landlord_name']||'').trim();
        var landlordPhone = cleanPhone(r['Landlord Contact']||r['landlord_contact']||r['Landlord Phone']||'');
        var status       = String(r['Status']||'active').toLowerCase();

        if(!totalRooms && !landlordRent) {
          warnings.push(name+': no rooms or rent data');
        }

        mapped.push({
          name: name, address: address, postcode: postcode,
          rooms: totalRooms, occupied: occupied, rent: income,
          landlord: landlordRent, landlordName: landlordName,
          landlordPhone: landlordPhone, status: status,
          area: deriveArea(postcode, address), type: 'HMO'
        });
      });

      _importPreview = {type:'properties', rows:mapped, warnings:warnings};
      render();
    } catch(err) {
      alert('Error reading file: '+err.message);
    }
  };

  if(file.name.endsWith('.csv')) reader.readAsText(file);
  else reader.readAsArrayBuffer(file);
}

function deriveArea(postcode, address) {
  var southLondon = {
    'SW':'Lambeth','SE':'Lewisham','CR':'Croydon','SW16':'Streatham',
    'SW2':'Brixton','SW9':'Brixton','SW4':'Clapham','SW11':'Clapham',
    'SE5':'Camberwell','SE15':'Peckham','SE22':'Dulwich','SE27':'Norwood',
    'SE26':'Sydenham','SE23':'Forest Hill','SE6':'Catford','SE13':'Lewisham'
  };
  var pc = (postcode||'').replace(' ','');
  var prefix4 = pc.slice(0,4);
  var prefix3 = pc.slice(0,3);
  var prefix2 = pc.slice(0,2);
  return southLondon[prefix4] || southLondon[prefix3] || southLondon[prefix2] || 'Other';
}

function handleTenantsFile(input) {
  var file = input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var text = e.target.result;
      var lines = text.split('\n').filter(function(l){return l.trim();});
      var headers = parseCSVLine(lines[0]);
      var warnings = [];
      var mapped = [];

      for(var i=1;i<lines.length;i++){
        var vals = parseCSVLine(lines[i]);
        var obj = {};
        headers.forEach(function(h,j){ obj[h.trim()] = (vals[j]||'').trim(); });

        var name = (obj['Name']||obj['name']||'').trim();
        if(!name) continue;

        var phone  = cleanPhone(obj['Phone']||obj['phone']||obj['WhatsApp']||'');
        var email  = (obj['Email']||obj['email']||'').trim();
        // Ignore auto-generated emails
        if(email.includes('@tenant.com')) email = '';

        var rentRaw = String(obj['Rent Amount']||obj['Rent']||obj['rent']||'0').replace(/[£,]/g,'');
        var rent    = parseFloat(rentRaw) || 0;
        var freq    = (obj['Rent Frequency']||obj['Frequency']||'weekly').toLowerCase().trim();
        var prop    = cleanPropertyName(obj['Property']||obj['property']||'');
        var room    = parseInt(obj['Room']||obj['room']||1) || 1;
        var checkin = parseDate(obj['Check-in Date']||obj['check_in']||'');
        var status  = (obj['Status']||'active').toLowerCase().trim();
        var flagged = hasPropCode(name);

        mapped.push({
          name:name, whatsapp:phone, email:email,
          rent:rent, freq:freq==='monthly'?'monthly':'weekly',
          property:prop, room:room,
          startDate:checkin,
          status:status==='notice_given'?'notice_given':'active',
          _flagged:flagged
        });
      }

      _importPreview = {type:'tenants', rows:mapped, warnings:warnings};
      render();
    } catch(err) {
      alert('Error reading CSV: '+err.message);
    }
  };
  reader.readAsText(file);
}

function parseDate(raw) {
  if(!raw) return '';
  // DD/MM/YYYY → YYYY-MM-DD
  var m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  // Already ISO
  if(/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
  return '';
}

function parseCSVLine(line) {
  var result = [], cur = '', inQuote = false;
  for(var i=0;i<line.length;i++){
    var ch = line[i];
    if(ch==='"'){ inQuote=!inQuote; continue; }
    if(ch===','&&!inQuote){ result.push(cur); cur=''; continue; }
    cur += ch;
  }
  result.push(cur);
  return result;
}

// ── CONFIRM IMPORTS ───────────────────────────────────────────────────────────
function confirmImportProperties() {
  var rows = _importPreview.rows;
  var imported = 0, skipped = 0;

  rows.forEach(function(r) {
    var exists = state.properties.some(function(p){return p.name.trim().toLowerCase()===r.name.trim().toLowerCase();});
    if(exists){ skipped++; return; }

    // Auto-create landlord if not exists
    if(r.landlordName && !state.landlords.find(function(ll){return ll.name.trim().toLowerCase()===r.landlordName.trim().toLowerCase();})) {
      state.landlords.push({
        id: crypto.randomUUID(),
        name: r.landlordName, phone: r.landlordPhone,
        email:'', bank:'', sortCode:'', accountNo:'', notes:'', properties:[]
      });
    }

    // Build roomList
    var roomList = [];
    for(var i=1;i<=r.rooms;i++){
      roomList.push({n:i, type:'Single', price:0, status: i<=r.occupied?'occupied':'vacant'});
    }

    state.properties.push({
      id: crypto.randomUUID(),
      name: r.name, address: r.address,
      postcode: r.postcode, area: r.area, type: r.type,
      rooms: r.rooms, occupied: r.occupied,
      rent: r.rent, landlord: r.landlord,
      landlordName: r.landlordName,
      mapsUrl: r.postcode ? 'https://maps.google.com/?q='+encodeURIComponent(r.address||r.name) : '',
      roomList: roomList, notes: ''
    });
    imported++;
  });

  _importPreview = null;
  _importTab = 'properties';
  alert('✅ Import complete!\n\n'+imported+' properties imported\n'+skipped+' skipped (already exist)\n\nLandlords auto-created: '+state.landlords.length);
  state.page = 'properties';
  render();
}

  var rows = _importPreview.rows;
  var imported = 0, skipped = 0;

  rows.forEach(function(r) {
    var exists = state.tenants.some(function(t){return t.name.trim().toLowerCase()===r.name.trim().toLowerCase()&&t.whatsapp===r.whatsapp;});
    if(exists){ skipped++; return; }

    var id = Date.now()+Math.random();
    state.tenants.push({
      id: id, name: r.name, property: r.property, room: r.room,
      rent: r.rent, freq: r.freq,
      payDay: r.freq==='weekly'?'Monday':null,
      payDayOfMonth: r.freq==='monthly'?1:null,
      method:'bank', status:r.status,
      paid:'—', arrears:0, whatsapp:r.whatsapp,
      email:r.email, deposit:r.rent*2, depositStatus:'held',
      moveIn:r.startDate, startDate:r.startDate,
      noticeDate:null, moveOutDate:null, paymentHistory:[]
    });
    // Mark room as occupied and set room price from tenant rent
    if(r.property && r.room) occupyRoom(r.property, r.room, r.rent);
    imported++;
  });

  rebuildAllSchedules();
  _importPreview = null;
  alert('✅ Import complete!\n\n'+imported+' tenants imported\n'+skipped+' skipped (already exist)');
  state.page = 'tenants';
  render();
}

// ── VOID TRACKER ──────────────────────────────────────────────────────────────
function getVoidDays(pid, rn) {
  if(!state.voidDates) return 0;
  var since = state.voidDates[pid+'_'+rn];
  if(!since) return 0;
  return Math.max(0, Math.floor((TODAY - new Date(since)) / 86400000));
}

function renderVoidTracker() {
  if(!state.voidDates) state.voidDates = {};
  var voids = [];
  state.properties.forEach(function(p) {
    (p.roomList||[]).forEach(function(r) {
      if(r.status !== 'vacant') return;
      var key = p.id+'_'+r.n;
      if(!state.voidDates[key]) {
        var d = new Date();
        d.setDate(d.getDate() - (Math.floor(Math.random()*83)+7));
        state.voidDates[key] = d.toISOString().split('T')[0];
      }
      var days = getVoidDays(p.id, r.n);
      var dailyCost = Math.round(r.price / 7);
      voids.push({p:p, r:r, days:days, cost:Math.round(days*dailyCost),
        since:new Date(state.voidDates[key]).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),
        dailyCost:dailyCost});
    });
  });
  voids.sort(function(a,b){return b.cost - a.cost;});
  var tc = voids.reduce(function(s,v){return s+v.cost;},0);
  var td = voids.reduce(function(s,v){return s+v.dailyCost;},0);
  var lng = voids.length ? voids.reduce(function(a,b){return a.days>b.days?a:b;}) : null;

  var html = '<div style="font-size:14px;font-weight:700;margin-bottom:4px">&#x1F4CA; Void Period Tracker</div>';
  html += '<div style="font-size:12px;color:var(--muted);margin-bottom:12px">'+voids.length+' vacant rooms &middot; daily lost income tracked</div>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">';
  html += '<div style="background:var(--red-light);border:1px solid #FECDD3;border-radius:9px;padding:10px;text-align:center"><div style="font-size:13px;font-weight:800;color:var(--red);font-family:monospace">'+fmt(tc)+'</div><div style="font-size:9px;color:var(--red);font-weight:700;margin-top:2px">TOTAL VOID COST</div></div>';
  html += '<div style="background:var(--amber-light);border:1px solid #FDE68A;border-radius:9px;padding:10px;text-align:center"><div style="font-size:13px;font-weight:800;color:var(--amber);font-family:monospace">'+fmt(td)+'</div><div style="font-size:9px;color:var(--amber);font-weight:700;margin-top:2px">DAILY LOSS</div></div>';
  html += '<div style="background:var(--blue-light);border:1px solid #BFDBFE;border-radius:9px;padding:10px;text-align:center"><div style="font-size:13px;font-weight:800;color:var(--blue);font-family:monospace">'+(lng?lng.days+'d':'0d')+'</div><div style="font-size:9px;color:var(--blue);font-weight:700;margin-top:2px">LONGEST VOID</div></div>';
  html += '</div>';
  if(!voids.length) return html + '<div style="text-align:center;padding:16px;color:var(--dim)">&#x1F389; No vacant rooms!</div>';
  html += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">';
  html += '<tr style="background:var(--bg)"><th style="text-align:left;padding:6px 8px;color:var(--muted)">Room</th><th style="padding:6px 8px;color:var(--muted)">Since</th><th style="padding:6px 8px;color:var(--muted)">Days</th><th style="padding:6px 8px;color:var(--muted)">&pound;/day</th><th style="padding:6px 8px;color:var(--muted)">Total</th></tr>';
  voids.slice(0,12).forEach(function(v,i){
    var col = v.days>60?'var(--red)':v.days>30?'var(--amber)':'var(--muted)';
    html += '<tr style="border-top:1px solid var(--border);background:'+(i%2?'var(--bg)':'var(--surface)')+'"><td style="padding:6px 8px"><div style="font-weight:600">'+v.p.name+'</div><div style="color:var(--muted);font-size:10px">Rm '+v.r.n+' &middot; '+(v.r.type||'Room')+'</div></td><td style="padding:6px 8px;color:var(--muted)">'+v.since+'</td><td style="padding:6px 8px;font-weight:700;color:'+col+'">'+v.days+'d</td><td style="padding:6px 8px;color:var(--muted)">&pound;'+v.dailyCost+'</td><td style="padding:6px 8px;font-weight:800;color:var(--red);font-family:monospace">'+fmt(v.cost)+'</td></tr>';
  });
  html += '<tr style="border-top:2px solid var(--border)"><td colspan="3" style="padding:6px 8px;font-weight:700">TOTAL</td><td style="padding:6px 8px;color:var(--amber);font-weight:700">&pound;'+td+'/d</td><td style="padding:6px 8px;font-weight:800;color:var(--red);font-family:monospace">'+fmt(tc)+'</td></tr>';
  html += '</table></div>';
  return html;
}

    var ctx = canvas.getContext('2d');
    var drawing = false;
    var lastX = 0, lastY = 0;

    function getPos(e) {
      var r = canvas.getBoundingClientRect();
      var scaleX = canvas.width / r.width;
      var scaleY = canvas.height / r.height;
      if(e.touches) {
        return {x:(e.touches[0].clientX-r.left)*scaleX, y:(e.touches[0].clientY-r.top)*scaleY};
      }
      return {x:(e.clientX-r.left)*scaleX, y:(e.clientY-r.top)*scaleY};
    }

    ctx.strokeStyle = '#0F0F1A';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    function start(e){ e.preventDefault(); drawing=true; var p=getPos(e); lastX=p.x; lastY=p.y; }
    function move(e){ e.preventDefault(); if(!drawing) return; var p=getPos(e); ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke(); lastX=p.x; lastY=p.y; }
    function stop(){ drawing=false; }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', stop);
    canvas.addEventListener('mouseleave', stop);
    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove', move, {passive:false});
    canvas.addEventListener('touchend', stop);
  }, 100);

function clearSignature() {

// ── ROOM MEDIA HELPERS ─────────────────────────────────────────────────────────
function saveRoomNotes(pid, rn) {
  var el = document.getElementById('room-notes-'+pid+'-'+rn);
  if(el) getMedia(pid, rn).notes = el.value;
}
async function removeRoomPhoto(pid, rn, idx) {
  var media = getMedia(pid, rn);
  var photo = media.photos[idx];
  if(photo && photo.path) {
    try { await supa.storage.from('room-media').remove([photo.path]); }
    catch(e) { console.warn('Could not delete from storage:', e); }
  }
  media.photos.splice(idx, 1);
  saveState();
  render();
}
function removeRoomVideo(pid, rn) {
  getMedia(pid, rn).video = null;
  saveState();
  render();
}
async function handleVideoUpload(pid, rn, input) {
  var file = input.files[0]; if(!file) return;
  if(file.size > 50*1024*1024) { showToast('Video too large (max 50MB)', 'error'); return; }
  showToast('Uploading video...', 'success');
  try {
    var ext = file.name.split('.').pop();
    var path = 'rooms/'+pid+'/'+rn+'/video_'+Date.now()+'.'+ext;
    var upload = await supa.storage.from('room-media').upload(path, file, {upsert:true});
    if(upload.error) throw upload.error;
    var urlData = supa.storage.from('room-media').getPublicUrl(path);
    var url = urlData.data.publicUrl;
    getMedia(pid,rn).video = {src:url, name:file.name, path:path};
    saveState(); render();
    showToast('Video uploaded ✓', 'success');
  } catch(err) {
    console.error('Video upload failed:', err);
    showToast('Upload failed: '+(err.message||err), 'error');
  }
}


// ── TENANT DOCUMENT VAULT ──────────────────────────────────────────────────────
function uploadTenantDoc(tenantId, input) {
  if(!state.vault) state.vault = {};
  if(!state.vault[tenantId]) state.vault[tenantId] = [];
  var docType = (document.getElementById('vault-doc-type-'+tenantId)||{}).value || 'Other';
  var files = Array.from(input.files);
  var processed = 0;
  files.forEach(function(file) {
    if(file.size > 10*1024*1024) { alert(file.name+' exceeds 10MB limit.'); return; }
    var reader = new FileReader();
    reader.onload = function(e) {
      var sizeStr = file.size > 1024*1024 ? (file.size/1024/1024).toFixed(1)+'MB' : Math.round(file.size/1024)+'KB';
      var now = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
      state.vault[tenantId].push({
        id:'tdoc_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
        name:file.name, type:docType, dataUrl:e.target.result,
        size:sizeStr, uploadedAt:now
      });
      processed++;
      if(processed===files.length){ state.tenantDetailTab='vault'; openTenantDetail(tenantId); }
    };
    reader.readAsDataURL(file);
  });
}

function removeTenantDoc(tenantId, docId) {
  if(!state.vault||!state.vault[tenantId]) return;
  state.vault[tenantId] = state.vault[tenantId].filter(function(d){return d.id!==docId;});
  state.tenantDetailTab = 'vault';
  openTenantDetail(tenantId);
}

  {type:'Other',                     icon:'📄', warn:0,  color:'#F8FAFC', textColor:'#475569'},
];

function getPropDocMeta(type) {
  return PROP_DOC_TYPES.find(function(d){return d.type===type;}) || PROP_DOC_TYPES[PROP_DOC_TYPES.length-1];
}

function getDaysUntilExpiry(expiresAt) {
  if(!expiresAt) return null;
  return Math.ceil((new Date(expiresAt) - new Date()) / 86400000);
}

function uploadPropDoc(propId, input) {
  if(!state.propDocs) state.propDocs = {};
  if(!state.propDocs[propId]) state.propDocs[propId] = [];
  var typeEl  = document.getElementById('pdoc-type-'+propId);
  var expEl   = document.getElementById('pdoc-expires-'+propId);
  var docType = typeEl ? typeEl.value : 'Other';
  var expiresAt = expEl ? expEl.value : '';
  var files = Array.from(input.files);
  files.forEach(function(file){
    if(file.size > 20*1024*1024){ alert(file.name+' exceeds 20MB.'); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      var sizeStr = file.size>1024*1024?(file.size/1024/1024).toFixed(1)+'MB':Math.round(file.size/1024)+'KB';
      var now = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
      state.propDocs[propId].push({
        id:'pdoc_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
        name:file.name, type:docType, dataUrl:e.target.result,
        size:sizeStr, uploadedAt:now, expiresAt:expiresAt||null
      });
      openPropDetail(propId,'docs');
    };
    reader.readAsDataURL(file);
  });
}

function removePropDoc(propId, docId) {
  if(!state.propDocs||!state.propDocs[propId]) return;
  state.propDocs[propId] = state.propDocs[propId].filter(function(d){return d.id!==docId;});
  openPropDetail(propId,'docs');
}

function renderPropDocsTab(p) {
  if(!state.propDocs) state.propDocs = {};
  var docs = state.propDocs[p.id] || [];

  // Sort: expired first, then soonest expiry, then no expiry
  docs = docs.slice().sort(function(a,b){
    var da = a.expiresAt ? getDaysUntilExpiry(a.expiresAt) : 9999;
    var db = b.expiresAt ? getDaysUntilExpiry(b.expiresAt) : 9999;
    return da - db;
  });

  // Expiry summary strip
  var expiring = docs.filter(function(d){
    if(!d.expiresAt) return false;
    var days = getDaysUntilExpiry(d.expiresAt);
    return days !== null && days <= 90;

  var html = '';

    html += '<div style="background:#FFF7ED;border:1px solid #FED7AA;border-radius:10px;padding:12px 14px;margin-bottom:14px">';

    expiring.forEach(function(d){
      var days = getDaysUntilExpiry(d.expiresAt);
      var col  = days < 0 ? '#DC2626' : days <= 30 ? '#EA580C' : '#D97706';
      html += '<div style="font-size:12px;color:var(--text);display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #FED7AA">'

function exportData() {
  var snapshot = {};
  var SAVE_KEYS_LOCAL = ['tenants','properties','payments','rentSchedule','expenses',
    'maintenance','landlords','landlordPayments','roomMedia','lateFeeConfig',
    'users','voidDates','vault','propDocs'];
  SAVE_KEYS_LOCAL.forEach(function(k){ snapshot[k] = state[k]; });
  snapshot._exportedAt = new Date().toISOString();
  snapshot._version    = '1.0';

  var blob = new Blob([JSON.stringify(snapshot, null, 2)], {type:'application/json'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  var date = new Date().toISOString().split('T')[0];
  a.href     = url;
  a.download = 'propmanager-backup-' + date + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(input) {
  var file = input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if(!data.tenants || !data.properties) {
        alert('\u26A0\uFE0F Invalid backup file. Please use a PropManager export file.');
        return;
      }
      var backupDate = data._exportedAt ? new Date(data._exportedAt).toLocaleDateString('en-GB') : 'unknown date';
      if(!confirm('\u26A0\uFE0F This will replace ALL current data with the backup from ' + backupDate + '.\n\nAre you sure?')) return;

      var SAVE_KEYS_LOCAL = ['tenants','properties','payments','rentSchedule','expenses',
        'maintenance','landlords','landlordPayments','roomMedia','lateFeeConfig',
        'users','voidDates','vault','propDocs'];
      SAVE_KEYS_LOCAL.forEach(function(k){
        if(data[k] !== undefined) {
          state[k] = data[k];
          localStorage.setItem('pm_' + k, JSON.stringify(data[k]));
        }
      });
      rebuildAllSchedules();
      render();
      alert('\u2705 Data imported successfully! ' + data.tenants.length + ' tenants and ' + data.properties.length + ' properties loaded.');
    } catch(err) {
      alert('\u26A0\uFE0F Failed to read backup file: ' + err.message);
    }
    input.value = '';
  };
  reader.readAsText(file);
}

function buildPortfolioSnapshot() {
  var active  = state.tenants.filter(function(t){return t.status==='active';});
  var notice  = state.tenants.filter(function(t){return t.status==='notice_given';});
  var arrears = active.filter(function(t){return (t.arrears||0)>0;});
  var arrTotal = arrears.reduce(function(s,t){return s+(t.arrears||0);},0);
  var vacant = [];
  state.properties.forEach(function(p){
    (p.roomList||[]).forEach(function(r){
      if(r.status==='vacant'){
        var days = state.voidDates&&state.voidDates[p.id+'_'+r.n]
          ? Math.floor((new Date()-new Date(state.voidDates[p.id+'_'+r.n]))/86400000) : 0;
        vacant.push({property:p.name,room:r.n,price:r.price||0,days:days});
      }
    });
  });
  var dailyVoidLoss = vacant.reduce(function(s,v){return s+Math.round(v.price/7);},0);
  var now = new Date();
  var llOverdue = (state.landlordPayments||[]).filter(function(p){
    return p.status!=='paid'&&p.dueDateTs&&p.dueDateTs<now.getTime();
  });
  var llOverdueTotal = llOverdue.reduce(function(s,p){return s+p.amount;},0);
  var openMaint   = state.maintenance.filter(function(m){return m.status==='open';});
  var urgentMaint = openMaint.filter(function(m){return m.priority==='urgent';});
  var totalRooms = state.properties.reduce(function(s,p){return s+p.rooms;},0);
  var occRooms   = state.properties.reduce(function(s,p){return s+p.occupied;},0);
  var expectedMo = Math.round(active.reduce(function(s,t){return s+(t.freq==='monthly'?t.rent:t.rent*52/12);},0));
  var landlordMo = state.properties.reduce(function(s,p){return s+p.landlord;},0);
  return {
    date: new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),
    portfolio:{properties:state.properties.length,totalRooms:totalRooms,occupiedRooms:occRooms,
      occupancyPct:Math.round(occRooms/totalRooms*100),vacantRooms:totalRooms-occRooms,
      expectedIncome:expectedMo,landlordCosts:landlordMo,netProfit:expectedMo-landlordMo},
    tenants:{active:active.length,onNotice:notice.length,inArrears:arrears.length,totalArrears:arrTotal,
      arrearsDetails:arrears.slice(0,5).map(function(t){return {name:t.name,property:t.property,arrears:t.arrears};})},
    voids:{count:vacant.length,dailyLoss:dailyVoidLoss,monthlyLoss:dailyVoidLoss*30,
      longestVoids:vacant.sort(function(a,b){return b.days-a.days;}).slice(0,5)},
    landlordPayments:{overdueCount:llOverdue.length,overdueTotal:llOverdueTotal,
      overdueItems:llOverdue.slice(0,5).map(function(p){return {landlord:p.landlordName,property:p.property,amount:p.amount,month:p.monthLabel};})},
    maintenance:{openCount:openMaint.length,urgentCount:urgentMaint.length,
      urgentItems:urgentMaint.slice(0,5).map(function(m){return {property:m.property,issue:m.issue,room:m.room};})}
  };
}

async function runAIAgent(forceRefresh) {
  var key = getAgentApiKey();
  if(!key){ document.getElementById('ai-agent-output').innerHTML=renderAgentKeyPrompt(); return; }
  var cached=localStorage.getItem('pm_agent_cache');
  var cacheTs=+(localStorage.getItem('pm_agent_cache_ts')||0);
  var age=(Date.now()-cacheTs)/3600000;
  if(!forceRefresh&&cached&&age<6){ document.getElementById('ai-agent-output').innerHTML=cached; return; }
  _agentRunning=true;
  document.getElementById('ai-agent-output').innerHTML=renderAgentLoading();
  var snap=buildPortfolioSnapshot();
  var prompt='You are a property management analyst for a South London HMO portfolio. Analyse the following data and return ONLY valid JSON.\n\nPortfolio Snapshot ('+snap.date+'):\n'+JSON.stringify(snap,null,2)+'\n\nReturn ONLY this JSON structure:\n{"score":<0-100>,"scoreLabel":"<Excellent|Good|Needs Attention|Critical>","scoreColor":"<green|amber|red>","summary":"<2 sentences>","insights":[{"icon":"<emoji>","title":"<short>","body":"<1-2 sentences>","priority":"<high|medium|low>"}],"tasks":[{"icon":"<emoji>","task":"<specific action>","urgency":"<urgent|today|this-week>"}]}\n\nRules: exactly 4 insights (arrears, voids, landlord payments, maintenance). 3-5 tasks. Be specific with names and numbers.';
  try {
    var res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})
    });
    var data=await res.json();
    if(data.error){throw new Error(data.error.message);}
    var text=(data.content||[]).map(function(b){return b.text||'';}).join('');
    text=text.replace(/```json|```/g,'').trim();
    var parsed=JSON.parse(text);
    var html=renderAgentResult(parsed,snap.date);
    localStorage.setItem('pm_agent_cache',html);
    localStorage.setItem('pm_agent_cache_ts',Date.now());
    document.getElementById('ai-agent-output').innerHTML=html;
  } catch(err){
    document.getElementById('ai-agent-output').innerHTML=renderAgentError(err.message);
  }
  _agentRunning=false;
}

var SAVE_KEYS=['tenants','properties','payments','rentSchedule','expenses','maintenance',
               'landlords','landlordPayments','roomMedia','lateFeeConfig','users','voidDates','vault','propDocs'];
// ── saveState: debounced upsert to Supabase ───────────────
var _saveTimer = null;
function saveState(){
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(_doSupaSave, 1500);
  // Save local-only state immediately to localStorage
  try {
    var localKeys = ['rentSchedule','roomMedia','vault','voidDates','lateFeeConfig','propDocs'];
    localKeys.forEach(function(k){
      if(state[k]!==undefined) {
        try {
          var val = state[k];
          // Strip data-URL (local-only) photos from roomMedia before persisting to
          // localStorage – they can be several MB each and will exceed the ~5 MB quota.
          // Only Supabase-backed URLs (small strings) are persisted; data URLs are
          // transient in-memory only.
          if(k === 'roomMedia') {
            var stripped = {};
            Object.keys(val).forEach(function(rk) {
              var entry = val[rk];
              var persistedPhotos = (entry.photos || []).filter(function(ph) {
                return ph && ph.src && !ph.src.startsWith('data:') && !ph._localOnly;
              });
              if(persistedPhotos.length > 0 || entry.video || entry.notes) {
                stripped[rk] = { photos: persistedPhotos, video: entry.video || null, notes: entry.notes || '' };
              }
            });
            val = stripped;
          }
          localStorage.setItem('pm_local_'+k, JSON.stringify(val));
        }
        catch(e) { console.warn('localStorage full for key:', k, e); }
      }
    });
  } catch(e) {}
}

async function _supaUpsert(table, rows, opts) {
  try {
    var r = await supa.from(table).upsert(rows, opts);
    if(r.error) console.warn('Save warning ['+table+']:', r.error.message);
  } catch(e) { console.warn('Save error ['+table+']:', e.message); }
}

async function _doSupaSave(){
  // Save each table independently so one failure doesn't block others
  var landlordRows = state.landlords.map(landlordToRow);
  var propRows = state.properties.map(function(p){
    var r = propToRow(p);
    delete r.room_list; // stored in rooms table, not needed in upsert
    return r;
  });
  var tenantRows = state.tenants.map(function(t){
    var r = tenantToRow(t);
    // Only include portal columns if they have values
    if(!r.portal_username) delete r.portal_username;
    if(!r.portal_password) delete r.portal_password;
    return r;
  });

  await Promise.all([
    _supaUpsert('landlords', landlordRows, {onConflict:'id'}),
    _supaUpsert('properties', propRows, {onConflict:'id'}),
    _supaUpsert('tenants', tenantRows, {onConflict:'id'}),
    _supaUpsert('payments', state.payments.map(paymentToRow), {onConflict:'id'}),
    _supaUpsert('expenses', state.expenses.map(expenseToRow), {onConflict:'id'}),
    _supaUpsert('maintenance', state.maintenance.map(maintenanceToRow), {onConflict:'id'}),
    _supaUpsert('landlord_payments',
      state.landlordPayments.filter(function(lp){return lp.propId&&lp.monthKey;}).map(landlordPaymentToRow),
      {onConflict:'property_id,month_key',ignoreDuplicates:false})
  ]);
  if(typeof showToast === 'function') showToast('✓ Saved', 'success');
}
// ── loadState: fetch all data from Supabase ───────────────
async function loadState(){
  try{
    var results = await Promise.all([
      supa.from('landlords').select('*'),
      supa.from('properties').select('*'),
      supa.from('tenants').select('*'),
      supa.from('payments').select('*'),
      supa.from('expenses').select('*'),
      supa.from('maintenance').select('*'),
      supa.from('landlord_payments').select('*')
    ]);
    var errors = results.filter(function(r){ return r.error; });
    if(errors.length){ console.warn('Supabase load errors:', errors); }
    state.landlords        = (results[0].data||[]).map(rowToLandlord);
    state.properties       = (results[1].data||[]).map(rowToProp);
    state.tenants          = (results[2].data||[]).map(rowToTenant);
    state.payments         = (results[3].data||[]).map(rowToPayment);
    state.expenses         = (results[4].data||[]).map(rowToExpense);
    state.maintenance      = (results[5].data||[]).map(rowToMaintenance);
    state.landlordPayments = (results[6].data||[]).map(rowToLandlordPayment);
    // Compute t.paid from most recent payment for each tenant
    state.tenants.forEach(function(t){
      var tenantPays = state.payments.filter(function(p){
        return (p.tenantId===t.id||p.tenantName===t.name) && p.status==='paid' && p.paidDate;
      });
      if(tenantPays.length){
        tenantPays.sort(function(a,b){return new Date(b.paidDate)-new Date(a.paidDate);});
        var d = new Date(tenantPays[0].paidDate);
        t.paid = d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
      }
    });
    // Restore local-only state from localStorage
    try {
      var localKeys = ['rentSchedule','roomMedia','vault','voidDates','lateFeeConfig','propDocs'];
      localKeys.forEach(function(k){
        var raw = localStorage.getItem('pm_local_'+k);
        if(raw) { try{ state[k]=JSON.parse(raw); }catch(e){} }
      });
    } catch(e) {}
    // Load room photos from Supabase Storage (source of truth across devices/sessions)
    try {
      var storageResult = await supa.storage.from('room-media').list('rooms', { limit: 500 });
      if (!storageResult.error && storageResult.data && storageResult.data.length > 0) {
        for (var _si = 0; _si < storageResult.data.length; _si++) {
          var _propFolder = storageResult.data[_si];
          if (!_propFolder || !_propFolder.name) continue;
          var _spid = _propFolder.name;
          var _roomsResult = await supa.storage.from('room-media').list('rooms/' + _spid, { limit: 100 });
          if (_roomsResult.error || !_roomsResult.data) continue;
          for (var _ri = 0; _ri < _roomsResult.data.length; _ri++) {
            var _roomFolder = _roomsResult.data[_ri];
            var _srn = parseInt(_roomFolder.name);
            if (isNaN(_srn)) continue;
            var _photosResult = await supa.storage.from('room-media').list('rooms/' + _spid + '/' + _srn, { limit: 20 });
            if (_photosResult.error || !_photosResult.data || _photosResult.data.length === 0) continue;
            var _media = getMedia(_spid, _srn);
            _photosResult.data.forEach(function(_file) {
              if (!_file || !_file.name) return;
              var _path = 'rooms/' + _spid + '/' + _srn + '/' + _file.name;
              var _urlData = supa.storage.from('room-media').getPublicUrl(_path);
              var _url = _urlData.data.publicUrl;
              var _exists = _media.photos.some(function(ph) { return ph.src === _url || ph.path === _path; });
              if (!_exists) {
                _media.photos.push({ src: _url, name: _file.name, path: _path });
              }
            });
          }
        }
        console.log('Room photos loaded from Supabase Storage');
        try { localStorage.setItem('pm_local_roomMedia', JSON.stringify(state.roomMedia)); } catch(e) {}
      }
    } catch(_se) { console.warn('Room storage load error:', _se); }

    // Migrate roomMedia keys from old numeric ids to new UUID ids
    if(state.roomMedia && Object.keys(state.roomMedia).length > 0) {
      var newMedia = {};
      state.properties.forEach(function(p) {
        // Find old numeric key entries for this property
        Object.keys(state.roomMedia).forEach(function(oldKey) {
          // Check if this is a numeric-id key for this property
          var parts = oldKey.split('_');
          if(parts.length >= 2) {
            var lastNum = parts[parts.length-1];
            var possibleOldId = parts.slice(0,-1).join('_');
            // Try to match by property name (numeric IDs were 1001, 1002 etc)
            var oidNum = parseInt(possibleOldId);
            if(!isNaN(oidNum) && oidNum >= 1000 && oidNum <= 2000) {
              // This looks like an old numeric key - remap to use actual p.id
              // We can't perfectly match but copy under new key too
              var newKey = p.id + '_' + lastNum;
              if(state.roomMedia[oldKey] && state.roomMedia[oldKey].photos && state.roomMedia[oldKey].photos.length > 0) {
                newMedia[newKey] = state.roomMedia[oldKey];
              }
            } else {
              newMedia[oldKey] = state.roomMedia[oldKey];
            }
          }
        });
      });
      if(Object.keys(newMedia).length > 0) state.roomMedia = newMedia;
    }
    // Back-fill propName for landlord payments loaded from Supabase
    state.landlordPayments.forEach(function(lp){
      if((!lp.propName||lp.propName==='') && lp.propId){
        var p = state.properties.find(function(x){return x.id===lp.propId;});
        if(p) lp.propName = p.name;
      }
      if((!lp.landlordName||lp.landlordName==='') && lp.landlordId){
        var ll = state.landlords.find(function(x){return x.id===lp.landlordId;});
        if(ll) lp.landlordName = ll.name;
      }
    });
    console.log('Loaded from Supabase:', state.landlords.length, 'landlords,', state.properties.length, 'props,', state.tenants.length, 'tenants');
  }catch(e){
    console.error('loadState error:', e);
    showToast && showToast('Database error — running in offline mode', 'error');
  }
}
async function backfillPaymentDueDates() {
  // Fix existing Supabase payments that have due_date=null by using paid_date as proxy
  // This clears phantom outstanding entries caused by null due_date dedup failure
  var toFix = state.payments.filter(function(p) {
    return !p.dueDate && p.paidDate;
  });
  if(toFix.length === 0) {
    showToast('No payments need fixing ✓', 'success');
    return;
  }
  showToast('Fixing ' + toFix.length + ' payments...', 'success');
  var fixed = 0;
  for(var i = 0; i < toFix.length; i++) {
    var p = toFix[i];
    // Use paid_date as due_date proxy — close enough for weekly dedup
    var paidStr = p.paidDate;
    var parts = String(paidStr).replace(/[^0-9\-]/g,'').split('T')[0];
    var isoDate = null;
    // Try to parse "21 Mar 2026" format (en-GB locale)
    if(paidStr && paidStr.match(/^\d{2} [A-Za-z]{3} \d{4}$/)) {
      var months = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
      var dp = paidStr.split(' ');
      var dt = new Date(+dp[2], months[dp[1]], +dp[0]);
      isoDate = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    } else if(paidStr && paidStr.match(/\d{4}-\d{2}-\d{2}/)) {
      isoDate = paidStr.split('T')[0];
    }
    if(!isoDate) continue;
    p.dueDate = isoDate;
    var pp = paidStr.split('T')[0].split('-');
    p._dueDateRaw = isoDate.split('-').length===3 ? new Date(+isoDate.split('-')[0],+isoDate.split('-')[1]-1,+isoDate.split('-')[2]).getTime() : null;
    // Update Supabase
    try {
      await supa.from('payments').update({due_date: isoDate}).eq('id', p.id);
      fixed++;
    } catch(e) {}
  }
  saveState();
  render();
  showToast('Fixed ' + fixed + ' of ' + toFix.length + ' payments ✓', 'success');
}

function clearSavedState(){
  SAVE_KEYS.forEach(function(k){localStorage.removeItem('pm_'+k);});
  localStorage.removeItem('pm_uid');
  location.reload();
}
var _origRender=render;
render=function(){_origRender();if(state.page==='dashboard'){setTimeout(renderDashboardAgent,100);}};
loadState().then(function(){
// ALWAYS resync property occupancy, room prices and income from tenants.
// This runs after loadState() so it corrects any stale localStorage data too.
(function syncPropertiesFromTenants() {
  state.properties.forEach(function(p){
    if(!p.roomList) return;
    p.roomList.forEach(function(r){
      var tenant = state.tenants.find(function(t){
        return t.property===p.name && t.room===r.n && t.status!=='inactive';
      });
      r.status = tenant ? 'occupied' : 'vacant';
      if(tenant && tenant.rent > 0) r.price = tenant.rent;
    });
    p.occupied = p.roomList.filter(function(r){return r.status==='occupied';}).length;
    // Backfill vacant room prices from property average so void tracker works
    var occupiedPrices = p.roomList.filter(function(r){return r.status==='occupied'&&r.price>0;}).map(function(r){return r.price;});
    if(occupiedPrices.length) {
      var avgPrice = Math.round(occupiedPrices.reduce(function(s,v){return s+v;},0)/occupiedPrices.length);
      p.roomList.forEach(function(r){if(r.status==='vacant'&&r.price===0) r.price=avgPrice;});
    }
    var propTenants = state.tenants.filter(function(t){return t.property===p.name&&t.status!=='inactive';});
    p.rent = Math.round(propTenants.reduce(function(s,t){
      return s + (t.freq==='monthly' ? t.rent : (t.rent||0)*52/12);
    }, 0));
  });
})();
// Always rebuild schedule on load so date changes take effect immediately
rebuildAllSchedules();
// Reconcile regenerated schedule entries with confirmed payments from Supabase.
// rebuildAllSchedules() resets all statuses to overdue/upcoming based on today's
// date; this pass restores 'paid' status on entries that already have a matching
// payment record, preventing paid entries from re-appearing as overdue on reload.
(function reconcileScheduleWithPayments() {
  state.rentSchedule.forEach(function(s) {
    var match = state.payments.find(function(p) {
      if (p.status !== 'paid') return false;
      var sameT = (p.tenantId && p.tenantId === s.tenantId) ||
                  (p.tenantName || p.tenant) === s.tenantName;
      if (!sameT) return false;
      var pRaw = p._dueDateRaw || (p.dueDate ? new Date(p.dueDate).getTime() : 0);
      var diff = Math.abs(pRaw - s.dueDateRaw);
      return diff < 4 * 86400000; // within 4 days = same billing period
    });
    if (match) {
      s.status = 'paid';
      s.paidDate   = match.paidDate   || match.date;
      s.paidMethod = match.paidMethod || match.method;
    }
  });
})();

// Auto move-out tenants whose notice move-out date has passed
(function autoMoveOut() {
  var today = new Date();
  today.setHours(0,0,0,0);
  state.tenants.forEach(function(t) {
    if(t.status === 'notice_given' && t.moveOutDate) {
      var moveOut = new Date(t.moveOutDate);
      moveOut.setHours(0,0,0,0);
      if(moveOut <= today) {
        t.status = 'inactive';
        freeRoom(t.property, t.room);
      }
    }
  });
})();

render();
}); // end loadState().then
