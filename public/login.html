<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PropManager — Log in</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/css/login.css">
<script src="/config.js"></script>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-grid"></div>

<div class="card">
  <div class="logo">Prop<span>Manager</span></div>
  <p class="tagline">South London HMOs</p>

  <!-- Auth tabs -->
  <div class="tabs" id="auth-tabs">
    <button class="tab active" onclick="switchTab('login')">Log in</button>
    <button class="tab" onclick="switchTab('signup')">Sign up</button>
  </div>

  <!-- Message -->
  <div class="msg" id="msg"></div>

  <!-- LOGIN FORM -->
  <form id="login-form" onsubmit="handleLogin(event)">
    <div class="field">
      <label>Email address</label>
      <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" required>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="login-password" placeholder="Your password" autocomplete="current-password" required>
        <button type="button" class="pw-toggle" onclick="togglePw('login-password',this)">👁</button>
      </div>
    </div>
    <div class="forgot"><a href="#" onclick="showForgot(event)">Forgot password?</a></div>
    <button type="submit" class="btn-submit" id="login-btn">
      <div class="spinner" id="login-spinner"></div>
      <span id="login-btn-text">Log in</span>
    </button>
  </form>

  <!-- SIGNUP FORM -->
  <form id="signup-form" style="display:none" onsubmit="handleSignup(event)">

    <div class="field">
      <label>Full name</label>
      <input type="text" id="signup-name" placeholder="Gleydson De Paula" autocomplete="name" required>
    </div>
    <div class="field">
      <label>Company / portfolio name</label>
      <input type="text" id="signup-company" placeholder="e.g. Reservations Direct" autocomplete="organization">
    </div>
    <div class="field">
      <label>Email address</label>
      <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email" required>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="signup-password" placeholder="Min 8 characters" autocomplete="new-password" required minlength="8">
        <button type="button" class="pw-toggle" onclick="togglePw('signup-password',this)">👁</button>
      </div>
    </div>
    <button type="submit" class="btn-submit" id="signup-btn">
      <div class="spinner" id="signup-spinner"></div>
      <span id="signup-btn-text">Create account</span>
    </button>
    <div style="text-align:center;margin-top:12px;font-size:12px;color:var(--dim)">
      No credit card required · Cancel anytime
    </div>
  </form>

  <!-- RESET FORM -->
  <div id="forgot-title" style="display:none;margin-bottom:24px">
    <div style="font-size:18px;font-weight:700;color:var(--white);margin-bottom:6px">Reset your password</div>
    <div style="font-size:13px;color:var(--silver)">Enter your email and we'll send a reset link.</div>
  </div>
  <form id="reset-form" onsubmit="handleReset(event)" style="display:none">
    <div class="field">
      <label>Email address</label>
      <input type="email" id="reset-email" placeholder="you@example.com" autocomplete="email" required>
    </div>
    <button type="submit" class="btn-submit" id="reset-btn">
      <div class="spinner" id="reset-spinner"></div>
      <span id="reset-btn-text">Send reset link</span>
    </button>
    <div style="text-align:center;margin-top:14px">
      <a href="#" onclick="hideForgot()" style="font-size:13px;color:var(--silver);text-decoration:none">← Back to log in</a>
    </div>
  </form>

  <!-- RESET SUCCESS -->
  <div id="reset-success" style="display:none">
    <div class="reset-icon">📬</div>
    <div class="reset-title">Check your email</div>
    <p class="reset-sub">We've sent a password reset link to your email. Click the link to set a new password.</p>
    <button class="btn-submit" onclick="showReset(null,false)" style="margin-top:24px">Back to log in</button>
  </div>

  <div class="back" id="back-link">
    <a href="propmanager-landing.html">← Back to home</a>
  </div>
</div>

<script src="/js/login.js"></script>


</body>
</html>
