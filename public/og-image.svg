<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative blob -->
  <circle cx="1080" cy="100" r="220" fill="#14B8A6" opacity="0.08"/>
  <circle cx="120" cy="540" r="180" fill="#10B981" opacity="0.06"/>
  <!-- Logo box -->
  <rect x="80" y="80" width="64" height="64" rx="14" fill="url(#brand)"/>
  <text x="112" y="125" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800" fill="#0F172A" text-anchor="middle">🏠</text>
  <!-- Brand text -->
  <text x="160" y="125" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">landlordapp</text>
  <text x="349" y="125" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="500" fill="#14B8A6">.io</text>
  <!-- Headline -->
  <text x="80" y="290" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="800" fill="#F8FAFC">Property management</text>
  <text x="80" y="365" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="800" fill="url(#brand)">built for HMO &amp; R2R</text>
  <!-- Subhead -->
  <text x="80" y="430" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="500" fill="#94A3B8">Rent · compliance · maintenance · landlord payments</text>
  <text x="80" y="466" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="500" fill="#94A3B8">All in one place. Free for 3 properties.</text>
  <!-- Pills -->
  <rect x="80" y="520" width="180" height="48" rx="24" fill="#14B8A6"/>
  <text x="170" y="551" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">Start free →</text>
  <rect x="280" y="520" width="220" height="48" rx="24" fill="none" stroke="#475569" stroke-width="2"/>
  <text x="390" y="551" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#CBD5E1" text-anchor="middle">landlordapp.io</text>
</svg>
